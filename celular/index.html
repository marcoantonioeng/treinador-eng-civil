  ce('NBT21', F_IN, 'ti', cSeg, 'O worm, diferentemente do vírus, precisa ser anexado a um arquivo hospedeiro e depende da execução desse arquivo pelo usuário para se propagar.', 'E',
    'Errado. É o contrário. O vírus se anexa a arquivos e depende de execução. O worm se propaga sozinho pela rede, explorando vulnerabilidades, sem hospedeiro.');
  ce('NBT22', F_IN, 'ti', cSeg, 'No backup incremental, são copiados apenas os arquivos criados ou alterados desde o último backup realizado, seja ele completo ou incremental.', 'C',
    'Certo. O backup diferencial, por sua vez, copia o que mudou desde o último backup completo.');
  ce('NBT23', F_IN, 'ti', cSeg, 'Um firewall corretamente configurado dispensa o uso de antivírus, pois bloqueia qualquer código malicioso que chegue ao computador.', 'E',
    'Errado. O firewall filtra conexões conforme regras, mas não analisa todo o conteúdo dos arquivos. Malware recebido por e-mail, download ou pendrive passa por ele. Antivírus e firewall são complementares.');
  ce('NBT24', F_IN, 'ti', cSeg, 'A autenticação multifator combina fatores de categorias diferentes, como algo que o usuário sabe (senha) e algo que ele possui (token ou celular).', 'C',
    'Certo. As categorias são: algo que se sabe, algo que se tem e algo que se é (biometria). Duas senhas não formam autenticação multifator.');

  var cIa = 'Acerca de conceitos de inteligência artificial (IA), julgue o item.';
  ce('NBT25', F_IN, 'ti', cIa, 'No aprendizado supervisionado, o modelo é treinado com exemplos rotulados, isto é, com as respostas esperadas, como em tarefas de classificação e de regressão.', 'C',
    'Certo. Exemplo: classificar e-mails como spam ou não spam a partir de mensagens já rotuladas.');
  ce('NBT26', F_IN, 'ti', cIa, 'O agrupamento (clusterização) de documentos por similaridade, sem categorias previamente definidas, é exemplo típico de aprendizado por reforço.', 'E',
    'Errado. Agrupar dados sem rótulos é tarefa de aprendizado não supervisionado.');
  ce('NBT27', F_IN, 'ti', cIa, 'No aprendizado por reforço, um agente aprende por tentativa e erro, recebendo recompensas ou penalidades em razão das ações que executa no ambiente.', 'C',
    'Certo. O agente busca a política de ações que maximize a recompensa acumulada, como em jogos e robótica.');
  ce('NBT28', F_IN, 'ti', cIa, 'Modelos de IA generativa, como os grandes modelos de linguagem, podem produzir respostas plausíveis, mas factualmente incorretas, fenômeno conhecido como alucinação.', 'C',
    'Certo. Por isso, conteúdo gerado por IA deve ser conferido em fontes confiáveis, sobretudo citações de leis, números e referências.');
  ce('NBT29', F_IN, 'ti', cIa, 'Na engenharia de prompts, fornecer contexto, especificar o formato desejado da resposta e incluir exemplos tende a melhorar a qualidade das respostas de um modelo de linguagem.', 'C',
    'Certo. Instruções claras, papel, contexto, restrições, formato de saída e exemplos reduzem a ambiguidade do pedido.');
  ce('NBT30', F_IN, 'ti', cIa, 'A técnica de prompt denominada few-shot consiste em pedir ao modelo que execute uma tarefa sem fornecer nenhum exemplo dela.', 'E',

  ce('NBT31', F_IN, 'ti', cIa, 'Inserir documentos sigilosos ou dados pessoais em ferramentas públicas de IA generativa não traz riscos, pois esses serviços não armazenam nem processam os conteúdos enviados.', 'E',
    'Errado. Os conteúdos enviados são processados e podem ser armazenados ou usados conforme os termos do serviço. Dados sigilosos ou pessoais exigem ferramentas autorizadas pela organização, em respeito à LGPD e às normas de segurança.');
  ce('NBT32', F_IN, 'ti', cIa, 'O sobreajuste (overfitting) ocorre quando o modelo se ajusta excessivamente aos dados de treinamento e perde a capacidade de generalizar para dados novos.', 'C',
    'Certo. O modelo memoriza ruídos do treino: acerta muito nos dados conhecidos e erra nos novos. Detecta-se comparando o desempenho em dados de teste.');
  ce('NBT33', F_IN, 'ti', cIa, 'Textos produzidos com apoio de IA generativa e usados em documentos oficiais devem ser revisados por pessoa responsável, que responde pelo conteúdo, em atenção à ética e à responsabilidade digital no serviço público.', 'C',
    'Certo. A ferramenta não assume responsabilidade. O agente público responde pela correção, pela legalidade e pela adequação do que assina.');

  var cDados = 'Acerca de dados e de visualização de dados, julgue o item.';
  ce('NBT34', F_IN, 'ti', cDados, 'O histograma é indicado para mostrar a distribuição de frequências de uma variável quantitativa contínua agrupada em classes, com barras adjacentes.', 'C',
    'Certo. As barras encostadas indicam a continuidade dos intervalos. Gráficos de barras comuns, com barras separadas, servem a categorias.');
  ce('NBT35', F_IN, 'ti', cDados, 'O gráfico de linhas é o mais indicado para comparar a participação de poucas categorias na composição de um total em um único momento.', 'E',
    'Errado. Gráfico de linhas é próprio para séries temporais. Para partes de um todo, usam-se barras (inclusive empilhadas a 100%) ou, com poucas categorias, setores.');
  ce('NBT36', F_IN, 'ti', cDados, 'O box plot exibe a mediana, os quartis e a amplitude dos dados e permite identificar valores discrepantes (outliers).', 'C',
    'Certo. A caixa vai do primeiro ao terceiro quartil, a linha interna marca a mediana, e pontos além das hastes indicam valores atípicos.');
  ce('NBT37', F_IN, 'ti', cDados, 'O gráfico de dispersão é adequado para investigar a relação entre duas variáveis quantitativas, como o orçamento e o prazo de execução de obras.', 'C',
    'Certo. Cada ponto é uma observação, e a forma da nuvem sugere correlação positiva, negativa ou ausência de relação.');
  ce('NBT38', F_IN, 'ti', cDados, 'No Power BI, o Power Query é usado para obter e transformar dados, enquanto a linguagem DAX é usada para criar medidas e colunas calculadas.', 'C',
    'Certo. O Power Query faz a etapa de ETL (extração, transformação e carga). O DAX trabalha sobre o modelo de dados já carregado.');
  ce('NBT39', F_IN, 'ti', cDados, 'Em gráficos de barras, iniciar o eixo vertical em valor diferente de zero pode exagerar visualmente as diferenças entre as categorias.', 'C',
    'Certo. O comprimento da barra codifica o valor, e um eixo truncado distorce essa proporção.');
  ce('NBT40', F_IN, 'ti', cDados, 'Em storytelling com dados, recomenda-se incluir o maior número possível de gráficos e cores em cada painel, para que o público tenha acesso a todas as informações ao mesmo tempo.', 'E',
    'Errado. Storytelling com dados parte de uma mensagem principal para um público definido e reduz a poluição visual, destacando o que importa.');
})();

<script>
/*
 * Câmara dos Deputados 2025 (Cebraspe, aplicação em 8/3/2026) · Conhecimentos Gerais
 * Caderno 167_CDNS_CG1_01. Gabarito definitivo oficial, já com as alterações após recursos
 * (itens 25 e 30 anulados; item 40 alterado de E para C).
 *
 * Entram 78 itens: Língua Portuguesa (1–26, menos o 25), Língua Inglesa (27–36, menos o 30),
 * Direito Administrativo (47–68) e Administração Pública (69–90). Os itens 37–46 (raciocínio lógico
 * e estatística) ficam de fora porque o edital do cargo 6 não cobra essa disciplina.
 * O gabarito é o oficial. As justificativas são do treinador, com base na lei e na doutrina.
 *
 * Conhecimentos Específicos do cargo 1 (Processo Legislativo e Gestão, CD-AL-011), caderno 167_CDNS_001_01,
 * gabarito definitivo (anulados 93, 97, 115, 117, 126, 155 e 166; item 167 alterado de E para C).
 * Entram só os 36 itens cujo assunto está nos Conhecimentos Básicos do cargo 6 (edital, 14.2.3):
 * Regimento Interno nos artigos cobrados (91–101), Regimento Comum (102–103), Constituição — Poder
 * Legislativo e servidores (106–124, exceto os de funções essenciais à justiça, segurança pública,
 * procedimento regimental fora dos artigos do edital e orçamento), gestão de riscos (139) e TI e dados
 * (168–180, exceto o 167, sobre Windows, que o edital não cobra). Ficam de fora Código de Ética, teoria
 * política, atualidades, gestão organizacional e hardware.
 *
 * Itens inéditos que repetiam assuntos agora cobertos por itens reais saem do banco
 * (NBA09, NBA16, NBA17, NBA21, NBC05, NBC06, NBC32 e NBT21).
 */
(function () {
  var SAI = { NBA09: 1, NBA16: 1, NBA17: 1, NBA21: 1, NBC05: 1, NBC06: 1, NBC32: 1, NBT21: 1 };
  for (var i = window.QUESTOES.length - 1; i >= 0; i--) {
    if (SAI[window.QUESTOES[i].id]) window.QUESTOES.splice(i, 1);
  }

  var Q = window.QUESTOES;
  var F = 'Câmara dos Deputados 2025 · Cebraspe · item ';
  function ce(n, tema, ctx, enun, gab, just) {
    Q.push({ id: 'CD25G' + (n < 10 ? '0' + n : n), fonte: F + n, tema: tema, tipo: 'CE', contexto: ctx || '', enunciado: enun, gabarito: gab, justificativa: just, figura: null });
  }

  /* ===================== LÍNGUA PORTUGUESA ===================== */
  var tLs = 'Leia o texto. [1] Linguagem Simples é o nome dado no Brasil a um conjunto de técnicas de redação e de design da informação usadas para produzir textos claros para o público-alvo das comunicações oficiais. [2] Quando falamos em “público-alvo”, estamos tratando especificamente da parcela da população a quem a informação se destina. Uma pessoa pode, por exemplo, redigir um texto para um site de câmara municipal com o objetivo de que seja compreendido por cidadãos com ensino médio completo; um folheto sobre malária para uma população ribeirinha de baixa escolaridade; ou, ainda, um estudo legislativo para embasar o trabalho de um deputado. Em qualquer dessas situações, tanto o público como a instituição vão se beneficiar do uso da Linguagem Simples. [3] Embora no Brasil o termo “Linguagem Simples” tenha prevalecido, o mote da técnica não é exatamente “quanto mais simples, melhor”, mas “quanto mais claro, melhor”. Tendo-se em mente que a clareza, e não a simplicidade, é a meta última da técnica, é possível e desejável usá-la até mesmo para redigir um texto técnico para o público especialista em determinado assunto. Em casos como esse, trocar palavras difíceis por outras mais fáceis não será a primeira preocupação. [4] A Linguagem Simples vai muito além da escolha de palavras. A técnica engloba diretrizes relacionadas à arquitetura da informação, à estrutura das frases e ao design, com o objetivo de reduzir o tempo e a dificuldade para o cérebro processar informações. (Patrícia Roedel. Manual de linguagem simples. Câmara dos Deputados, 2024, com adaptações.) Com base nas ideias e nos aspectos linguísticos do texto, julgue o item.';
  ce(1, 'portugues', tLs, 'No primeiro período do segundo parágrafo, o emprego da vírgula imediatamente após ‘público-alvo’ é obrigatório e se justifica pela necessidade de serem separadas duas orações que apresentam o mesmo sujeito.', 'E',
    'Errado. A vírgula separa a oração subordinada adverbial temporal anteposta (“Quando falamos em ‘público-alvo’”) da oração principal. O motivo não é haver duas orações com o mesmo sujeito; sujeito igual nunca é, por si, razão para vírgula.');
  ce(2, 'portugues', tLs, 'Seria mantida a correção gramatical do primeiro período do texto caso o termo “usadas” fosse substituído por usado.', 'C',
    'Certo. Em “um conjunto de técnicas (...) usadas”, o particípio pode concordar com “técnicas” ou com o núcleo “conjunto”. As duas concordâncias são corretas.');
  ce(3, 'portugues', tLs, 'O texto informa que Linguagem Simples é um padrão de linguagem com estruturas linguísticas e palavras próprias que se volta à simplificação dos textos para a completa assimilação do seu conteúdo pelo público a que tais textos se destinam.', 'E',
    'Errado. O texto define a Linguagem Simples como um conjunto de técnicas de redação e de design voltado à clareza, não como um padrão com palavras próprias. Também afirma que a meta é a clareza, e não a simplicidade.');
  ce(4, 'portugues', tLs, 'A substituição de “a meta última” (segundo período do terceiro parágrafo) por a última meta alteraria o sentido veiculado originalmente no texto e poderia comprometer a coerência textual.', 'C',
    'Certo. Posposto, “última” significa final, fundamental: a clareza é o objetivo maior. Anteposto, “a última meta” indica a derradeira de uma série, o que muda o sentido.');
  ce(5, 'portugues', tLs, 'Segundo o texto, apesar de a Linguagem Simples ir além da mera seleção vocabular, o cuidado com essa seleção varia conforme a complexidade do gênero textual e do público-alvo, indo de importante, passando a secundário, até ser considerado irrelevante.', 'E',
    'Errado. Para o público especialista, o texto diz apenas que trocar palavras difíceis “não será a primeira preocupação”. Em nenhum momento a escolha vocabular é dada como irrelevante.');
  ce(6, 'portugues', tLs, 'Conforme o texto, a clareza é uma das ferramentas usadas na Linguagem Simples com o fim de simplificar os temas tratados nos textos, permitindo-se, assim, que eles sejam plenamente entendidos pela população como um todo.', 'E',
    'Errado. A clareza é a “meta última” da técnica, não uma ferramenta. O texto também não fala em simplificar os temas nem em atingir a população como um todo, mas o público-alvo de cada comunicação.');
  ce(7, 'portugues', tLs, 'No segundo parágrafo, os termos preposicionados “por cidadãos com ensino médio completo” (segundo período) e “do uso da Linguagem Simples” (último período) desempenham a mesma função sintática nas orações em que ocorrem — ambas na voz passiva.', 'E',
    'Errado. “Por cidadãos...” é agente da passiva de “seja compreendido”. Já “do uso da Linguagem Simples” complementa o verbo pronominal “beneficiar-se” (objeto indireto), em oração na voz ativa.');
  ce(8, 'portugues', tLs, 'A forma pronominal “se”, em “vão se beneficiar” (último período do segundo parágrafo), poderia ser corretamente deslocada para imediatamente após a forma verbal infinitiva, da seguinte forma: vão beneficiar-se.', 'C',
    'Certo. Na locução com infinitivo e sem fator de próclise, o pronome pode ficar entre os verbos ou enclítico ao infinitivo. “Vão beneficiar-se” é correto.');
  ce(9, 'portugues', tLs, 'Visto que, no primeiro período do terceiro parágrafo, a locução verbal “tenha prevalecido” corresponde ao tempo pretérito, conclui-se que o verbo da oração principal do período está empregado no presente histórico, em obediência ao paralelismo temporal.', 'E',
    'Errado. O verbo principal “é” está no presente com valor atemporal (de verdade geral), e não no presente histórico, que narra fatos passados. A oração concessiva no pretérito perfeito do subjuntivo não impõe esse uso.');

  var tPant = 'Leia o texto. [1] A maior planície alagável do mundo está secando e ficando mais quente a um ritmo acelerado. Em quatro décadas, o pantanal, o menor bioma brasileiro, foi o que mais aqueceu e teve a maior redução na quantidade de chuvas. Essa dupla tendência, de mais calor e de menos pluviosidade, é visível em todos os ecossistemas nacionais — da amazônia, no Norte, que engloba quase metade da área do país, ao pampa, no Rio Grande do Sul, ainda que nesse bioma de forma bem menos perceptível. [2] Entre 1985 e 2024, a temperatura média no bioma subiu 0,47 °C por década. Em quatro décadas, o aumento acumulado no pantanal chega a quase 1,9 °C. O ritmo de crescimento do aquecimento no pantanal é 60% superior ao calculado no mesmo período para o Brasil como um todo e para os biomas amazônia e cerrado, que abrangem quase três quartos da área nacional. A velocidade de subida dos termômetros no pantanal é ainda cerca do dobro da apresentada na caatinga e na mata atlântica e mais que o triplo da do pampa nos 40 anos analisados. (Marcos Pivetta. Revista Pesquisa FAPESP, 2026, com adaptações.) Julgue o item, referente ao texto.';
  ce(10, 'portugues', tPant, 'O termo “brasileiro” (segundo período do primeiro parágrafo) desempenha a mesma função sintática dos termos “amazônia” e “cerrado” (terceiro período do segundo parágrafo): o primeiro modifica o nome “bioma”, e os dois últimos, “biomas”.', 'E',
    'Errado. “Brasileiro” é adjetivo e funciona como adjunto adnominal de “bioma”. “Amazônia” e “cerrado” são substantivos que especificam “biomas”, na função de aposto especificativo. As funções são diferentes.');
  ce(11, 'portugues', tPant, 'O trecho “superior ao calculado no mesmo período” (terceiro período do segundo parágrafo) poderia ser corretamente reescrito como superior aquele calculado em idêntico período.', 'E',
    'Errado. “Superior” rege a preposição “a”, que se funde ao pronome “aquele”: o correto é “superior àquele”. Sem o acento grave, a reescrita fica incorreta.');
  ce(12, 'portugues', tPant, 'Predomina, no segundo parágrafo do texto, a tipologia descritiva.', 'E',
    'Errado. O parágrafo apresenta dados e comparações para informar sobre o aquecimento do bioma. Predomina a tipologia expositiva (informativa), não a descrição de características de um ser ou cenário.');
  ce(13, 'portugues', tPant, 'De acordo com o texto, menor pluviosidade e aumento do calor no pantanal se caracterizam como um processo gradativo.', 'C',
    'Certo. O texto fala em tendência ao longo de quatro décadas, com alta de 0,47 °C por década e acúmulo de quase 1,9 °C: é um processo progressivo, ainda que acelerado.');

  var tUip = 'Leia o texto. [1] Novos dados da União Interparlamentar (UIP) e da ONU Mulheres revelam um progresso limitado no alcance da igualdade de gênero na liderança política. A edição de 2025 do mapa Mulheres na política mostra que os homens continuam a superar as mulheres em mais de três vezes nas posições executivas e legislativas em todo o mundo. [2] Globalmente, a presença feminina nos parlamentos subiu apenas 0,3%, alcançando 27,2% em relação ao ano anterior. Já nos ministérios, houve queda de 0,4%. Segundo Sima Bahous, diretora executiva da ONU Mulheres, o progresso não só é lento como há retrocesso em várias partes do mundo. “Trinta anos após a Declaração de Pequim, a promessa de igualdade de gênero na liderança política permanece não cumprida. Não podemos aceitar um mundo onde metade da população seja sistematicamente excluída da tomada de decisões”, frisou. [3] Bahous também lembrou que cotas, reformas eleitorais e vontade política são soluções para desmantelar barreiras sistêmicas. “O tempo das medidas paliativas acabou. É hora de os governos agirem para assegurar que as mulheres tenham um assento igual em todas as mesas onde o poder é exercido”, destacou. [4] A presidente da UIP, Tulia Ackson, classificou o ritmo de avanço como “glacial” e ressaltou a urgência de medidas concretas para garantir representação igualitária. O secretário-geral da UIP, Martin Chungong, defendeu o engajamento ativo de homens como parte da solução. [5] Ainda, o mapa de 2025 mostra que, enquanto as mulheres lideram importantes pastas ligadas a direitos humanos, igualdade de gênero e proteção social, os homens dominam áreas como relações exteriores, orçamento e defesa. (onumulheres.org.br, com adaptações.) Em relação às ideias e aos aspectos linguísticos do texto, julgue o item.';
  ce(14, 'portugues', tUip, 'As orações ‘para assegurar’ (terceiro período do terceiro parágrafo) e “para garantir representação igualitária” (primeiro período do quarto parágrafo) exercem função adverbial e expressam circunstância de finalidade.', 'E',
    'Errado. “Para assegurar...” liga-se ao verbo “agirem” e é adverbial final. Já “para garantir representação igualitária” especifica o nome “medidas” (medidas concretas para garantir...), com valor adjetivo, e não adverbial.');
  ce(15, 'portugues', tUip, 'Estariam mantidos os sentidos e a correção gramatical do texto caso o trecho “Ainda, o mapa de 2025 mostra que” (último parágrafo) fosse assim reescrito: O mapa de 2025 mostra, ainda, que.', 'C',
    'Certo. “Ainda” tem valor de adição (além disso) nas duas posições. Deslocado e isolado por vírgulas, mantém o sentido e a correção.');
  ce(16, 'portugues', tUip, 'É facultativo o emprego do acento indicativo de crase no vocábulo “as” em “superar as mulheres” (segundo período do primeiro parágrafo).', 'E',
    'Errado. “Superar” é transitivo direto e não exige preposição. “As” é só artigo, e a crase é impossível, não facultativa.');
  ce(17, 'portugues', tUip, 'Infere-se do texto que a UIP defende a proteção masculina às mulheres como medida concreta para a garantia de representação igualitária nos espaços de poder, o que sugere o enraizamento do posicionamento machista na sociedade.', 'E',
    'Errado. O secretário-geral defende o engajamento ativo dos homens como parte da solução, e não uma “proteção masculina”. A conclusão sobre machismo enraizado não decorre do texto.');
  ce(18, 'portugues', tUip, 'O ritmo de avanço das medidas para o alcance da igualdade de gênero na liderança política no mundo é considerado desalentador pela autoridade máxima da UIP.', 'C',
    'Certo. A presidente da UIP, sua autoridade máxima, chamou o ritmo de “glacial”, ou seja, lentíssimo e desanimador, e cobrou urgência.');
  ce(19, 'portugues', tUip, 'O vocábulo ‘paliativas’ (segundo período do terceiro parágrafo) poderia ser substituído, sem comprometimento da coerência das ideias do texto, por protelatórias.', 'C',
    'Certo (gabarito oficial). Medidas paliativas apenas amenizam o problema e adiam a solução real. No contexto, “protelatórias” (que adiam) preserva a crítica de Bahous e a coerência do texto.');
  ce(20, 'portugues', tUip, 'No primeiro período do quarto parágrafo, o emprego do termo presidenta em vez de “presidente” não só preservaria a correção do texto como também evidenciaria uma opção política de gênero, em consonância com os ideais de maior representatividade das mulheres nas esferas de poder.', 'C',
    'Certo. “Presidenta” é forma registrada nos dicionários e no VOLP. Escolhê-la marca o gênero feminino de forma explícita, o que se alinha ao tema do texto.');

  var tRac = 'Leia o texto. [1] Em 1988, ano do centenário da abolição da escravatura no Brasil, foi promulgada a atual Constituição Federal, a primeira a tratar da questão racial e a que tornou o racismo crime inafiançável e imprescritível. Naquele ano de memória e avanço civilizatório, foi feita uma pequena pesquisa sobre racismo. Seus resultados mostravam um cenário contraditório: ao mesmo tempo em que 97% dos entrevistados afirmavam não ter preconceito racial, 98% dos entrevistados diziam conhecer pessoas racistas e ter presenciado situações de discriminação racial. A melhor descrição da situação foi feita anos depois pela historiadora e antropóloga Lilia Moritz Schwarcz: “A conclusão informal é de que todo brasileiro parece se sentir como uma ilha de democracia racial, cercado de racistas por todos os lados.” [2] Hoje, o debate sobre o racismo cresceu. As cotas raciais são um sucesso social e acadêmico comprovado. Tendem a ser cada vez menos numerosos os que acreditam na democracia racial e cada vez maior o número dos que sabem que o racismo deve ser extirpado. [3] Entretanto, a tendência de reconhecer mais o racismo não se repete em relação ao machismo. Todos reconhecem que há discriminação contra pretos e pardos, mas não contra as mulheres; todos reconhecem que há racismo, mas não reconhecem que há machismo — embora os mais jovens não se revelem machistas. Todas as gerações negam a discriminação contra as mulheres, apesar de a geração dos que nasceram no novo milênio ser a que menos percebe a discriminação de gênero, tanto mulheres quanto homens. No Brasil de hoje, há uma regra social implícita, segundo a qual ninguém pode deixar de reconhecer o racismo, mas a sociedade não reconhece a discriminação contra a mulher como relevante. (Felipe Nunes. Brasil no espelho. Globo, 2025, com adaptações.) Julgue o item, relativo ao texto.';
  ce(21, 'portugues', tRac, 'Nos trechos “reconhecem que há discriminação” e “reconhecem que há machismo” (segundo período do terceiro parágrafo), a substituição do segmento “que há” por a existência de manteria tanto a correção gramatical quanto o paralelismo sintático no período.', 'C',
    'Certo. “Reconhecem a existência de discriminação” e “reconhecem a existência de machismo” trocam a oração objetiva direta por um objeto direto nominal nos dois trechos, o que mantém a correção e o paralelismo.');
  ce(22, 'portugues', tRac, 'Infere-se dos resultados da pesquisa realizada em 1988 sobre racismo que os entrevistados implicitamente negavam fazer parte do coletivo a que pertenciam.', 'C',
    'Certo. Quase todos conheciam racistas, mas quase ninguém se via como tal. É a “ilha de democracia racial cercada de racistas”: cada um se excluía do grupo do qual fazia parte.');
  ce(23, 'portugues', tRac, 'Depreende-se da leitura do texto que a geração dos nascidos no novo milênio é menos afetada pela discriminação de gênero que as demais.', 'E',
    'Errado. O texto diz que essa geração é a que menos percebe a discriminação de gênero, não a que menos a sofre. Perceber e ser afetado são coisas diferentes.');
  ce(24, 'portugues', tRac, 'No trecho “a primeira a tratar da questão racial e a que tornou o racismo crime” (primeiro período do texto), a conjunção “e” liga por adição duas orações adjetivas introduzidas pela preposição “a”.', 'E',
    'Errado. Em “a que tornou”, o “a” é pronome demonstrativo (= aquela), seguido do relativo “que”. Em “a primeira a tratar”, o “a” antes do infinitivo é preposição, mas não introduz oração adjetiva. A análise do item não se sustenta.');
  ce(26, 'portugues', tRac, 'Os dois primeiros períodos do segundo parágrafo poderiam ser reescritos em um único período, sem prejuízo da correção gramatical e da coerência do texto, da seguinte forma: Atualmente, considerando o avanço do debate sobre o racismo, as cotas raciais já são aceitas como um sucesso social e acadêmico.', 'E',
    'Errado. A reescrita cria uma relação de causa que não existe no original e troca “sucesso comprovado” por “aceitas como sucesso”, alterando o sentido.');

  /* ===================== LÍNGUA INGLESA ===================== */
  var tDraft = 'Read the text. [1] Little attention has been devoted to legislation’s point of origin — the legislative drafting process. Such commentary as has been offered is essentially technical in nature. However, the relationship between drafter and text is the furthest thing from a technical, value-neutral enterprise. [2] For example: a question confronted by every drafter and one with obvious ethical and political implications is, “How much is to be left to the drafter’s discretion?” Obviously, the drafter who less frequently inquires about the client’s desires will have greater latitude to exercise discretion and accordingly can play more of an “advocacy” role in shaping the legislation, a situation which can lead to his or her sidestepping the duty of abiding by a client’s decisions concerning the objectives of representation. [3] But this is not to paint too malevolent a portrait of legislative drafting personnel. They are not a fifth column of subversives who pursue personal advocacy objectives in everything that they do. Indeed, many may even be unaware of their power. They are, though, continually called upon to exercise personal judgment in the performance of their duties. Such judgments are frequently policy judgments, and drafting decisions are often influenced consciously or subconsciously by the advocacy agenda of the individual drafter. [4] The legislative drafter plays a more active role in the process than is generally accorded to the stereotypical scribe, laboring in nameless and faceless obscurity to produce a bill draft. (David Marcello. The Ethics and Politics of Legislative Drafting. Tulane Law Review, 1996, adapted.) About the text, judge the item.';
  ce(27, 'ingles', tDraft, 'The fragment of a sentence “greater latitude to exercise discretion” (second sentence of the second paragraph) can be, without this changing the original meaning of the text, replaced with greater possibilities to be discreet.', 'E',
    'Errado. “Latitude to exercise discretion” é liberdade para decidir por conta própria. “To be discreet” é ser reservado, discreto. O sentido muda.');
  ce(28, 'ingles', tDraft, 'In “But this is not to paint too malevolent a portrait” (first sentence of the third paragraph), “this” does not refer to a specific previous word, but to the entire statement made in the second paragraph.', 'C',
    'Certo. “This” retoma toda a ideia anterior, de que o redator pode assumir papel de defensor e se afastar das decisões do cliente, e não uma palavra isolada.');
  ce(29, 'ingles', tDraft, 'The text confronts the idea of neutrality of those whose work is to write texts that may become law.', 'C',
    'Certo. O autor afirma que a relação entre redator e texto é “the furthest thing from a technical, value-neutral enterprise”, contestando a suposta neutralidade dos redatores legislativos.');
  ce(31, 'ingles', tDraft, 'The main point of the text is to reveal how drafters can deliberately manipulate the drafting process according to their own interests.', 'E',
    'Errado. O ponto central é que redigir leis não é atividade neutra e envolve julgamento pessoal. O autor diz expressamente que não quer pintar um retrato malévolo e que muitos redatores nem percebem o próprio poder.');
  ce(32, 'ingles', tDraft, 'It is correct to conclude from the first paragraph of the text that its author believes that not much has been explored about the true nature of legislative drafters’ work, which is not merely technical and impartial.', 'C',
    'Certo. “Little attention has been devoted” e “commentary (...) essentially technical” indicam pouca exploração do tema, e o autor acrescenta que o trabalho está longe de ser técnico e neutro.');

  var tTech = 'Read the text. When conducting a survey on the use of technology in the legislative process, one of the questions I asked was “Has the legislature, as an institution or in part, resisted technology based changes?” I asked this question based on my own experience with the Massachusetts Legislature. I spent 9 years working with legislators and senior staff, and the way they sometimes approached technology was at times comical―at times frightening. My friends and I watched on―and laughed―the first time a laptop computer or an iPhone made its way onto the floor of the Massachusetts House or Senate and the members gathered around it, acting as though they were looking at an artifact that had been dropped from Mars. I also saw an older legislative drafter become befuddled and angry when he was forced to start using the “track changes” and “comment” functions on Microsoft Word rather than marking up a bill with his beloved red pencil. (Sean J. Kealy. Technology & Legislative Drafting in the United States, adapted.) Judge the item concerning the text.';
  ce(33, 'ingles', tTech, 'The negative way some legislators reacted to technology sometimes scared the author of the text.', 'C',
    'Certo. O autor diz que o modo como lidavam com a tecnologia era “at times comical—at times frightening”, isto é, às vezes assustador.');
  ce(34, 'ingles', tTech, 'The verb tense used in the survey question presented in the first sentence of the text indicates that there was no specific point in time respondents had to consider in their answers.', 'C',
    'Certo. “Has (...) resisted” está no present perfect, que trata de experiência em tempo indefinido até o presente, sem fixar um momento específico.');
  ce(35, 'ingles', tTech, 'When conducting his survey, the author met an older drafter who did not want to change the way he worked with bills and red pencils.', 'E',
    'Errado. O episódio do redator com a caneta vermelha aconteceu nos 9 anos em que o autor trabalhou no Legislativo de Massachusetts, experiência que motivou a pergunta, e não durante a pesquisa.');
  ce(36, 'ingles', tTech, 'In his text, the author shows his skepticism about the use of technology in the legislative process.', 'E',
    'Errado. Quem resistia à tecnologia eram os parlamentares e o redator. O autor relata essa resistência com ironia e até riu dela, sem demonstrar ceticismo próprio.');

  /* ===================== DIREITO ADMINISTRATIVO ===================== */
  var cOrg = 'No âmbito da Câmara dos Deputados, foi celebrado, nos termos da legislação aplicável, instrumento de cooperação administrativa para que determinadas atividades administrativas internas de apoio institucional, sem caracterização de delegação de serviço público, até então executadas diretamente por unidades internas do órgão, passassem a ser materialmente executadas por fundação pública federal de direito privado, integrante da administração indireta da União. Não houve transferência da titularidade nem da execução de serviço público em sentido próprio, tendo a Câmara dos Deputados permanecido responsável pela direção funcional, pela definição das diretrizes e pelo controle finalístico da atuação. Promoveu-se a redistribuição interna de competências entre secretarias, diretorias e coordenações já existentes, sem criação de novos órgãos, tendo sido mantida a relação de hierarquia administrativa no âmbito da própria Câmara dos Deputados. Considerando a situação hipotética e os conceitos de centralização, descentralização, concentração e desconcentração administrativas, julgue o item.';
  ce(47, 'administrativo', cOrg, 'A redistribuição de competências entre secretarias, diretorias e coordenações da Câmara dos Deputados, realizada no âmbito da mesma pessoa jurídica, sem criação de novos órgãos e com preservação da hierarquia administrativa, configura hipótese de desconcentração administrativa.', 'C',
    'Certo. Desconcentração é a distribuição interna de competências dentro da mesma pessoa jurídica, com hierarquia. Pode ocorrer redistribuindo atribuições entre órgãos já existentes, sem criar novos.');
  ce(48, 'administrativo', cOrg, 'A execução material, por fundação pública federal de direito privado, de atividades-meio administrativas internas da Câmara dos Deputados, sem transferência da titularidade nem da execução de serviço público em sentido próprio, não configura descentralização administrativa.', 'C',
    'Certo. Descentralização pressupõe transferir a outra pessoa a titularidade (outorga) ou a execução (delegação) de serviço ou atividade administrativa. Aqui houve mera cooperação para execução material de apoio, com a Câmara mantendo direção, diretrizes e controle.');

  var cInd = 'Julgue o item, relativo à administração direta e indireta e às entidades da administração indireta.';
  ce(49, 'administrativo', cInd, 'As fundações públicas, independentemente de sua natureza jurídica, submetem-se integralmente ao regime jurídico de direito público no que se refere à aplicação irrestrita das prerrogativas típicas dos bens públicos.', 'E',
    'Errado. Só as fundações de direito público (fundações autárquicas) têm bens públicos com todas as prerrogativas. Os bens das fundações de direito privado são, em regra, privados (art. 98 do Código Civil), com proteção especial apenas quando afetados a serviço público.');
  ce(50, 'administrativo', cInd, 'A administração indireta é composta por pessoas jurídicas com personalidade própria, criadas ou autorizadas por lei, que desempenham atividades administrativas de forma descentralizada, sem subordinação hierárquica ao ente instituidor, estando sujeitas a controle finalístico.', 'C',
    'Certo. Autarquias, fundações, empresas públicas e sociedades de economia mista são criadas ou autorizadas por lei (art. 37, XIX, da CF). Vinculam-se ao ente, que exerce tutela ou supervisão (controle finalístico), sem hierarquia.');
  ce(51, 'administrativo', cInd, 'A criação de empresas públicas e sociedades de economia mista prescinde de autorização legislativa específica se o ente federativo detiver o controle acionário e a entidade atuar em conformidade com o interesse público.', 'E',
    'Errado. O art. 37, XIX, da CF exige lei específica que autorize a instituição de empresa pública e de sociedade de economia mista. O inciso XX exige autorização legislativa também para subsidiárias.');

  var cAto = 'A respeito do ato administrativo, julgue o item.';
  ce(52, 'administrativo', cAto, 'A revogação, por conveniência e oportunidade, do ato administrativo não pode atingir atos válidos que tenham gerado direitos adquiridos, sob pena de violação à segurança jurídica.', 'C',
    'Certo. A Súmula 473 do STF permite revogar por conveniência e oportunidade, “respeitados os direitos adquiridos”. Atos que geraram direito adquirido são irrevogáveis.');
  ce(53, 'administrativo', cAto, 'Os atos administrativos vinculados e discricionários distinguem-se quanto à margem de liberdade conferida à administração na apreciação do motivo e do objeto, sendo ambos igualmente submetidos ao controle de legalidade pelo Poder Judiciário.', 'C',
    'Certo. O mérito (motivo e objeto) só existe no ato discricionário. Mas todo ato, vinculado ou discricionário, se submete ao controle de legalidade e de razoabilidade pelo Judiciário, que não substitui o mérito.');
  ce(54, 'administrativo', cAto, 'A imperatividade e a autoexecutoriedade são atributos dos atos administrativos, independentemente de sua natureza e de previsão legal.', 'E',
    'Errado. A imperatividade falta nos atos enunciativos e negociais (certidões, licenças, permissões). A autoexecutoriedade depende de previsão legal ou de situação de urgência. Nenhum dos dois está em todos os atos.');

  var cMaria = 'Maria, servidora pública federal efetiva e estável, ocupante de cargo de analista em órgão da administração direta da União, submetida à Lei n.º 8.112/1990, foi designada, após alguns meses de exercício, para ocupar cargo em comissão no próprio órgão. Posteriormente, requereu licença para tratar de interesses particulares, a qual foi deferida pela autoridade competente, que consignou que o afastamento seria sem remuneração e determinou a exoneração de Maria do cargo em comissão. Com base na situação hipotética, julgue o item, considerando a Lei n.º 8.112/1990 e a Constituição Federal.';
  ce(55, 'administrativo', cMaria, 'A licença para tratar de interesses particulares constitui direito subjetivo de Maria, e sua concessão independe do interesse da administração.', 'E',
    'Errado. O art. 91 da Lei 8.112/1990 diz que a licença pode ser concedida “a critério da Administração”. É ato discricionário, e pode até ser interrompida no interesse do serviço.');
  ce(56, 'administrativo', cMaria, 'O período de licença concedido a Maria será computado para fins de aposentadoria da servidora, ainda que não seja considerado tempo de efetivo exercício para outras vantagens funcionais.', 'E',
    'Errado. A licença para interesses particulares é sem remuneração e não figura nos arts. 102 e 103 da Lei 8.112/1990. O período não conta como efetivo exercício nem como tempo para aposentadoria.');
  ce(57, 'administrativo', cMaria, 'Por determinação legal, o deferimento da licença imporia a exoneração automática de Maria do cargo em comissão por ela ocupado.', 'E',
    'Errado. Nenhum dispositivo da Lei 8.112/1990 determina a exoneração automática do cargo em comissão quando se concede essa licença. A exoneração de cargo em comissão é ato discricionário da autoridade (art. 35, I).');

  var cResp = 'No que se refere à responsabilidade civil do Estado e à improbidade administrativa, julgue o item.';
  ce(58, 'administrativo', cResp, 'O servidor público que, de forma negligente, realiza ordenação de despesa não autorizada em lei, com efetiva perda patrimonial, pratica ato de improbidade administrativa que causa prejuízo ao erário.', 'E',
    'Errado. Depois da Lei 14.230/2021, todo ato de improbidade exige dolo, inclusive os de lesão ao erário (art. 10, caput). Conduta negligente (culposa) não é improbidade, ainda que gere responsabilidade civil ou disciplinar.');
  ce(59, 'administrativo', cResp, 'Em decorrência da teoria do risco administrativo, o Estado possui responsabilidade civil objetiva pelos encargos trabalhistas gerados pelo inadimplemento de empresa prestadora de serviços contratada pela administração pública.', 'E',
    'Errado. O inadimplemento do contratado não transfere automaticamente à Administração os encargos trabalhistas (art. 121 da Lei 14.133/2021; STF, Tema 246). A responsabilidade é subsidiária e depende de prova de falha na fiscalização do contrato. Não é objetiva.');
  ce(60, 'administrativo', cResp, 'A mera voluntariedade do agente não é suficiente para configurar a conduta dolosa de improbidade administrativa, sendo necessária a presença da vontade livre e consciente de alcançar o resultado ilícito.', 'C',
    'Certo. É a redação do art. 1.º, § 2.º, da Lei 8.429/1992: dolo é a vontade livre e consciente de alcançar o resultado ilícito, “não bastando a voluntariedade do agente”.');

  var cLeis = 'Julgue o item com base na Lei de Acesso à Informação (Lei n.º 12.527/2011), na Lei Geral de Proteção de Dados (Lei n.º 13.709/2018) e na lei que regula o processo administrativo federal (Lei n.º 9.784/1999).';
  ce(61, 'administrativo', cLeis, 'No processo administrativo, deve-se observar, entre outros critérios, o de atendimento a fins de interesse geral, permitida a renúncia parcial de poderes ou competências, desde que autorizada por lei.', 'C',
    'Certo. O art. 2.º, parágrafo único, II, da Lei 9.784/1999 prevê o “atendimento a fins de interesse geral, vedada a renúncia total ou parcial de poderes ou competências, salvo autorização em lei”. Com autorização legal, a renúncia parcial é admitida.');
  ce(62, 'administrativo', cLeis, 'As regras previstas na lei que regula o processo administrativo federal não se aplicam ao Poder Legislativo da União, ainda que no desempenho de função administrativa.', 'E',
    'Errado. O art. 1.º, § 1.º, da Lei 9.784/1999 manda aplicar a lei também aos órgãos dos Poderes Legislativo e Judiciário da União quando desempenham função administrativa.');
  ce(63, 'administrativo', cLeis, 'Desde que não seja configurada hipótese de informação classificada como sigilosa ou decorrente de sigilo legal, o direito de acesso aos pareceres jurídicos utilizados como fundamento da tomada de decisão e do ato administrativo será assegurado com a edição do ato decisório respectivo.', 'C',
    'Certo. O art. 7.º, § 3.º, da LAI assegura o acesso a documentos preparatórios que fundamentam decisão ou ato administrativo a partir da edição do ato decisório.');
  ce(64, 'administrativo', cLeis, 'No âmbito do processo administrativo regulado pela Lei n.º 9.784/1999, as sanções podem ter natureza pecuniária ou consistir em obrigação de fazer ou de não fazer.', 'C',
    'Certo. O art. 68 da Lei 9.784/1999 diz que as sanções terão natureza pecuniária ou consistirão em obrigação de fazer ou de não fazer, assegurado sempre o direito de defesa.');
  ce(65, 'administrativo', cLeis, 'É condição para a realização do pedido de acesso a informações a apresentação de exposição de motivos.', 'E',
    'Errado. O art. 10, § 3.º, da LAI veda quaisquer exigências relativas aos motivos determinantes da solicitação de informações de interesse público. Basta identificar o requerente e especificar a informação.');
  ce(66, 'administrativo', cLeis, 'A Lei Geral de Proteção de Dados aplica-se ao tratamento de dados pessoais realizado para fins exclusivamente jornalísticos e para fins exclusivos de atividades de repressão a infrações penais.', 'E',
    'Errado. O art. 4.º, II, a, e III, d, da LGPD excluem expressamente da lei o tratamento para fins exclusivamente jornalísticos e o feito para fins exclusivos de investigação e repressão de infrações penais.');
  ce(67, 'administrativo', cLeis, 'A Agência Nacional de Proteção de Dados (ANPD), autarquia de natureza especial dotada de autonomia funcional, técnica, decisória, administrativa e financeira, possui competência sancionatória em caso de tratamento de dados realizado em descumprimento à legislação.', 'C',
    'Certo. A ANPD é autarquia de natureza especial com essas autonomias (art. 55-A da LGPD) e compete a ela fiscalizar e aplicar sanções em caso de tratamento irregular (arts. 52 e 55-J, IV).');

  var cCtrl = 'Julgue o item, relativo ao controle da administração pública.';
  ce(68, 'administrativo', cCtrl, 'A sustação, pelo Congresso Nacional, de portaria normativa editada por ministro de Estado, em razão de violação ao princípio da legalidade, configura um tipo de controle legislativo, político e externo da administração pública.', 'C',
    'Certo. O art. 49, V, da CF dá ao Congresso a competência para sustar atos normativos do Executivo que exorbitem do poder regulamentar. É controle externo, exercido pelo Legislativo, de natureza política.');

  /* ===================== ADMINISTRAÇÃO PÚBLICA ===================== */
  var cEst = 'No que diz respeito ao Estado burocrático, ao Estado do bem-estar e a controle social e accountability, julgue o item.';
  ce(69, 'administrativo', cEst, 'Fundado na profissionalização e na impessoalidade, o Estado burocrático admite disfunções que o afastam das demandas sociais, o que o Estado do bem-estar busca mitigar por meio da universalização de direitos e do fortalecimento do seu caráter prestacional.', 'C',
    'Certo. A burocracia weberiana tem disfunções (formalismo, autorreferência) que a distanciam do cidadão. O Estado do bem-estar amplia direitos sociais universais e a prestação direta de serviços.');
  ce(70, 'administrativo', cEst, 'No setor público, accountability compreende, além do dever de prestar contas e de transparência dos atos administrativos, a capacidade de imposição de sanções e correções em caso de desvios ou descumprimento de deveres.', 'C',
    'Certo. Accountability reúne três dimensões: informação (transparência), justificação (prestação de contas) e sanção (enforcement), que permite corrigir e punir desvios.');
  ce(71, 'administrativo', cEst, 'O controle social, como mecanismo de participação da sociedade na gestão pública, restringe-se à etapa de formulação das políticas públicas, visto que a fiscalização da execução orçamentária é competência técnica exclusiva e indelegável dos órgãos de controle externo e interno.', 'E',
    'Errado. O controle social alcança todas as fases, inclusive a execução e a fiscalização do gasto. Qualquer cidadão pode denunciar irregularidades ao TCU (art. 74, § 2.º, da CF), e há conselhos, LAI e portais de transparência para isso.');

  var cGest = 'Acerca da gestão por resultados, da gestão por competências e da redefinição do papel do Estado, julgue o item.';
  ce(72, 'administrativo', cGest, 'A redefinição do papel do Estado assentou a diferença entre atividades exclusivas e serviços não exclusivos; em relação a estes, a reforma do serviço civil priorizou o reforço dos controles de processos em detrimento da autonomia gerencial, como forma de garantir a legalidade na prestação de serviços públicos.', 'E',
    'Errado. O Plano Diretor de 1995 previu, para os serviços não exclusivos, a publicização (organizações sociais), com mais autonomia gerencial e controle por resultados (contrato de gestão), não o reforço do controle de processos.');
  ce(73, 'administrativo', cGest, 'Na administração pública, a gestão por resultados utiliza a pactuação de desempenho para substituir o controle rígido de processos pela autonomia gerencial, deslocando o foco da fiscalização dos meios para a avaliação do alcance de metas e impactos.', 'C',
    'Certo. Na gestão por resultados, o gestor ganha flexibilidade em troca de metas pactuadas (contratos de gestão, acordos de desempenho), e o controle passa a ser feito pelos resultados.');
  ce(74, 'administrativo', cGest, 'A identificação de gaps de competências é essencial para o planejamento de ações de treinamento e desenvolvimento da equipe, com vistas ao alcance das estratégias organizacionais.', 'C',
    'Certo. O mapeamento compara as competências necessárias à estratégia com as já disponíveis. A lacuna (gap) orienta capacitação, seleção e alocação de pessoas.');
  ce(75, 'administrativo', cGest, 'A avaliação de competências baseada em certificações e títulos acadêmicos mensura o desempenho efetivo do servidor, visto que o conhecimento teórico constitui o pilar central da competência no setor público.', 'E',
    'Errado. Competência reúne conhecimentos, habilidades e atitudes (CHA) e se expressa no desempenho no trabalho. Títulos medem conhecimento formal, não desempenho efetivo.');

  var cRede = 'Acerca de comunicação na gestão pública e gestão de redes organizacionais, julgue o item.';
  ce(76, 'administrativo', cRede, 'O envolvimento de atores da sociedade civil e do setor privado nas políticas públicas está relacionado à incorporação da intersetorialidade a essas políticas e confere maior complexidade às redes organizacionais.', 'C',
    'Certo. Quando Estado, mercado e sociedade civil atuam juntos, as políticas se tornam intersetoriais e as redes ganham mais atores, interesses e interdependências, ficando mais complexas de coordenar.');
  ce(77, 'administrativo', cRede, 'Entre os objetivos da Política Nacional de Linguagem Simples consta a redução da necessidade de intermediários na comunicação entre o poder público e o cidadão.', 'C',
    'Certo. A política nacional de linguagem simples, instituída por lei federal em 2025, busca que o cidadão entenda diretamente as comunicações públicas. Entre seus objetivos está reduzir a necessidade de intermediários.');

  var cGov = 'Julgue o item, no que diz respeito aos princípios de governança pública, de acordo com o Decreto n.º 9.203/2017.';
  ce(78, 'administrativo', cGov, 'Promover a simplificação administrativa pela priorização dos serviços prestados por meio eletrônico insere-se entre os princípios da governança pública expressamente previstos no referido instrumento legal.', 'E',
    'Errado. Simplificação administrativa e integração dos serviços eletrônicos são diretrizes (art. 4.º). Os princípios do art. 3.º são capacidade de resposta, integridade, confiabilidade, melhoria regulatória, prestação de contas e responsabilidade, e transparência.');
  ce(79, 'administrativo', cGov, 'A capacidade de resposta é princípio a ser observado na governança pública.', 'C',
    'Certo. A capacidade de resposta é o primeiro princípio listado no art. 3.º do Decreto 9.203/2017.');

  var cGgov = 'Em relação a governabilidade e governança, julgue o item.';
  ce(80, 'administrativo', cGgov, 'Governabilidade consiste na capacidade que um governo, de qualquer nível e orientação política, possui para formular e implementar políticas públicas de forma eficiente e efetiva.', 'E',
    'Errado. Essa é a definição de governança, que é a capacidade técnica, gerencial e financeira de implementar políticas. Governabilidade são as condições políticas e institucionais de legitimidade e apoio para governar.');
  ce(81, 'administrativo', cGgov, 'A principal similaridade entre as denominadas nova gestão pública e nova governança pública é a ênfase dada à competição para a provisão de serviços públicos.', 'E',
    'Errado. A competição e os mecanismos de mercado marcam a nova gestão pública. A nova governança pública enfatiza colaboração, redes e coprodução. É justamente um ponto de diferença entre as duas.');

  var cCorp = 'No que diz respeito à intermediação de interesses por meio de práticas corporativistas e neocorporativistas, julgue o item.';
  ce(82, 'administrativo', cCorp, 'O corporativismo estrutura-se de forma articulada com as democracias sociais de inspiração keynesiana, surgidas após a Segunda Guerra Mundial.', 'E',
    'Errado. O corporativismo clássico (estatal) ligou-se a regimes autoritários do entreguerras, como o fascismo italiano e o Estado Novo. É o neocorporativismo (societal) que se articula às social-democracias keynesianas do pós-guerra.');
  ce(83, 'administrativo', cCorp, 'O neocorporativismo caracteriza-se por práticas de concertação social entre capital e trabalho arbitradas pelo Estado.', 'C',
    'Certo. No neocorporativismo, organizações de empregadores e de trabalhadores negociam com o Estado acordos tripartites sobre salários, emprego e políticas sociais.');

  var cPol = 'No que se refere a políticas públicas, julgue o item.';
  ce(84, 'administrativo', cPol, 'Falhas na governança e a ausência de transparência na gestão dos fundos de saúde e educação, por exemplo, criam um ambiente institucional propício à ocorrência de irregularidades financeiras.', 'C',
    'Certo. Sem controles, prestação de contas e transparência, diminui a chance de detectar desvios. Por isso fundos como o FUNDEB e os de saúde têm conselhos de acompanhamento e regras de publicidade.');
  ce(85, 'administrativo', cPol, 'As conferências, os conselhos de políticas públicas e os orçamentos participativos constituem espaços importantes para a concretização do exercício do controle social.', 'C',
    'Certo. São as principais instâncias institucionalizadas de participação, nas quais a sociedade delibera, propõe e acompanha políticas e gastos.');
  ce(86, 'administrativo', cPol, 'A abordagem bottom-up caracteriza-se pela descentralização do processo decisório e pela construção de estratégias a partir das experiências da base operacional.', 'C',
    'Certo. No modelo bottom-up de implementação, a política se constrói a partir dos burocratas de nível de rua e da realidade local, ao contrário do top-down, centrado nas decisões do topo.');
  ce(87, 'administrativo', cPol, 'A gestão local pautada na cidadania deve priorizar políticas públicas universalistas e padronizadas, de forma a se evitarem ações que atendam às necessidades específicas de determinados grupos, ainda que considerados vulneráveis.', 'E',
    'Errado. A cidadania inclui equidade: políticas focalizadas e ações afirmativas para grupos vulneráveis complementam as universais. Vetar o atendimento de necessidades específicas contraria esse princípio.');
  ce(88, 'administrativo', cPol, 'No Brasil, os conselhos de políticas públicas fortalecem a democracia e a descentralização ao institucionalizarem a participação da sociedade civil nas decisões e no controle da gestão governamental.', 'C',
    'Certo. Os conselhos paritários (saúde, assistência, educação, entre outros), previstos desde a CF/1988, levam a participação social para dentro do processo decisório e do controle, em todos os níveis federativos.');

  var cMud = 'Acerca das mudanças institucionais, julgue o item.';
  ce(89, 'administrativo', cMud, 'Ao adquirir personalidade de direito público, o consórcio se torna uma empresa pública e passa a integrar a administração indireta de todos os entes federativos consorciados.', 'E',
    'Errado. Com personalidade de direito público, o consórcio constitui associação pública (art. 6.º, I e § 1.º, da Lei 11.107/2005), espécie de autarquia, e não empresa pública. Ele integra, sim, a administração indireta de todos os consorciados.');
  ce(90, 'administrativo', cMud, 'Entre as prerrogativas das agências reguladoras, que são autarquias em regime especial, inclui-se a estabilidade de seus dirigentes durante o mandato.', 'C',
    'Certo. Os dirigentes têm mandato fixo e só perdem o cargo nas hipóteses legais (Lei 9.986/2000, art. 9.º; Lei 13.848/2019). Essa estabilidade garante a autonomia da agência.');
})();

/* ===== Câmara 2025 · Conhecimentos Específicos do cargo 1 (só o que o edital do cargo 6 cobra) ===== */
(function () {

  function ce(n, tema, ctx, enun, gab, just) {

  }

  /* ----- Regimento Interno da Câmara ----- */
  var cBloco = 'Julgue o item com base no que dispõe o Regimento Interno da Câmara dos Deputados em relação aos blocos parlamentares.';
  ce(91, 'constitucional', cBloco, 'Caso um deputado se desligue do partido que forma um bloco parlamentar e seu desligamento reduza a quantidade de membros do bloco a um número inferior ao mínimo necessário para a sua constituição, tal bloco permanecerá existindo somente até o final da legislatura.', 'E',
    'Errado. Pelo art. 12 do RICD, o bloco precisa ter ao menos três centésimos dos membros da Câmara. Se um desligamento o deixa abaixo desse mínimo, ele se extingue, e não sobrevive até o fim da legislatura.');
  ce(92, 'constitucional', cBloco, 'Se dois partidos se coligarem para a formação de um bloco parlamentar, suas lideranças perdem suas atribuições, mas não suas prerrogativas.', 'E',
    'Errado. O art. 12 do RICD diz que as lideranças dos partidos que se coligam em bloco perdem suas atribuições e prerrogativas regimentais. A liderança passa a ser a do bloco.');

  var cOrg = 'No que diz respeito às atribuições dos órgãos da Câmara dos Deputados, julgue o item.';
  ce(94, 'constitucional', cOrg, 'Cabe ao presidente da Câmara designar a ordem do dia das sessões, segundo a agenda mensal, ressalvadas as alterações permitidas pelo Regimento Interno da Câmara dos Deputados.', 'C',
    'Certo. É atribuição do Presidente quanto às sessões (art. 17, I, do RICD): designar a Ordem do Dia na conformidade da agenda mensal, ressalvadas as alterações permitidas pelo Regimento.');
  ce(95, 'constitucional', cOrg, 'É atribuição do presidente da Câmara promulgar, juntamente com o presidente do Senado Federal, emendas à Constituição Federal.', 'E',
    'Errado. As emendas constitucionais são promulgadas pelas Mesas da Câmara e do Senado (art. 60, § 3.º, da CF). No RICD, essa competência está entre as da Mesa (art. 15), não do Presidente isoladamente.');
  ce(96, 'constitucional', cOrg, 'É atribuição exclusiva da mesa da Câmara convidar a se retirar do plenário deputado que esteja perturbando a ordem dos trabalhos durante uma sessão.', 'E',
    'Errado. Convidar o deputado a retirar-se do recinto do Plenário quando perturbar a ordem é atribuição do Presidente na direção das sessões (art. 17, I, do RICD), e não da Mesa.');
  ce(98, 'constitucional', cOrg, 'Constitui atribuição do presidente da Câmara organizar, ouvido o colégio de líderes, a agenda com a previsão das proposições a serem apreciadas no mês subsequente, para distribuição aos deputados.', 'C',
    'Certo. O art. 17, I, do RICD atribui ao Presidente organizar, ouvido o Colégio de Líderes, a agenda com as proposições a serem apreciadas no mês seguinte, para distribuição aos deputados.');

  var cCom = 'No que se refere às comissões da Câmara dos Deputados, julgue o item.';
  ce(99, 'constitucional', cCom, 'É parte dos poderes das comissões permanentes exercer a fiscalização e o controle dos atos de autarquias do Poder Executivo federal.', 'C',
    'Certo. O art. 24 do RICD dá às comissões permanentes o acompanhamento, a fiscalização e o controle dos atos do Poder Executivo, incluídos os da administração indireta, da qual as autarquias fazem parte (art. 49, X, da CF).');
  ce(100, 'constitucional', cCom, 'Uma comissão permanente tem o poder de convocar ministros de Estado e de encaminhar a eles, através da mesa, pedidos escritos de informação.', 'C',
    'Certo. A comissão pode convocar ministro de Estado (art. 58, § 2.º, III, da CF) e encaminhar, por meio da Mesa, pedidos escritos de informação (art. 24 do RICD).');
  ce(101, 'constitucional', cCom, 'Uma comissão permanente não dispõe da atribuição de propor a sustação dos atos normativos do Poder Executivo federal que exorbitem do poder regulamentar ou dos limites de delegação legislativa.', 'E',
    'Errado. O art. 24 do RICD inclui entre as competências das comissões propor a sustação desses atos, elaborando o respectivo projeto de decreto legislativo (art. 49, V, da CF).');

  var cRc = 'Acerca do Regimento Comum do Congresso Nacional, julgue o item.';
  ce(102, 'constitucional', cRc, 'Em uma votação por processo simbólico em sessão do Congresso Nacional, o pronunciamento de um líder não tem o condão de representar o voto de seus liderados presentes.', 'E',
    'Errado. No Regimento Comum, nas votações simbólicas o voto dos líderes representa o de seus liderados presentes, que podem declarar voto em sentido diverso.');
  ce(103, 'constitucional', cRc, 'O Congresso Nacional poderá ter sessões secretas, desde que, na proposta de sua realização, esteja expressamente definida sua finalidade e que esta seja plenamente divulgada.', 'E',
    'Errado. Sessões secretas são possíveis, mas a lógica é a do sigilo: a finalidade deve constar do requerimento, mas não é divulgada. Exigir divulgação plena da finalidade contraria a própria razão da sessão secreta.');

  /* ----- Constituição: Poder Legislativo e servidores (jurisprudência do STF) ----- */
  var cStf = 'Acerca dos servidores públicos e do Poder Legislativo, julgue o item à luz da jurisprudência do STF.';
  ce(106, 'constitucional', cStf, 'Presidente de comissão parlamentar de inquérito não possui legitimidade para interpor recurso contra decisão que conceda habeas corpus em favor do paciente.', 'C',
    'Certo. Para o STF, a CPI e seu presidente não são parte no habeas corpus e não têm legitimidade para recorrer da decisão que concede a ordem.');
  ce(107, 'constitucional', cStf, 'O regime de aposentadoria especial por exercício de atividade de risco, aplicável às carreiras policiais, não se estende aos membros do Ministério Público nem aos ocupantes de cargos no Poder Judiciário.', 'C',
    'Certo. O STF entende que a aposentadoria especial por atividade de risco (art. 40, § 4.º-B, da CF) vale para carreiras cujo risco é inerente à função, como as policiais, e não se estende a membros do MP nem a servidores do Judiciário.');
  ce(109, 'constitucional', cStf, 'Cabe a comissão parlamentar de inquérito instaurada na Câmara dos Deputados convocar, e não apenas convidar, governador de estado para prestar depoimento ou esclarecimentos sobre a aplicação de recursos federais pelo respectivo ente federativo.', 'E',
    'Errado. O STF decidiu (ADPF 848) que CPI do Congresso ou de suas Casas não pode convocar governador, sob pena de ofensa à autonomia federativa e à separação de poderes. Pode apenas convidá-lo.');
  ce(110, 'constitucional', cStf, 'O regime de subsídio admite o pagamento de gratificação pelo exercício de função de confiança a membro do Ministério Público, desde que observado o teto remuneratório constitucional, vedada a acumulação e assegurado ao agente, nessa hipótese, o direito de opção.', 'C',
    'Certo. O STF admite que o subsídio conviva com a retribuição por função de confiança, que paga encargo distinto das atribuições do cargo, respeitado o teto do art. 37, XI, da CF.');
  ce(112, 'constitucional', cStf, 'A norma constitucional referente à definição sobre a possibilidade de reeleição dos membros da mesa diretora da casa legislativa não é de reprodução obrigatória, cabendo aos estados e ao Distrito Federal disciplinar a matéria no exercício de sua autonomia político-administrativa, vedada, contudo, mais de uma reeleição ou recondução consecutiva para o mesmo cargo na mesma legislatura ou na subsequente.', 'C',
    'Certo. O STF entende que o art. 57, § 4.º, da CF não é de reprodução obrigatória, mas limitou os estados e o DF a uma única reeleição ou recondução sucessiva para o mesmo cargo da Mesa.');

  var cProc = 'No que se refere às normas constitucionais relativas às matérias legislativas e ao processo legislativo, julgue o item.';
  ce(114, 'constitucional', cProc, 'Os projetos de lei acerca do direito penal são de iniciativa privativa do procurador-geral da República.', 'E',
    'Errado. Direito penal é competência privativa da União (art. 22, I, da CF), mas a iniciativa é geral (art. 61): qualquer deputado, senador, comissão, o Presidente da República ou os cidadãos. O PGR não tem iniciativa privativa sobre isso.');
  ce(116, 'constitucional', cProc, 'É admissível que uma proposta de emenda constitucional seja apresentada por mais da metade das assembleias legislativas das unidades da Federação.', 'C',
    'Certo. O art. 60, III, da CF admite PEC de mais da metade das assembleias legislativas, cada uma se manifestando pela maioria relativa de seus membros.');
  ce(118, 'constitucional', cProc, 'O presidente da República pode editar medida provisória sobre matéria de direito civil, mas não sobre matéria de direito processual civil.', 'C',
    'Certo. O art. 62, § 1.º, I, b, da CF veda MP sobre direito penal, processual penal e processual civil. Direito civil não está entre as vedações.');
  ce(119, 'constitucional', 'A respeito do procedimento legislativo, julgue o item.', 'A matéria constante de projeto de lei rejeitado não poderá constituir objeto de novo projeto na mesma sessão legislativa.', 'E',
    'Errado. O art. 67 da CF tem uma exceção: a matéria pode ser reapresentada na mesma sessão legislativa mediante proposta da maioria absoluta dos membros de qualquer das Casas. A afirmação absoluta torna o item errado.');

  var cFisc = 'Com base nas normas constitucionais acerca da fiscalização contábil, financeira e orçamentária da administração pública, julgue o item.';
  ce(123, 'constitucional', cFisc, 'Os atos de aposentadorias de servidores da Câmara dos Deputados são submetidos à apreciação, para registro, do TCU, sendo a concessão, todavia, eficaz desde a publicação do ato.', 'C',
    'Certo. O TCU aprecia a legalidade das aposentadorias para fins de registro (art. 71, III, da CF), mas o ato produz efeitos desde a publicação, e o registro posterior o confirma ou não.');
  ce(124, 'constitucional', cFisc, 'No exercício do controle externo, o TCU tem a atribuição constitucional de fiscalizar os atos administrativos do STF.', 'C',
    'Certo. O controle externo alcança as unidades administrativas dos três Poderes (art. 71, IV, da CF). Os atos administrativos do STF, como contratos e despesas, estão sujeitos ao TCU.');

  /* ----- Governança: gestão de riscos ----- */
  ce(139, 'administrativo', 'Em relação a governança, julgue o item.', 'A gestão efetiva de riscos requer conhecimento acerca do apetite ao risco e da cultura organizacional, sendo admitidas estratégias que abranjam desde a mitigação até a exploração deliberada do risco, visando obter maiores benefícios.', 'C',
    'Certo. A gestão de riscos (Decreto 9.203/2017, art. 17; ISO 31000; COSO) parte do apetite a risco e da cultura da organização. As respostas vão de evitar, mitigar, transferir e aceitar até explorar o risco quando ele representa oportunidade.');

  /* ----- Tecnologia da informação e dados ----- */
  ce(168, 'ti', 'Acerca do Windows 10 e de programas e aplicações do Microsoft Office 365, julgue o item.', 'Em uma mesma conversa no Microsoft Teams, é possível incluir links de itens dos aplicativos Excel, PowerPoint e Word, os quais poderão ser editados, de forma simultânea, por diferentes usuários, diretamente no Teams, sem necessidade de download do arquivo.', 'C',
    'Certo. Arquivos do Office compartilhados no Teams ficam no OneDrive ou no SharePoint e abrem dentro do próprio Teams, com coautoria simultânea e sem baixar o arquivo.');

  var cRede = 'Julgue o item, referente a redes de computadores.';
  ce(169, 'ti', cRede, 'As abas anônimas, também chamadas de privadas, oferecem privacidade local, sem ocultar as atividades de sites e provedores de Internet.', 'C',
    'Certo. A navegação anônima apenas deixa de gravar histórico, cookies e dados de formulário no computador. Os sites visitados, o provedor e a rede da organização continuam vendo o tráfego.');
  ce(170, 'ti', cRede, 'Os dados de uma organização armazenados em nuvem pública podem ser visualizados por outras organizações, sem que estas, contudo, possam alterá-los.', 'E',
    'Errado. Na nuvem pública a infraestrutura é compartilhada, mas os dados de cada cliente são isolados e só acessíveis a quem ele autorizar. Outras organizações não podem visualizá-los.');
  ce(171, 'ti', cRede, 'O Google Chrome admite a utilização de múltiplos perfis em um mesmo computador, bem como permite a separação de contas pessoais e de trabalho, cada qual com seus respectivos históricos, favoritos e senhas.', 'C',
    'Certo. Cada perfil do Chrome tem histórico, favoritos, senhas, extensões e configurações próprios, o que permite separar o uso pessoal do profissional.');

  var cSeg = 'Julgue o item, relativo a procedimentos de backup, vírus e worms, soluções anti-spyware e ameaças pharming.';
  ce(172, 'ti', cSeg, 'Soluções anti-spyware contemporâneas estruturam a detecção de atividades de espionagem em uma camada única de correlação de assinaturas de código previamente classificadas que realiza a identificação reativa de artefatos conhecidos.', 'E',
    'Errado. As soluções atuais combinam várias camadas: assinaturas, heurística, análise de comportamento em tempo real e inteligência em nuvem. Assim detectam também ameaças novas, e não só artefatos já conhecidos.');
  ce(173, 'ti', cSeg, 'Vírus e worms distinguem-se, entre outros aspectos, pelos mecanismos de propagação: vírus usualmente dependem da execução de código por um hospedeiro para se disseminar, ao passo que worms, em geral, exploram serviços ou vulnerabilidades de rede para autopropagação, sem interação direta do usuário.', 'C',
    'Certo. O vírus se anexa a um arquivo ou programa e precisa que ele seja executado. O worm é autônomo e se replica pela rede explorando falhas, sem ação do usuário.');
  ce(174, 'ti', cSeg, 'O pharming caracteriza-se pela manipulação direta do conteúdo apresentado ao usuário no navegador por meio de código malicioso, com atuação associada à modificação dinâmica de páginas durante a sessão.', 'E',
    'Errado. Pharming é o redirecionamento do usuário para um site falso, mesmo digitando o endereço correto, por envenenamento de DNS ou alteração do arquivo hosts. Alterar a página durante a sessão é outro ataque (man-in-the-browser).');
  ce(175, 'ti', cSeg, 'Em ambientes corporativos com sistemas de backup com versionamento online e verificação periódica de integridade, é dispensável a manutenção de cópias de segurança offline para mitigação de riscos associados a ransomware, uma vez que a recuperação íntegra pode ser assegurada a partir de repositórios online integrados.', 'E',
    'Errado. O ransomware pode cifrar ou apagar também os repositórios conectados. Por isso se recomenda manter ao menos uma cópia offline ou imutável (regra 3-2-1).');

  var cIa = 'No que se refere a inteligência artificial, ética e responsabilidade digital no serviço público, ciência de dados e governança da informação, julgue o item.';

    'Errado. Modelos de fundação são grandes redes neurais pré-treinadas em enormes volumes de dados, em geral de forma autossupervisionada, e depois adaptadas a várias tarefas. Regras formais explícitas caracterizam os sistemas especialistas (IA simbólica).');
  ce(178, 'ti', cIa, 'Aplicações de ciência de dados empregam métodos estatísticos e de aprendizado de máquina para extração de padrões, construção de modelos preditivos e suporte analítico a decisões, em tarefas como classificação, detecção de anomalias e análise de grandes volumes de dados.', 'C',

  /* ===================== CÂMARA DOS DEPUTADOS 2003 ===================== */
  var F03 = 'Câmara dos Deputados 2003 · CESPE · item ';
  var tHer = 'Read the text. [1] Buildings are the clearest expression of a people at a given historical period, exemplifying their way of living, their available technology and their artistic ideals. Being more durable than other cultural manifestations, often sheltering or incorporating other arts, such as sculpture, painting, furniture and popular art and artefacts, buildings make up the great majority of listed items, even those which are listed simply because of their historical significance. [2] In Brazil, the preservation of the country’s cultural heritage, where it is of national importance, is the responsibility of the federal government, through the Institute for National Artistic and Historical Heritage (IPHAN). Under the Brazilian constitution, it is also the responsibility of state and municipal governments, within their respective spheres, to provide for the preservation of items of local or regional interest, and, of course, of national interest. In the same way as at federal level, state governments and many municipal governments have their own organs dedicated to cultural preservation. This is so that the number of significant listed items will grow and has two purposes: firstly, to protect the character of the item in question, and secondly to recognize and proclaim its exceptional or historic value. (www.brazil.org.uk, with adaptations.)';

  ce('CDI30', F03 + '30', cTxt, '“through” (paragraph 2) can be correctly replaced by though.', 'E',

  var tBridge = 'Read the text. [1] Rising high above the Tyne, the “blinking eye” has become more of a fashion icon than a bridge since it opened a year ago. But the debate about whether the shiny, graceful curves of the 413 ft-wide span on the world’s first tilting bridge represent adventurous engineering or design at its best, intensified last night when the Gateshead Millennium bridge scooped Britain’s premier architectural award. [2] Judges for the RIBA’s annual Stirling Prize said the “simple and incredibly elegant” £22 million bridge was not only an innovative and bold engineering challenge, but also the one piece of architecture that would be remembered by people this year. [3] Praising the structure at an awards ceremony last night, Paul Finch, editorial director of the Architects Journal and deputy chairman of the Commission for Architecture hailed the bridge as a “truly heroic piece of engineering and construction.” (www.guardian.co.uk, with adaptations.) From the text, it can be concluded that';

    'Certo. O texto destaca que é a primeira ponte basculante do mundo, premiada e elogiada. “A unique bridge” resume bem o conteúdo.');

    'Errado. Paul Finch elogiou a ponte como “truly heroic piece of engineering and construction”.');

  /* ===================== INÉDITAS ===================== */
  var F_IN = 'Inédita · estilo Cebraspe';
  var tBim = 'Read the text. [1] For decades, public works were designed on paper and later on two-dimensional drawings that rarely spoke to one another. As a result, clashes between structural, electrical and plumbing systems were often discovered only on site, when fixing them was expensive. [2] Building Information Modelling (BIM) has changed that picture. Rather than producing separate drawings, designers build a shared digital model in which every element — a beam, a duct, a door — carries data about its geometry, materials and cost. Because the model is shared, conflicts can be detected before construction begins. [3] Governments have taken notice. Several countries now require BIM on large publicly funded projects, arguing that it reduces waste and improves accountability. Critics, however, point out that small firms may struggle to afford the software and training, which could narrow competition in public tenders. [4] Even so, the trend seems irreversible. The question is no longer whether public agencies will adopt BIM, but how quickly they can train their own staff to read and audit the models they receive. Judge the item according to the text.';
  ce('NBI01', F_IN, tBim, 'According to the text, before BIM, conflicts between building systems were usually identified during construction.', 'C',

    'Certo. “Because the model is shared” é a causa; a detecção antecipada dos conflitos é a consequência.');

    'Certo. Os governos defendem os benefícios do BIM; “however” introduz a objeção dos críticos.');

    'Certo. O desafio é treinar “their own staff to read and audit the models they receive”, isto é, os modelos entregues pelos contratados.');

  var tOpen = 'Read the text. [1] Parliaments have always published their decisions, but for most of their history they did so in formats that citizens could hardly use: printed journals, scanned documents and lengthy minutes. Over the past fifteen years, a growing number of legislatures have begun releasing information as open data — machine-readable files that anyone can download, combine and analyse free of charge. [2] The effects have been remarkable. Journalists can now track how each member votes, civic groups build apps that alert users when a bill on a topic of interest is introduced, and researchers compare legislative productivity across countries. Some parliaments have gone further, allowing citizens to comment on draft bills online. [3] Nevertheless, openness does not automatically lead to participation. Data that is published but poorly documented may be misread, and online consultations sometimes attract only well-organised interest groups. Transparency, in other words, is a necessary but not a sufficient condition for accountability. [4] Experts therefore recommend that legislatures pair open data with plain-language summaries and active outreach, so that people who are not specialists can actually make use of what is made available. Judge the item according to the text.';

  var tMaint = 'Read the text. [1] When a bridge collapses, the headlines usually focus on the moment of failure. Engineers, however, know that most collapses are the final chapter of a long story of deferred maintenance. Cracks that went unrepaired, drainage that was allowed to clog and corroded steel that was never replaced slowly reduce a structure’s capacity until an ordinary load becomes too much. [2] Climate change is shortening that story. Heavier rainfall erodes foundations, longer heat waves stress expansion joints and rising sea levels accelerate corrosion in coastal areas. Infrastructure designed for the climate of the twentieth century is increasingly operating outside the conditions it was built for. [3] Budget rules often make the problem worse. Inaugurating a new road is politically attractive; repainting an old viaduct is not. Unless maintenance is planned and funded as carefully as new construction, the bill will eventually arrive — and it will be higher. Judge the item according to the text.';
  ce('NBI20', F_IN, tMaint, 'According to the text, bridge collapses are usually caused by a single unexpected event.', 'E',

<script>
/*
 * Ajuste de tempo de leitura (22/11/2026)
 *
 * Regra: cada questão deve ser lida em até 30 segundos, sobrando ao menos 30 dos 60 segundos para responder.
 * Medida: até 100 palavras somando comando, texto de apoio, enunciado e alternativas (leitura atenta de prova,
 * cerca de 200 palavras por minuto). O teste automático (ver README) recusa qualquer questão acima do limite.
 *
 * Três tratamentos:
 *  A(id, contexto, enunciado?)  mesma questão, mesmo gabarito; o texto de apoio passa a ser só o trecho de que o
 *                               item precisa e as referências (“segundo parágrafo”) viram “no trecho”.
 *                               A fonte ganha “(adaptada)”. O id é mantido, e com ele o progresso do item.
 *  M(id, letra, contexto, enunciado, gabarito, justificativa)
 *                               múltipla escolha com cinco alternativas longas vira Certo/Errado a partir de uma das
 *                               alternativas oficiais. Id novo (id + letra), porque a pergunta mudou.
 *  N(id, novo)                  a questão dependia do texto inteiro e não cabe em 30 s: sai, e entra uma questão nova
 *                               sobre o mesmo ponto, com trecho curto. Id novo; fonte “(adaptada)” quando o trecho e a
 *                               ideia vêm da prova original, ou “Inédita · estilo Cebraspe”.
 */
(function () {
  var Q = window.QUESTOES, idx = {};
