  var cTrf6Reaj = 'Um contrato de prestação de serviços, assinado em agosto de 2023, teve seu orçamento concluído em abril de 2022, sendo este o mês de referência orçamentária de todo o objeto contratual para incidência de reajustes anuais. O valor global do contrato, de R$ 2.500.000,00, está sujeito à variação de dois índices específicos. Grupo de serviços A: valor total de R$ 500.000,00; execução definida em contrato de setembro de 2023 a fevereiro de 2024; índice de reajustamento X. Grupo de serviços B: valor total de R$ 1.000.000,00; execução de janeiro de 2024 a setembro de 2024; índice Y. Grupo de serviços C: valor total de R$ 1.000.000,00; execução de julho de 2024 a agosto de 2025; índice Y. Tendo como referência essa situação hipotética, julgue o item.';
  var cTrf6Adit = 'Julgue o item, considerando a formalização de aditivos contratuais no âmbito da Administração Pública direta, autárquica e fundacional.';
  var cTrf6Cnj = 'Com base na Resolução CNJ n.º 114/2010, julgue o item, a respeito da contratação de obras e serviços de engenharia.';
  var cTrf6Sst = 'Julgue o item, relativo às noções de segurança do trabalho.';
  var cTrf6Cad = 'Na engenharia civil, o uso de ferramentas computacionais é indispensável para a elaboração de projetos e para o cálculo de elementos importantes. O AutoCAD é uma das ferramentas amplamente utilizadas, oferecendo vasta gama de recursos para profissionais da área. Sobre o tema indicado no texto, julgue o item.';
  var cTrf6Bim = 'O BIM (Building Information Modeling) é uma metodologia que vem revolucionando a maneira como projetos de engenharia e arquitetura são desenvolvidos e gerenciados, promovendo integração e eficiência entre as diferentes etapas de um empreendimento. Sobre a temática BIM, julgue o item.';
  var cTrf6N16280 = 'A ABNT NBR 16280 estabelece diretrizes importantes para a gestão e a execução de reformas em edificações, garantindo a segurança das obras e a preservação das estruturas e dos sistemas. Com base nessa norma, julgue o item.';
  var cTrf6N5674 = 'Acerca dos requisitos para o sistema de gestão de manutenção e da Norma Técnica ABNT NBR 5674, julgue o item.';
  var cTrf6N14037 = 'A NBR 14037 fornece diretrizes para a elaboração de manuais que orientem os usuários sobre a operação e a manutenção de edificações, contribuindo para a preservação do patrimônio e o desempenho adequado ao longo do tempo. Nesse sentido, julgue o item.';
  ce('TRF6_52', F_TRF6 + '52', 'orcamento', cTrf6Rod, 'No controle da execução do empreendimento, a apuração de um índice de desempenho de custo superior a 1 indica que o custo real foi menor do que aquele orçado para o trabalho realizado.', 'C',
    'Certo. Na análise de valor agregado, o índice de desempenho de custo é a razão entre o valor agregado e o custo real. Índice maior que 1 indica que o trabalho realizado custou menos que o orçado para ele; menor que 1, estouro de custo.');
  ce('TRF6_53', F_TRF6 + '53', 'manutencao', cTrf6Edif, 'Os projetos de impermeabilização devem prever detalhes construtivos para a fixação rígida, à estrutura, de todas as tubulações que traspassem lajes impermeabilizadas.', 'C',
    'Certo. A NBR 9575 exige que o projeto de impermeabilização detalhe as tubulações que atravessam a área impermeabilizada. Elas devem ser fixadas rigidamente à estrutura, com arremates e reforços, para que não se movimentem e rompam a camada impermeável.');
  ce('TRF6_54', F_TRF6 + '54', 'fundacoes', cTrf6Edif, 'No projeto de fundações profundas por estacas, em que se consideram coeficientes de ponderação e valores de cálculo, a carga admissível é a grandeza fundamental.', 'E',
    'Errado. A carga admissível pertence ao método de valores característicos, com fator de segurança global. Quando o projeto usa coeficientes de ponderação e valores de cálculo, a grandeza fundamental é a força resistente de cálculo, conforme a NBR 6122.');
  ce('TRF6_55', F_TRF6 + '55', 'estruturas', cTrf6Edif, 'Ao se verificarem as estruturas de aço ou de concreto de edifícios em situação de incêndio, devem ser consideradas as combinações últimas excepcionais, sendo dispensável a avaliação dos estados limites de serviço.', 'C',
    'Certo. O incêndio é ação excepcional: a verificação é feita só nos estados-limites últimos, com as combinações últimas excepcionais da NBR 8681. As normas de incêndio (NBR 14323 para aço e NBR 15200 para concreto) dispensam a verificação dos estados-limites de serviço.');
  ce('TRF6_56', F_TRF6 + '56', 'execucao', cTrf6Edif, 'Em projetos de revestimentos pétreos de fachadas fixados com emprego de insertes, deve-se assegurar a fixação das pedras aos componentes metálicos por meio da colagem dos pinos nos furos das placas com resina epóxi ou material de desempenho equivalente.', 'E',
    'Errado. No revestimento não aderido, a placa deve poder se acomodar em relação ao inserte. Colar os pinos nos furos com resina rígida impede as movimentações térmicas e higroscópicas e concentra tensões na pedra. A NBR 15846 pede folga nos furos, preenchida com material elástico (selante).');
  ce('TRF6_57', F_TRF6 + '57', 'manutencao', cTrf6Edif, 'Sistemas de impermeabilização com mantas de policloreto de vinila (PVC) são classificados como poliméricos, flexíveis e aderidos ao substrato.', 'E',
    'Errado. As mantas de PVC são sistemas poliméricos e flexíveis, mas em regra não aderidos: são aplicadas soltas sobre o substrato, com fixação mecânica ou lastro e emendas soldadas termicamente. Totalmente aderidas são, por exemplo, as mantas asfálticas.');
  ce('TRF6_58', F_TRF6 + '58', 'execucao', cTrf6Edif, 'As esquadrias basculantes são formadas por uma ou várias folhas que podem ser movimentadas mediante rotação em torno de um eixo vertical e não coincidente com as laterais das folhas.', 'E',
    'Errado. Na esquadria basculante, as folhas giram em torno de eixo horizontal. A descrição (eixo vertical não coincidente com as laterais da folha) é a da esquadria pivotante.');
  ce('TRF6_59', F_TRF6 + '59', 'hidro', cTrf6Inst, 'A reserva de incêndio de uma edificação deve ser dimensionada para permitir o primeiro combate, com duração entre 30 e 60 minutos, a depender do tipo de sistema.', 'C',
    'Certo. Pela NBR 13714, a reserva de incêndio deve garantir o primeiro combate durante tempo determinado: 60 minutos para os sistemas dos tipos 1 e 2 e 30 minutos para o tipo 3.');
  ce('TRF6_60', F_TRF6 + '60', 'complementares', cTrf6Inst, 'Em projetos de edificações, residenciais ou não, os circuitos elétricos que servem a áreas internas sujeitas a lavagens devem, obrigatoriamente, contar com proteção adicional oferecida por dispositivo diferencial-residual de alta sensibilidade, qualquer que seja o esquema de aterramento.', 'C',
    'Certo. A NBR 5410 exige proteção adicional por dispositivo DR de alta sensibilidade (corrente diferencial-residual nominal de até 30 mA), qualquer que seja o esquema de aterramento, nos circuitos que atendem áreas internas molhadas em uso normal ou sujeitas a lavagens, em habitações e em edificações não residenciais.');
  ce('TRF6_61', F_TRF6 + '61', 'hidro', cTrf6Inst, 'O reservatório de água fria deve ser dimensionado para atender, no mínimo, ao maior volume entre a reserva de incêndio e o consumo normal no edifício em 24 horas.', 'E',
    'Errado. Os volumes se somam. O reservatório deve conter o consumo diário do edifício (no mínimo 24 horas) mais a reserva técnica de incêndio, que fica permanentemente indisponível para o consumo.');
  ce('TRF6_62', F_TRF6 + '62', 'hidro', cTrf6Inst, 'Em banheiros coletivos, as caixas sifonadas que coletam despejos de mictórios devem possuir tampas cegas e não podem receber contribuições de outros aparelhos sanitários, mesmo daqueles providos de desconectores próprios.', 'C',
    'Certo. É regra da NBR 8160: as caixas sifonadas que recebem despejos de mictórios devem ter tampa cega e não podem receber contribuição de outros aparelhos, mesmo providos de desconector próprio, para evitar odores e respingos de urina.');
  ce('TRF6_67', F_TRF6 + '67', 'materiais', cTrf6Conc, 'Para reduzir o desperdício de materiais, agregados de concreto fresco residual recuperados por lavagem podem ser reutilizados como agregado para concreto, desde que sejam do mesmo tipo que o agregado primário que compõe tal concreto.', 'C',
    'Certo. A NBR 12655 admite reaproveitar, como agregado, o material recuperado por lavagem do concreto fresco residual, desde que seja do mesmo tipo do agregado primário do concreto e respeitados os limites de proporção da norma.');
  ce('TRF6_68', F_TRF6 + '68', 'materiais', cTrf6Conc, 'Com a finalidade de acelerar o endurecimento e a durabilidade em peças de estruturas de concreto armado ou protendido, é comum adicionar, durante o processo de mistura do concreto fresco, aditivos contendo cloretos em sua composição.', 'E',
    'Errado. Aditivos com cloretos aceleram a pega, mas provocam corrosão das armaduras e prejudicam a durabilidade. As normas não permitem seu uso em concreto armado ou protendido.');
  ce('TRF6_69', F_TRF6 + '69', 'fundacoes', cTrf6Solos, 'Em campo, o controle da compactação é feito a partir da determinação da umidade e do peso específico aparente da camada de solo compactada.', 'C',
    'Certo. Em campo, determinam-se a umidade (speedy, frigideira, estufa) e o peso específico aparente da camada (frasco de areia, cilindro cortante). Com eles calculam-se o peso específico aparente seco e o grau de compactação em relação ao máximo do ensaio de Proctor.');
  ce('TRF6_70', F_TRF6 + '70', 'fundacoes', cTrf6Solos, 'Nos solos uniformes, a maioria dos grãos possui, aproximadamente, a mesma dimensão.', 'C',
    'Certo. Solo uniforme, ou mal graduado, tem grãos de dimensões próximas: curva granulométrica quase vertical e coeficiente de uniformidade baixo.');
  ce('TRF6_71', F_TRF6 + '71', 'fundacoes', cTrf6Solos, 'Por meio do ensaio de granulometria, é possível a determinação, em laboratório, da expansão de solos arenosos.', 'E',
    'Errado. A granulometria fornece a distribuição dos tamanhos dos grãos. A expansão é medida em ensaios próprios, como o de expansão no CBR ou em edômetro, e é fenômeno típico de solos argilosos com argilominerais expansivos, não de areias.');
  ce('TRF6_75', F_TRF6 + '75', 'estruturas', cTrf6Res, 'No método dos esforços, é necessário conhecer previamente os deslocamentos nos vínculos para aplicar as condições de equilíbrio.', 'E',
    'Errado. No método dos esforços (ou das forças), as incógnitas são os esforços hiperestáticos, obtidos por equações de compatibilidade de deslocamentos na estrutura isostática fundamental. Deslocamentos como incógnitas e equações de equilíbrio caracterizam o método dos deslocamentos.');
  ce('TRF6_76', F_TRF6 + '76', 'estruturas', cTrf6Res, 'Em uma análise de tensões, a tensão de cisalhamento máxima ocorre nos planos inclinados a 45 graus em relação aos eixos principais.', 'C',
    'Certo. Pelo círculo de Mohr, a tensão de cisalhamento máxima vale metade da diferença entre as tensões principais e atua em planos a 45° das direções principais.');
  ce('TRF6_77', F_TRF6 + '77', 'estruturas', cTrf6Res, 'Uma viga Gerber é caracterizada pela presença de articulações que permitem a redução dos momentos fletores máximos nas seções.', 'C',
    'Certo. A viga Gerber é uma viga contínua tornada isostática pela introdução de articulações. Bem posicionadas, elas equilibram momentos positivos e negativos e reduzem os momentos máximos em relação a vãos biapoiados independentes.');
  ce('TRF6_78', F_TRF6 + '78', 'estruturas', cTrf6Res, 'A flexão composta ocorre quando um elemento estrutural é submetido, simultaneamente, a forças de flexão e de torção.', 'E',
    'Errado. Flexão composta é a combinação de momento fletor com força normal (flexocompressão ou flexotração). Flexão com torção é outro tipo de solicitação combinada.');
  ce('TRF6_79', F_TRF6 + '79', 'estruturas', cTrf6Dim, 'A protensão pode ser realizada de forma prévia, em que os cabos são tensionados antes da concretagem, ou de forma pós-concretagem, onde a força de protensão é aplicada após o concreto atingir resistência.', 'C',
    'Certo. Na pré-tração, os cabos são tracionados antes da concretagem, contra apoios independentes (pistas de protensão). Na pós-tração, a força é aplicada depois que o concreto atinge a resistência necessária, com cabos em bainhas, aderentes ou não.');
  ce('TRF6_80', F_TRF6 + '80', 'estruturas', cTrf6Dim, 'Para vigas biapoiadas com carga distribuída, o momento fletor máximo ocorre na extremidade da viga, próximo ao apoio.', 'E',
    'Errado. Na viga biapoiada com carga uniformemente distribuída, o momento é nulo nos apoios e máximo no meio do vão (pL²/8). Nos apoios é máxima a força cortante.');
  ce('TRF6_81', F_TRF6 + '81', 'estruturas', cTrf6Dim, 'O concreto apresenta comportamento viscoelástico, o que significa que ele apresenta deformações dependentes do tempo, como a fluência e a retração.', 'C',
    'Certo. O concreto apresenta deformações que evoluem com o tempo: a fluência, sob carga mantida, e a retração, independente de carga. Ambas são consideradas no projeto, por exemplo em flechas diferidas e perdas de protensão.');
  ce('TRF6_82', F_TRF6 + '82', 'estruturas', cTrf6Dim, 'Os estados limites de serviço são utilizados no dimensionamento de estruturas para garantir a segurança estrutural em situações extremas de carregamento.', 'E',
    'Errado. Os estados-limites de serviço tratam do uso normal: deformações excessivas, fissuração e vibrações. A segurança contra a ruína em situações extremas é verificada nos estados-limites últimos.');
  ce('TRF6_83', F_TRF6 + '83', 'orcamento', cTrf6Custos, 'O cálculo de encargos sociais exclui o 13.º salário, pois este é considerado um benefício adicional, e não um encargo obrigatório.', 'E',
    'Errado. O 13.º salário integra os encargos sociais, no grupo das verbas pagas sem contraprestação de trabalho, ao lado de férias, feriados e repouso semanal remunerado.');
  ce('TRF6_84', F_TRF6 + '84', 'orcamento', cTrf6Custos, 'O levantamento de quantitativos é a base do orçamento, pois determina a quantidade precisa de materiais e serviços necessários para a execução da obra.', 'C',
    'Certo. O orçamento resulta de quantidades multiplicadas por custos unitários. Erros no levantamento de quantitativos se propagam a todo o orçamento, ao cronograma e às medições.');
  ce('TRF6_86', F_TRF6 + '86', 'orcamento', cTrf6Custos, 'O orçamento analítico é elaborado exclusivamente para a fase de planejamento, enquanto o orçamento sintético é utilizado apenas durante a execução da obra.', 'E',
    'Errado. O orçamento sintético resume a obra por etapas ou serviços com seus totais; o analítico detalha cada serviço em composições de custos unitários. Não há uso exclusivo por fase: o analítico é a referência da licitação e também o instrumento de controle da execução.');
  ce('TRF6_92', F_TRF6 + '92', 'fiscalizacao', cTrf6Reaj, 'Considere que, no mês de agosto de 2024, após o início da execução do grupo de serviços C, o gestor do contrato verificou que o índice de reajustamento Y sofreu uma variação de 2,5% entre os meses de abril de 2024 e julho de 2024. Nesse caso, o gestor do contrato poderá reajustar o saldo contratual referente ao grupo de serviços C para julho de 2024, de tal forma que a execução dos serviços seja iniciada com um saldo contratual condizente com a realidade de mercado.', 'E',
    'Errado. O reajuste tem periodicidade anual contada da data-base, que é a do orçamento (abril). Variações do índice entre aniversários, como a de abril a julho de 2024, não autorizam novo reajuste. O próximo só ocorre em abril de 2025.');
  ce('TRF6_93', F_TRF6 + '93', 'fiscalizacao', cTrf6Reaj, 'No mês de setembro de 2023, no início da execução dos serviços, a empresa contratada possui direito ao pleito de reajustamento contratual, referente ao período de abril de 2022 a abril de 2023.', 'C',
    'Certo. A data-base é abril de 2022. Quando a execução começou, em setembro de 2023, já havia transcorrido o interregno de 12 meses, e a contratada tem direito ao reajuste pela variação do índice entre abril de 2022 e abril de 2023.');
  ce('TRF6_94', F_TRF6 + '94', 'fiscalizacao', cTrf6Reaj, 'Considere que, por questões relacionadas ao planejamento interno da Administração, a ordem de serviços referente ao início da execução do grupo de serviços B foi emitida no mês de maio de 2024. Considere ainda que, no mês de março de 2024, o grupo de serviços B possuía um saldo contratual já reajustado no valor de R$ 1.030.000,00. Nesse caso, e sabendo que, entre abril de 2023 e abril de 2024, o índice de reajustamento Y teve uma variação de 1,5%, o saldo contratual reajustado do grupo de serviços B, a partir de abril de 2024, será de R$ 1.045.450,00.', 'C',
    'Certo. O atraso do grupo B decorreu da Administração, de modo que o saldo faz jus ao reajuste no aniversário da data-base: R$ 1.030.000,00 × 1,015 = R$ 1.045.450,00.');
  ce('TRF6_95', F_TRF6 + '95', 'fiscalizacao', cTrf6Reaj, 'Considere que, por conta de dificuldades internas exclusivamente de sua responsabilidade, no mês de fevereiro de 2024, a empresa contratada conseguiu efetivar a entrega de apenas 50% do grupo de serviços A. Considere, ainda, que, até o fim de março de 2024, nenhuma outra entrega complementar havia sido realizada, e o grupo de serviços A possuía um saldo contratual já reajustado no valor de R$ 262.500,00. Nesse caso, diante de uma variação de 3% entre abril de 2023 a abril de 2024, para o índice de reajustamento X, o saldo contratual reajustado do grupo de serviços A, a partir de abril de 2024, será de R$ 270.375,00.', 'E',
    'Errado. O atraso é de responsabilidade exclusiva da contratada. O saldo em atraso não recebe o novo reajuste: prevalecem os preços vigentes no período em que a execução estava prevista no cronograma. A conta R$ 262.500,00 × 1,03 = R$ 270.375,00 não se aplica.');
  ce('TRF6_96', F_TRF6 + '96', 'fiscalizacao', cTrf6Adit, 'Nas alterações consensuais, é permitida a transfiguração do objeto da contratação.', 'E',
    'Errado. Nenhuma alteração, unilateral ou consensual, pode transfigurar o objeto da contratação. Mudar a essência do objeto equivale a contratar sem licitação. A Lei 14.133/2021 explicita a vedação no art. 126.');
  ce('TRF6_97', F_TRF6 + '97', 'fiscalizacao', cTrf6Adit, 'As alterações contratuais podem ser unilaterais, quando feitas pela Administração, sem a necessidade de prévia anuência do contratado, ou consensuais, por comum acordo entre as partes.', 'C',
    'Certo. O art. 124 da Lei 14.133/2021 prevê alterações unilaterais pela Administração, qualitativas e quantitativas, e alterações por acordo entre as partes.');
  ce('TRF6_98', F_TRF6 + '98', 'fiscalizacao', cTrf6Adit, 'Em situações excepcionais, desde que devidamente justificado, o contratado poderá executar serviços demandados pela Administração anteriormente à formalização de termo aditivo contratual que os contemple.', 'C',
    'Certo. A regra é que o termo aditivo preceda a execução. O art. 132 da Lei 14.133/2021 ressalva os casos de justificada necessidade de antecipação dos efeitos, quando a formalização deve ocorrer em até 1 mês.');
  ce('TRF6_103', F_TRF6 + '103', 'orcamento', cTrf6Cnj, 'Em condições normais, despesas relativas à administração local de obras, mobilização e desmobilização e instalação e manutenção de canteiro deverão ser incluídas na planilha orçamentária da obra como custo indireto.', 'E',
    'Errado. Administração local, mobilização e desmobilização e instalação e manutenção de canteiro são passíveis de identificação e medição e devem constar da planilha como custo direto. O mesmo entendimento está no Acórdão TCU 2.622/2013. Custo indireto, no BDI, são administração central, seguros, riscos, despesas financeiras, lucro e tributos.');
  ce('TRF6_109', F_TRF6 + '109', 'fiscalizacao', cTrf6Sst, 'Balaclava é um equipamento de proteção individual para proteção da cabeça.', 'C',
    'Certo. O Anexo I da NR-6 relaciona, entre os EPI para proteção da cabeça, o capacete e o capuz ou balaclava.');
  ce('TRF6_111', F_TRF6 + '111', 'complementares', cTrf6Cad, 'O AutoCAD permite que engenheiros criem desenhos técnicos bidimensionais (2D) e tridimensionais (3D), mas não oferece ferramentas para o cálculo automático de áreas ou volumes em projetos.', 'E',
    'Errado. O AutoCAD calcula áreas, perímetros e volumes automaticamente, com comandos como AREA, MEASUREGEOM e MASSPROP, além da paleta de propriedades.');
  ce('TRF6_112', F_TRF6 + '112', 'complementares', cTrf6Bim, 'Uma das funcionalidades cruciais do BIM é a detecção de interferências, o que ajuda a identificar conflitos entre diferentes sistemas do projeto antes da construção.', 'C',
    'Certo. A detecção de interferências (clash detection) sobrepõe os modelos das disciplinas e aponta conflitos, como tubulação atravessando viga, ainda na fase de projeto, quando corrigir é barato.');
  ce('TRF6_113', F_TRF6 + '113', 'complementares', cTrf6Bim, 'O Sistema BIM é uma metodologia que permite apenas a modelagem tridimensional de projetos, sem integração com outras disciplinas ou planejamento de obra.', 'E',
    'Errado. O BIM associa informação à geometria e integra as disciplinas de projeto, o planejamento (4D), os custos (5D) e a operação e manutenção. É justamente o que o distingue da simples modelagem 3D.');
  ce('TRF6_115', F_TRF6 + '115', 'manutencao', cTrf6N16280, 'Toda reforma em edificações deve ser documentada e submetida à aprovação do síndico ou da administração predial, mas a elaboração de um plano de reforma por profissionais habilitados é opcional.', 'E',
    'Errado. O plano de reforma é obrigatório. Deve ser elaborado por profissional habilitado, com responsabilidade técnica (ART ou RRT), e submetido ao responsável legal da edificação antes do início dos serviços.');
  ce('TRF6_116', F_TRF6 + '116', 'manutencao', cTrf6N5674, 'A Norma Técnica ABNT NBR 5674 estabelece que o plano de manutenção deve conter, no mínimo, a identificação dos serviços de manutenção necessários, a periodicidade recomendada e os responsáveis por sua execução.', 'C',
    'Certo. O programa de manutenção previsto na NBR 5674 deve identificar, para cada sistema, as atividades de manutenção, sua periodicidade e os responsáveis pela execução, além dos documentos de referência e da forma de registro.');
  ce('TRF6_117', F_TRF6 + '117', 'manutencao', cTrf6N5674, 'Referida norma dispõe sobre os requisitos mínimos para a gestão de manutenção de edificações, com foco na preservação das condições de segurança, desempenho e funcionalidade ao longo do ciclo de vida da edificação.', 'C',
    'Certo. A NBR 5674 estabelece os requisitos para a gestão do sistema de manutenção de edificações, com vistas a preservar suas características originais e prevenir a perda de desempenho, mantendo segurança e funcionalidade ao longo da vida útil.');
  ce('TRF6_118', F_TRF6 + '118', 'manutencao', cTrf6N14037, 'A norma em comento recomenda que os manuais sejam apresentados em linguagem técnica detalhada, voltada preferencialmente para engenheiros ou arquitetos.', 'E',
    'Errado. O manual se destina a proprietários e usuários, em geral leigos. A NBR 14037 pede linguagem simples e direta, com termos técnicos explicados e apoio de ilustrações.');
  ce('TRF6_119', F_TRF6 + '119', 'manutencao', cTrf6N14037, 'Os manuais de uso, operação e manutenção devem conter informações sobre a periodicidade e os procedimentos de manutenção preventiva, mas a manutenção corretiva não precisa ser abordada.', 'E',
    'Errado. O manual deve orientar tanto a manutenção preventiva quanto a corretiva, além do uso, da operação, das garantias e dos procedimentos em emergências.');

  /* ===================== TCE-AC, Analista Administrativo, Engenharia Civil ===================== */
  var F_TCEAC = 'TCE-AC 2024 · Cebraspe · item ';
  var cTceacPlan = 'Em relação a planejamento de projetos e obras, julgue o item.';
  var cTceacEdit = 'Julgue o item, a respeito da análise e interpretação de editais de licitação, contratos e aditivos contratuais.';
  var cTceacFisc = 'No que se refere à fiscalização de obras e serviços, julgue o item.';
  var cTceacLic = 'A respeito dos princípios e conceitos envolvidos nas licitações de obras públicas, julgue o item.';
  var cTceacContr = 'Acerca dos contratos administrativos de obras públicas, julgue o item.';
  var cTceacEscor = 'Durante a realização das escavações para a construção de uma garagem subterrânea em uma obra pública, percebeu-se a necessidade de se escorar o terreno, pois as edificações adjacentes começaram a apresentar trincas e fissuras. Contudo, esse serviço não estava previsto no contrato. Considerando essa situação hipotética, julgue o item.';
  var cTceacCustos = 'Em relação à avaliação de custos de uma obra pública, desde a etapa de planejamento até sua execução completa, julgue o item.';
  var cTceacCompat = 'A análise e a compatibilização de projetos são etapas cruciais no processo de construção de edificações. Nesse sentido, julgue o item.';
  var cTceacLei = 'Acerca da Lei n.º 14.133/2021 e suas alterações, julgue o item.';
  var cTceacAdm = 'Julgue o item, com base na legislação pertinente à administração de contratos.';
  var cTceacAcomp = 'A respeito do controle e acompanhamento de execução de contratos de obras e serviços, julgue o item.';
  var cTceacPag = 'Julgue o item, acerca dos pagamentos relativos às obras públicas.';
  var cTceacReaj = 'Em relação ao reajustamento de preços em contratos de obras públicas, julgue o item.';
  var cTceacSemi = 'Um servidor público, ocupante do cargo de engenheiro civil, foi designado para acompanhar e fiscalizar a obra de construção da nova sede do órgão público em que ele trabalha, tendo sido a contratação da obra realizada pelo regime de execução semi-integrada. A partir dessa situação hipotética, julgue o item, a respeito da fiscalização e documentação de obras e serviços de engenharia.';
  ce('TCEAC51', F_TCEAC + '51', 'execucao', cTceacPlan, 'O projeto básico de terraplenagem para edificação deve apresentar o detalhamento das soluções de terraplenagem para a implantação da edificação e conter todas as especificações de construção necessárias à execução da terraplenagem.', 'E',
    'Errado. Detalhamento das soluções e todas as especificações necessárias à execução caracterizam o projeto executivo. O projeto básico de terraplenagem traz o dimensionamento das soluções adotadas, com os elementos suficientes para caracterizar e orçar o serviço.');
  ce('TCEAC52', F_TCEAC + '52', 'estruturas', cTceacPlan, 'O projeto básico de estrutura metálica deve estar harmonizado com os projetos de arquitetura, estrutura de concreto, fundações e demais instalações.', 'C',
    'Certo. A compatibilização é requisito do projeto básico: a estrutura metálica deve estar harmonizada com arquitetura, estrutura de concreto, fundações e instalações, para evitar interferências e retrabalho.');
  ce('TCEAC53', F_TCEAC + '53', 'hidro', cTceacPlan, 'No projeto de sistema predial de esgoto sanitário estão os seguintes objetivos gerais: impedir que os gases provenientes do interior do sistema predial de esgoto sanitário atinjam áreas de utilização; impossibilitar o acesso de corpos estranhos ao interior do sistema; permitir que os seus componentes sejam facilmente inspecionáveis.', 'C',
    'Certo. São requisitos gerais da NBR 8160: impedir que os gases do sistema alcancem as áreas de utilização, impossibilitar o acesso de corpos estranhos ao interior do sistema e permitir que os componentes sejam facilmente inspecionáveis, entre outros.');
  ce('TCEAC54', F_TCEAC + '54', 'fundacoes', cTceacPlan, 'Em projetos e execuções de fundações, os ensaios complementares de laboratório visam classificar o solo e determinar parâmetros de resistência, de deformabilidade e de permeabilidade, sendo os mais comuns, conforme a norma brasileira de referência, os de cone, de palheta, de cisalhamento direto e de adensamento.', 'E',
    'Errado. Os ensaios de cone (CPT) e de palheta (vane test) são ensaios de campo. Os ensaios de laboratório mais comuns são caracterização, cisalhamento direto, triaxial, adensamento, permeabilidade, expansibilidade e colapsibilidade.');
  ce('TCEAC55', F_TCEAC + '55', 'fiscalizacao', cTceacEdit, 'O contrato de uma obra de reforma de um edifício público poderá ser alterado tanto quantitativa quanto qualitativamente, de forma unilateral, pela administração pública, desde que as alterações não transfigurem o objeto da contratação e observem o limite de acréscimos e supressões de 50% do valor contratado atualizado.', 'E',
    'Errado. O limite de 50% vale só para acréscimos em reforma de edifício ou de equipamento. Para supressões, o limite é sempre de 25% do valor inicial atualizado do contrato (art. 125 da Lei 14.133/2021).');
  ce('TCEAC56', F_TCEAC + '56', 'fiscalizacao', cTceacEdit, 'Entre as situações que justificam a extinção de um contrato, que deverá ser formalmente motivada nos autos do processo, assegurados o contraditório e a ampla defesa, está o não cumprimento ou cumprimento irregular de normas editalícias ou de cláusulas contratuais, de especificações, de projetos ou de prazos.', 'C',
    'Certo. É o art. 137, caput e inciso I, da Lei 14.133/2021: a extinção deve ser formalmente motivada nos autos, assegurados o contraditório e a ampla defesa, e tem entre seus motivos o não cumprimento ou o cumprimento irregular de normas editalícias, cláusulas contratuais, especificações, projetos ou prazos.');
  ce('TCEAC57', F_TCEAC + '57', 'fiscalizacao', cTceacEdit, 'De acordo com a Lei n.º 14.133/2021, o pregão é uma modalidade de licitação que pode ser usada para a contratação de obras, sendo obrigatório para a aquisição de bens e serviços comuns; nesse caso, o critério de julgamento poderá ser o de menor preço ou o de maior desconto.', 'E',
    'Errado. O pregão não se aplica a obras nem a serviços técnicos especializados de natureza predominantemente intelectual. Em engenharia, só cabe para serviços comuns (art. 29, parágrafo único). Obras são licitadas por concorrência.');
  ce('TCEAC58', F_TCEAC + '58', 'fiscalizacao', cTceacEdit, 'Como regra geral, a execução de um serviço na obra deve possuir lastro contratual e as alterações contratuais, mediante formalização de aditivos de serviços, devem ocorrer antes da autorização e execução dos serviços na obra, ainda que não haja pagamento antecipado.', 'C',
    'Certo. A formalização do termo aditivo é condição para a execução das alterações (art. 132 da Lei 14.133/2021). A exceção são os casos de justificada necessidade de antecipação dos efeitos, com formalização em até 1 mês.');
  ce('TCEAC59', F_TCEAC + '59', 'fiscalizacao', cTceacEdit, 'No regime de empreitada por preço global, exige-se que o projeto licitado permita o levantamento dos quantitativos com elevada acurácia, bem como que contenha um detalhamento completo de todos os componentes da obra, a fim de que haja uma incerteza mínima na orçamentação da obra.', 'C',
    'Certo. Na empreitada por preço global, o contratado assume o risco das quantidades. O regime pede projeto com alto grau de detalhamento, que permita levantar os quantitativos com precisão e reduza a incerteza do orçamento (entendimento do Acórdão TCU 1.977/2013).');
  ce('TCEAC60', F_TCEAC + '60', 'fiscalizacao', cTceacFisc, 'Conforme disposto na Lei n.º 14.133/2021, em caso de ordem de paralisação ou suspensão do contrato de uma obra, o cronograma de execução será prorrogado automaticamente pelo tempo correspondente ao que a obra ficar paralisada.', 'C',
    'Certo. É o art. 115, § 5.º: em caso de impedimento, ordem de paralisação ou suspensão do contrato, o cronograma de execução é prorrogado automaticamente pelo tempo correspondente.');
  ce('TCEAC61', F_TCEAC + '61', 'fiscalizacao', cTceacFisc, 'De acordo com a Lei n.º 14.133/2021, o responsável pela fiscalização de uma obra pode autorizar a medição de determinados serviços que não tenham sido executados ou tenham sido concluídos parcialmente em determinado mês, desde que, no mês seguinte, ocorra a execução completa dos serviços medidos no mês anterior.', 'E',
    'Errado. A medição atesta serviços efetivamente executados, e o pagamento antecipado é vedado como regra (art. 145 da Lei 14.133/2021). Medir serviço não executado ou incompleto, ainda que com promessa de compensação no mês seguinte, é irregular.');
  ce('TCEAC62', F_TCEAC + '62', 'fundacoes', cTceacFisc, 'Para resultados de sondagens de simples reconhecimento com SPT, o índice de resistência à penetração é expresso como a soma do número de golpes requeridos para a segunda e terceira etapas de penetração de 15 cm, adotando-se os números obtidos nessas etapas mesmo quando a penetração não tiver sido de exatos 15 cm.', 'C',
    'Certo. É a definição da NBR 6484: o índice N é a soma dos golpes da segunda e da terceira etapas de 15 cm (os 30 cm finais), adotando-se os números obtidos mesmo quando a penetração de cada etapa não foi exatamente de 15 cm.');
  ce('TCEAC63', F_TCEAC + '63', 'fiscalizacao', cTceacFisc, 'Para o controle da entrada e saída de equipamentos do canteiro de obras, dos serviços em andamento, do efetivo de pessoal e das condições climáticas, exige-se da contratada a elaboração de relatórios semanais (livro de obra).', 'E',
    'Errado. Esses registros são feitos no diário de obra, preenchido diariamente pela contratada e mantido no canteiro. Não se trata de relatório semanal.');
  ce('TCEAC64', F_TCEAC + '64', 'fundacoes', cTceacFisc, 'Em obras de edificações, o controle tecnológico é obrigatório na execução: de aterros para suporte de fundações, pavimentos ou estruturas de contenção; de aterros com alturas superiores a 1 m; e de aterros com volumes superiores a 1.000 m³.', 'C',
    'Certo. São as três hipóteses de controle tecnológico obrigatório da NBR 5681: aterros com responsabilidade de suporte de fundações, pavimentos ou estruturas de contenção, aterros com altura superior a 1 m e aterros com volume superior a 1.000 m³.');
  ce('TCEAC65', F_TCEAC + '65', 'execucao', cTceacFisc, 'Antes do início da execução das estruturas de concreto, recomenda-se a realização de uma análise preliminar de risco, com vistas à identificação de riscos tanto no ambiente interno quanto no ambiente externo à obra, e à avaliação da necessidade de ações para eliminar problemas potenciais ou para evitar a recorrência de problemas já observados em outras obras.', 'C',
    'Certo. A análise preliminar de riscos, considerando os ambientes interno e externo da obra, é recomendada na preparação da execução das estruturas de concreto (NBR 14931, edição de 2023), para eliminar problemas potenciais e evitar a repetição de falhas de outras obras.');
  ce('TCEAC67', F_TCEAC + '67', 'fiscalizacao', cTceacLic, 'No regime de contratação semi-integrada de uma obra pública, o contratado é responsável por elaborar e desenvolver o projeto executivo, além de executar os procedimentos necessários e suficientes para a entrega final da obra.', 'C',
    'Certo. Na contratação semi-integrada, o projeto básico é da Administração, e o contratado elabora o projeto executivo, executa a obra e realiza as demais operações necessárias à entrega final do objeto (art. 6.º, XXXIII, da Lei 14.133/2021).');
  ce('TCEAC68', F_TCEAC + '68', 'fiscalizacao', cTceacLic, 'A licitação na modalidade maior desconto é aquela em que o certame é vencido pela licitante que apresentar o maior desconto em relação ao preço estimado pela administração.', 'E',
    'Errado. Maior desconto é critério de julgamento, não modalidade de licitação. As modalidades são pregão, concorrência, concurso, leilão e diálogo competitivo. Além disso, o desconto tem como referência o preço global fixado no edital (art. 34, § 2.º).');
  ce('TCEAC69', F_TCEAC + '69', 'fiscalizacao', cTceacLic, 'É vedada à administração a contratação de execução de obras de engenharia pelo sistema de registro de preços, a fim de que os princípios da eficiência, da competitividade e da isonomia sejam observados.', 'E',
    'Errado. A Lei 14.133/2021 admite o sistema de registro de preços para obras e serviços de engenharia, desde que haja projeto padronizado, sem complexidade técnica e operacional, e necessidade permanente ou frequente (art. 85).');
  ce('TCEAC70', F_TCEAC + '70', 'fiscalizacao', cTceacLic, 'A licitação é dispensável quando a competição é inviável, como no caso da contratação de equipe de fiscalização de obras públicas.', 'E',
    'Errado. Inviabilidade de competição é hipótese de inexigibilidade (art. 74), não de dispensa. Na dispensa a competição é possível, mas a lei autoriza a contratação direta (art. 75).');
  ce('TCEAC71', F_TCEAC + '71', 'fiscalizacao', cTceacContr, 'Quando constatada a necessidade de modificação do regime de execução de uma obra pública, decorrente de verificação técnica da inaplicabilidade dos termos originalmente avençados, o contrato poderá ser alterado unilateralmente pela administração.', 'E',
    'Errado. A modificação do regime de execução por inaplicabilidade técnica dos termos originais é hipótese de alteração por acordo entre as partes (art. 124, II, b). Unilateralmente, a Administração só altera projeto ou especificações e quantidades.');
  ce('TCEAC72', F_TCEAC + '72', 'fiscalizacao', cTceacContr, 'No caso de necessidade de aditamento para término de uma obra pública dentro dos limites legais, os preços unitários dos itens a serem acrescentados e não previstos no contrato serão fixados por meio da aplicação da relação geral entre os valores apresentados pelo contratado e o do orçamento-base da administração sobre os preços de referência vigentes na data do aditamento.', 'C',
    'Certo. É o art. 127 da Lei 14.133/2021: os preços dos serviços novos são fixados aplicando a relação geral entre os valores da proposta e os do orçamento-base (o desconto global) sobre os preços referenciais ou de mercado vigentes na data do aditamento, respeitados os limites do art. 125.');
  ce('TCEAC73', F_TCEAC + '73', 'fiscalizacao', cTceacContr, 'É facultada à administração a possibilidade de que uma seguradora assuma a execução e a conclusão de uma obra pública, desde que prevista em edital a exigência de prestação de garantia na modalidade seguro-garantia.', 'C',
    'Certo. O art. 102 da Lei 14.133/2021 permite que o edital de obras e serviços de engenharia exija seguro-garantia com cláusula de retomada, pela qual a seguradora, no inadimplemento do contratado, assume a execução e conclui o objeto.');
  ce('TCEAC74', F_TCEAC + '74', 'fiscalizacao', cTceacContr, 'No caso de uma obra pública recém-concluída que apresente vazamento no sistema hidráulico, comprovadamente ocasionado por má-fé de um empregado, o contratado está desobrigado de corrigir o defeito a suas expensas, devendo a administração arcar com essa despesa, movendo ação regressa contra aquele empregado.', 'E',
    'Errado. O contratado é obrigado a reparar, corrigir ou substituir, a suas expensas, o objeto com vícios ou defeitos de execução ou de materiais (art. 119) e responde pelos danos causados por seus empregados (art. 120). A má-fé do empregado é questão entre ele e a empresa.');
  ce('TCEAC75', F_TCEAC + '75', 'fiscalizacao', cTceacEscor, 'Em função da justificada necessidade de antecipação de seus efeitos, uma vez que há riscos às construções vizinhas, o contratado poderá iniciar os serviços de escoramento sem a formalização do termo aditivo, que deverá ocorrer no prazo máximo de um mês.', 'C',
    'Certo. O risco às construções vizinhas justifica a antecipação dos efeitos do aditivo. O art. 132 da Lei 14.133/2021 admite a execução antes da formalização nesses casos, devendo o termo aditivo ser formalizado em até 1 mês.');
  ce('TCEAC76', F_TCEAC + '76', 'fiscalizacao', cTceacEscor, 'Caso se comprove que a ausência de previsão do serviço de escoramento decorra de falha de projeto, que ensejará necessária alteração contratual, o responsável técnico pelo projeto poderá ser responsabilizado, e providências para o ressarcimento dos danos à administração deverão ser adotadas.', 'C',
    'Certo. Pelo art. 124, § 1.º, da Lei 14.133/2021, alterações de contratos de obras decorrentes de falhas de projeto ensejam a apuração de responsabilidade do responsável técnico e as providências para ressarcimento dos danos causados à Administração.');
  ce('TCEAC77', F_TCEAC + '77', 'orcamento', cTceacCustos, 'Para a obtenção do orçamento de uma obra, o cálculo dos encargos sociais deve considerar seguros, administração central e tributos a serem pagos à construtora contratada.', 'E',
    'Errado. Seguros, administração central e tributos são parcelas do BDI. Encargos sociais são os custos incidentes sobre a folha de pagamento da mão de obra, como INSS, FGTS, férias e 13.º salário.');
  ce('TCEAC78', F_TCEAC + '78', 'orcamento', cTceacCustos, 'O orçamento sintético contempla as composições analíticas dos serviços necessários à execução de uma obra, apresentando a relação completa dos insumos, o que possibilita a avaliação dos gastos com mão de obra, materiais e equipamentos empregados na construção.', 'E',
    'Errado. A descrição é a do orçamento analítico, formado pelas composições de custos unitários com a relação de insumos. O orçamento sintético apresenta apenas os serviços, com quantidades, preços unitários e totais.');
  ce('TCEAC80', F_TCEAC + '80', 'orcamento', cTceacCustos, 'A taxa de benefício e despesas indiretas (BDI), que contempla a remuneração da empresa construtora e suas despesas indiretas, deve ser aplicada sobre o custo direto total para a obtenção do preço final estimado para a obra.', 'C',
    'Certo. O preço de venda é o custo direto multiplicado por (1 + BDI). A taxa cobre as despesas indiretas (administração central, seguros, garantias, riscos, despesas financeiras e tributos) e a remuneração da construtora, e incide sobre o custo direto total.');
  ce('TCEAC81', F_TCEAC + '81', 'complementares', cTceacCompat, 'Atrasos no cronograma e riscos de segurança da edificação são problemas gerados pela falta de análise e compatibilização do projeto.', 'C',
    'Certo. Sem compatibilização, as interferências entre disciplinas só aparecem na obra. O resultado são retrabalho, aditivos, atrasos no cronograma e improvisos que podem comprometer a segurança, como furos não previstos em elementos estruturais.');
  ce('TCEAC82', F_TCEAC + '82', 'complementares', cTceacCompat, 'O uso da ferramenta BIM (Building Information Modeling) promove a integração de diferentes disciplinas de projeto, facilitando na detecção de conflitos.', 'C',
    'Certo. No BIM, os modelos das disciplinas são reunidos em um modelo federado, e a detecção de interferências (clash detection) aponta os conflitos automaticamente.');
  ce('TCEAC91', F_TCEAC + '91', 'fiscalizacao', cTceacLei, 'A empreitada por preço global foi substituída pela contratação por tarefa.', 'E',
    'Errado. A empreitada por preço global continua prevista entre os regimes de execução do art. 46, ao lado da empreitada por preço unitário, da empreitada integral, da contratação por tarefa, da integrada, da semi-integrada e do fornecimento e prestação de serviço associado.');
  ce('TCEAC92', F_TCEAC + '92', 'fiscalizacao', cTceacLei, 'A modalidade contratação integrada, onde a contratada se responsabiliza pelos projetos e todas as etapas da obra, é obrigatória para empreendimentos acima de 10 milhões.', 'E',
    'Errado. Contratação integrada é regime de execução, não modalidade de licitação, e não é obrigatória por faixa de valor. Sua adoção é opção justificada da Administração.');
  ce('TCEAC96', F_TCEAC + '96', 'fiscalizacao', cTceacAdm, 'As despesas referentes a serviços sustentáveis podem ter a ordem cronológica de pagamento alterada pela administração, mediante prévia justificativa da autoridade competente.', 'E',
    'Errado. A ordem cronológica de pagamentos só pode ser alterada nas hipóteses taxativas do art. 141, § 1.º, da Lei 14.133/2021: calamidade ou grave perturbação da ordem, pequenas empresas com risco de descontinuidade do objeto, sistemas estruturantes, falência ou recuperação do contratado e objeto imprescindível ao patrimônio ou a serviço público relevante. Serviços sustentáveis não estão entre elas.');
  ce('TCEAC97', F_TCEAC + '97', 'fiscalizacao', cTceacAdm, 'O regime de execução é uma cláusula necessária em todo contrato de obra.', 'C',
    'Certo. O art. 92, IV, da Lei 14.133/2021 inclui o regime de execução ou a forma de fornecimento entre as cláusulas necessárias em todo contrato.');
  ce('TCEAC98', F_TCEAC + '98', 'fiscalizacao', cTceacAdm, 'Apenas os contratos com prazo de duração superior a 1 ano deverão conter cláusula que estabeleça o índice de reajustamento de preço, com data-base vinculada à data do orçamento estimado.', 'E',
    'Errado. A previsão de índice de reajustamento, com data-base vinculada à data do orçamento estimado, é obrigatória independentemente do prazo de duração do contrato (arts. 25, § 7.º, e 92, § 3.º).');
  ce('TCEAC99', F_TCEAC + '99', 'fiscalizacao', cTceacAdm, 'A divulgação no Portal Nacional de Contratações Públicas é condição indispensável para a eficácia do contrato e seus aditamentos.', 'C',
    'Certo. Pelo art. 94 da Lei 14.133/2021, a divulgação no PNCP é condição indispensável para a eficácia do contrato e de seus aditamentos.');
  ce('TCEAC100', F_TCEAC + '100', 'fiscalizacao', cTceacAdm, 'Nos contratos de obras e serviços de engenharia, sempre que compatível com o regime de execução, a medição será mensal.', 'C',
    'Certo. É o art. 92, § 5.º, da Lei 14.133/2021: nos contratos de obras e serviços de engenharia, sempre que compatível com o regime de execução, a medição será mensal.');
  ce('TCEAC101', F_TCEAC + '101', 'fiscalizacao', cTceacAdm, 'Nas contratações de obras de grande vulto, poderá ser exigida a prestação de garantia, em percentual equivalente a até 10% do valor inicial do contrato.', 'E',
    'Errado. A garantia é de até 5% do valor inicial e pode chegar a 10% conforme a complexidade e os riscos (art. 98). Nas obras de grande vulto, pode-se exigir seguro-garantia com cláusula de retomada em percentual de até 30% (art. 99).');
  ce('TCEAC102', F_TCEAC + '102', 'fiscalizacao', cTceacAcomp, 'O objeto do contrato será recebido, em se tratando de obras, provisoriamente, definitivamente e pendente de regularização.', 'E',
    'Errado. A lei prevê apenas dois recebimentos para obras e serviços: o provisório e o definitivo (art. 140, I). Não existe recebimento pendente de regularização.');
  ce('TCEAC103', F_TCEAC + '103', 'fiscalizacao', cTceacAcomp, 'O quantitativo de contratos por agente público e a complexidade da fiscalização deverão ser considerados na designação para o exercício da função de fiscal de contrato de obras.', 'C',
    'Certo. A regulamentação da Lei 14.133/2021 (Decreto 11.246/2022) manda considerar, na designação de gestores e fiscais, a compatibilidade com as atribuições do cargo, a complexidade da fiscalização, o quantitativo de contratos por agente público e sua capacidade para o desempenho das atividades.');
  ce('TCEAC104', F_TCEAC + '104', 'fiscalizacao', cTceacAcomp, 'A fiscalização técnica de uma obra faz o acompanhamento dos aspectos administrativos contratuais quanto às obrigações previdenciárias, fiscais e trabalhistas.', 'E',
    'Errado. A fiscalização técnica acompanha a execução do objeto: quantidade, qualidade, prazo e modo de execução. O acompanhamento das obrigações previdenciárias, fiscais e trabalhistas cabe à fiscalização administrativa.');
  ce('TCEAC105', F_TCEAC + '105', 'fiscalizacao', cTceacAcomp, 'Uma das atividades do gestor do contrato de obras é realizar o recebimento definitivo do objeto do contrato.', 'C',
    'Certo. O recebimento definitivo cabe a servidor ou comissão designada pela autoridade competente (art. 140, I, b), atribuição que o regulamento federal (Decreto 11.246/2022) confere ao gestor do contrato. O recebimento provisório é do fiscal.');
  ce('TCEAC106', F_TCEAC + '106', 'fiscalizacao', cTceacAcomp, 'Em uma execução de obras, o atraso na liberação de área sujeita a desapropriação constitui motivo para a extinção do contrato.', 'C',
    'Certo. O art. 137, VII, da Lei 14.133/2021 arrola entre os motivos de extinção o atraso na liberação das áreas sujeitas a desapropriação, a desocupação ou a servidão administrativa, ou a impossibilidade de liberá-las.');
  ce('TCEAC107', F_TCEAC + '107', 'fiscalizacao', cTceacAcomp, 'Na execução contratual de obras, a administração tem prazo de até 15 dias úteis para as decisões sobre as solicitações e as reclamações.', 'E',
    'Errado. O prazo é de 1 mês, contado da conclusão da instrução do requerimento e prorrogável motivadamente por igual período (art. 123, parágrafo único, da Lei 14.133/2021).');
  ce('TCEAC108', F_TCEAC + '108', 'fiscalizacao', cTceacPag, 'Em se tratando de empresa de pequeno porte, desde que demonstrado o risco de descontinuidade do cumprimento do objeto do contrato, a ordem cronológica de pagamento pela administração pública poderá ser alterada, mediante prévia justificativa da autoridade competente e posterior comunicação ao órgão de controle interno da administração e ao tribunal de contas competente.', 'C',
    'Certo. É a hipótese do art. 141, § 1.º, II, da Lei 14.133/2021: pagamento a microempresa, empresa de pequeno porte e assemelhados, demonstrado o risco de descontinuidade do objeto, com justificativa prévia da autoridade e comunicação posterior ao controle interno e ao tribunal de contas.');
  ce('TCEAC109', F_TCEAC + '109', 'fiscalizacao', cTceacPag, 'O pagamento da despesa será efetuado após sua regular liquidação e emissão de ordem de pagamento.', 'C',
    'Certo. São os estágios da despesa pública na Lei 4.320/1964: empenho, liquidação e pagamento. O pagamento só ocorre após a liquidação regular, que verifica o direito do credor com base na medição atestada, e mediante ordem de pagamento (arts. 62 a 64).');
  ce('TCEAC110', F_TCEAC + '110', 'fiscalizacao', cTceacReaj, 'Os reajustes de preços, mesmo os previstos no próprio contrato, implicam variação do valor contratual, o que caracteriza uma necessidade de alteração contratual por termo aditivo.', 'E',
    'Errado. A variação do valor contratual decorrente de reajuste previsto no próprio contrato não caracteriza alteração contratual. Registra-se por simples apostila, dispensado o termo aditivo (art. 136, I, da Lei 14.133/2021).');
  ce('TCEAC111', F_TCEAC + '111', 'fiscalizacao', cTceacReaj, 'Nos casos em que o índice de reajustamento previsto em contrato não refletir a variação ponderada dos custos de insumos utilizados em determinado tipo de obra, as cláusulas monetárias poderão ser alteradas, unilateralmente, pela administração pública, sem prévia concordância do contratado.', 'E',
    'Errado. As cláusulas econômico-financeiras e monetárias não podem ser alteradas sem prévia concordância do contratado (art. 104, § 1.º). A prerrogativa de alteração unilateral alcança apenas as cláusulas regulamentares ou de serviço.');
  ce('TCEAC112', F_TCEAC + '112', 'fiscalizacao', cTceacSemi, 'O recebimento da obra será realizado, provisoriamente, pelo fiscal, mediante termo detalhado, quando verificado o cumprimento das exigências de caráter técnico.', 'C',
    'Certo. Art. 140, I, a, da Lei 14.133/2021: obras e serviços são recebidos provisoriamente pelo responsável por seu acompanhamento e fiscalização, mediante termo detalhado, quando verificado o cumprimento das exigências de caráter técnico.');
  ce('TCEAC113', F_TCEAC + '113', 'fiscalizacao', cTceacSemi, 'Por ser o fiscal da obra em tela servidor público e, por isso, detentor de anotação de responsabilidade técnica (ART) de cargo e função, é dispensável a emissão da ART de fiscalização.', 'E',
    'Errado. A ART de cargo ou função registra o vínculo do profissional com o órgão e não substitui a ART de obra ou serviço. A fiscalização é atividade técnica específica, sujeita a ART própria (Lei 6.496/1977 e resoluções do Confea).');
  ce('TCEAC114', F_TCEAC + '114', 'fiscalizacao', cTceacSemi, 'Devido ao regime de contratação em questão, o contratado é responsável tanto pela execução da obra quanto pela elaboração do projeto básico e do executivo, que, nesse caso, deverão ser examinados e recebidos pelo fiscal, antes do início da obra.', 'E',
    'Errado. Na semi-integrada, o projeto básico é fornecido pela Administração, e o contratado elabora apenas o projeto executivo. Projeto básico a cargo do contratado é característica da contratação integrada, que parte de anteprojeto.');
  ce('TCEAC115', F_TCEAC + '115', 'fiscalizacao', cTceacSemi, 'Para prevenir riscos na execução contratual, o fiscal do contrato poderá ser auxiliado pelos órgãos de assessoramento jurídico e de controle interno do órgão público responsável pela contratação.', 'C',
    'Certo. O art. 117, § 3.º, da Lei 14.133/2021 prevê que o fiscal seja auxiliado pelos órgãos de assessoramento jurídico e de controle interno, que devem dirimir dúvidas e subsidiá-lo com informações para prevenir riscos na execução contratual.');
  ce('TCEAC116', F_TCEAC + '116', 'fiscalizacao', cTceacSemi, 'O engenheiro detentor do acervo apresentado na licitação deve ser mantido durante a execução da obra, pois a troca por outro profissional só é possível se aprovada pela administração pública.', 'C',
    'Certo. Pelo art. 67, § 6.º, da Lei 14.133/2021, os profissionais indicados para comprovar a capacitação técnico-profissional devem participar da obra, admitida a substituição por profissionais de experiência equivalente ou superior, desde que aprovada pela Administração.');
  ce('TCEAC117', F_TCEAC + '117', 'fiscalizacao', cTceacSemi, 'No regime de contratação em tela, em regra, não são permitidos aditivos por variação de quantitativos.', 'C',
    'Certo. Na contratação integrada e na semi-integrada, a alteração de valores é vedada, salvo nas hipóteses do art. 133: caso fortuito ou força maior, alteração a pedido da Administração, alteração do projeto básico na semi-integrada e evento alocado à Administração na matriz de riscos. O risco de quantitativos é do contratado.');
  ce('TCEAC118', F_TCEAC + '118', 'fiscalizacao', cTceacSemi, 'Eventual atraso injustificado no início da obra constitui motivo para rescisão amigável do contrato, por acordo entre as partes e desde que por conveniência da administração pública, manifestada a concordância do fiscal.', 'E',
    'Errado. O atraso injustificado no início da obra é inadimplemento do contratado: enseja extinção por ato unilateral da Administração, com contraditório e ampla defesa, e sanções. A extinção consensual pressupõe interesse da Administração e não depende de concordância do fiscal.');
  ce('TCEAC119', F_TCEAC + '119', 'fiscalizacao', cTceacSemi, 'Caso sejam verificados, durante a execução da obra, defeitos decorrentes dos materiais empregados, o fiscal deverá providenciar os aditivos contratuais necessários para a aquisição de novos materiais.', 'E',
    'Errado. Defeitos de materiais são corrigidos pelo contratado, a suas expensas (art. 119 da Lei 14.133/2021). O fiscal determina a regularização e registra a ocorrência. Não cabe aditivo para a Administração pagar por novos materiais.');
  ce('TCEAC120', F_TCEAC + '120', 'fiscalizacao', cTceacSemi, 'No regime de execução semi-integrada, a medição é feita por etapas, conforme cronograma físico-financeiro.', 'C',
    'Certo. Na semi-integrada, a remuneração é associada à execução de etapas do cronograma físico-financeiro, vinculadas ao cumprimento de metas de resultado, vedada a medição por quantidades unitárias (art. 46, § 9.º, da Lei 14.133/2021).');

  /* ===================== MPGO, Analista em Edificações, Engenharia Civil ===================== */
  var F_MPGO = 'MPGO 2024 · Cebraspe · item ';
  var cMpgoProj = 'No que diz respeito a projeto arquitetônico, projeto de fundação, projeto estrutural e de instalações hidrossanitária e de drenagem, bem como a investigação geotécnica, julgue o item.';
  var cMpgoFisc = 'Julgue o item, relativo à fiscalização de obras e serviços de engenharia no âmbito da administração pública.';
  var cMpgoSinapi = 'A Lei n.º 14.133/2021 estabelece o Sistema Nacional de Pesquisa de Custos e Índices de Construção Civil (SINAPI) como parâmetro para a estimativa do custo da contratação. Acerca desse sistema e das boas práticas de orçamentação, julgue o item.';
  var cMpgoLic = 'No que se refere a licitação e contratação de obras públicas e serviços de engenharia, julgue o item.';
  var cMpgoDesemp = 'Considerando que a Lei n.º 14.133/2021 estabelece que o projeto executivo de uma obra de engenharia deve ser desenvolvido de acordo com as normas técnicas pertinentes, julgue o item, relativo ao desempenho das edificações.';
  var cMpgoPele = 'Sempre que uma viga de concreto armado possuir altura superior a 60 cm, barras de aço CA-50 ou CA-60, denominadas armaduras de pele ou costela, devem ser posicionadas longitudinalmente, próximas à superfície lateral e ao longo de sua altura. Considerando essas informações, julgue o item.';
  var cMpgoOrc = 'O orçamento de uma obra permite extrair diversas informações importantes, como a elaboração adequada da sequência de atividades e o quanto se gastará para cada etapa de sua realização, obtendo-se, dessa forma, um cronograma físico-financeiro, que permitirá, durante a fase de execução, um acompanhamento dos desembolsos, do cumprimento de prazos e da conclusão de etapas. A respeito dos conceitos e técnicas empregados na elaboração de um orçamento e no planejamento de uma obra, julgue o item.';
  var cMpgoAprop = 'Durante a execução de uma obra, habitualmente, a construtora realiza a apropriação dos custos e a atividade de coleta de dados, que consiste em uma apuração dos serviços realizados para o conhecimento das quantidades de mão de obra, materiais empregados e tempo dispendidos na tarefa. Considerando essas informações, julgue o item.';
  var cMpgoEdital = 'Com base no que dispõe a Lei n.º 14.133/2021 acerca de editais, julgue o item.';
  var cMpgoC25 = 'Uma construtora encomendou concreto usinado para ser empregado em uma estrutura, cujo projeto especifica concreto C25 com abatimento esperado do concreto de 10±2. Tendo essa situação hipotética como base, julgue o item.';
  var cMpgoImp = 'A respeito dos sistemas de impermeabilização, que impedem o acesso indesejável de fluidos para o interior de uma construção, julgue o item.';
  var cMpgoGest = 'Em relação às tabelas publicadas pela Agência Goiana de Infraestrutura e Transportes (GOINFRA), por meio de sua página na Internet, e aos conceitos de gestão de projetos na execução de obras civis, julgue o item.';
  var cMpgoConstr = 'Sabendo que uma construção envolve diversos elementos, desde o estabelecimento do canteiro de obras, fundações, estrutura, cobertura, vedações, impermeabilizações, acabamentos até o paisagismo final, julgue o item.';
  var cMpgoEsq = 'Considerando uma figura que representa uma esquadria de vidros composta por duas portas e, acima delas, duas peças fixas identificadas pela letra “a”, julgue o item.';
  var cMpgoReq = 'A respeito dos requisitos para a manutenção das edificações, julgue o item.';
  var cMpgoProg = 'Em relação ao programa de manutenção das edificações, julgue o item.';
  var cMpgoPlano = 'Acerca do plano de manutenção de uma edificação, julgue o item.';
  var cMpgoInsp = 'No que se refere à inspeção predial, julgue o item.';
  var cMpgoPatol = 'Julgue o item, relativo a diagnóstico e reparo das patologias das edificações.';
  var cMpgoGar = 'No que diz respeito à garantia das edificações, julgue o item.';
  var cMpgoAcomp = 'A respeito do acompanhamento de obras e serviços de engenharia, julgue o item.';
  var cMpgoVist = 'Um engenheiro civil contratado para realizar uma vistoria em uma edificação pública, construída há menos de um ano, identificou, nesse imóvel, vários vícios de execução. Com relação à atividade referida nessa situação hipotética, ao laudo/parecer apresentado pelo referido engenheiro e à documentação técnica de contratos por escopo, julgue o item.';
  var cMpgoPag = 'No que se refere aos pagamentos de contratos de obras e serviços de engenharia, julgue o item.';
  var cMpgoDoc = 'Julgue o item, acerca da documentação técnica constante dos contratos administrativos de obras e serviços de engenharia.';
  var cMpgoNr18 = 'A construção de uma edificação, constituída por um subsolo, um pavimento térreo e dez pavimentos tipo, precisa ser finalizada em 18 meses e, para isso, contará, no pico da obra, com 40 operários. O canteiro dessa obra não disporá de cozinha, pois não haverá preparo de refeições no local e, para essa construção, será instalado um elevador do tipo cremalheira. Com base nessa situação hipotética, julgue o item.';
  ce('MPGO51', F_MPGO + '51', 'fundacoes', cMpgoProj, 'Em um boletim de sondagem de simples reconhecimento à percussão (SPT), em função do número “N”, que é o índice de resistência à penetração determinado pelo número de golpes correspondente à cravação de 30 cm do amostrador-padrão, após a cravação inicial de 15 cm, utilizando-se martelo de 65 kg de massa, a areia e silte arenoso podem ser designados como: muito mole, mole, média(o), rija(o), muito rija(o) e dura(o).', 'E',
    'Errado. A definição de N e a massa do martelo estão corretas, mas as designações estão trocadas. Areias e siltes arenosos são classificados pela compacidade: fofa, pouco compacta, medianamente compacta, compacta e muito compacta. Os estados de muito mole a dura descrevem a consistência de argilas e siltes argilosos.');
  ce('MPGO52', F_MPGO + '52', 'complementares', cMpgoProj, 'As etapas de um projeto de arquitetura são: levantamento de dados, programa de necessidades, estudo de viabilidade, estudo preliminar, anteprojeto, projeto para licenciamento e projeto executivo, ocorrendo nesta última etapa o encaminhamento do projeto para análise e aprovação dos órgãos públicos e concessionárias com vistas à obtenção de alvará ou licenças e demais documentos indispensáveis para as atividades de construção.', 'E',
    'Errado. As etapas estão corretas (NBR 16636), mas a submissão aos órgãos públicos e às concessionárias para obter alvará e licenças ocorre na etapa de projeto para licenciamento, anterior ao projeto executivo.');
  ce('MPGO53', F_MPGO + '53', 'fundacoes', cMpgoProj, 'Nos projetos de fundações rasas (diretas ou superficiais), alguns fatores devem ser considerados na determinação da tensão admissível, tais como profundidade da fundação, influência do lençol d’água e dimensões e forma dos elementos de fundação.', 'C',
    'Certo. A NBR 6122 lista, entre os fatores a considerar na tensão admissível de fundações rasas, as características geomecânicas do subsolo, a profundidade da fundação, as dimensões e a forma dos elementos, a influência do lençol d\'água, as características da obra e os recalques admissíveis.');
  ce('MPGO54', F_MPGO + '54', 'estruturas', cMpgoProj, 'Na análise de um projeto básico de estrutura de concreto armado, o analista deve verificar se o projeto está em harmonia com os projetos de arquitetura, estrutura metálica/madeira, fundações e demais instalações.', 'C',
    'Certo. Verificar a compatibilidade com os demais projetos (arquitetura, estrutura metálica ou de madeira, fundações e instalações) é item básico da análise do projeto de estrutura de concreto.');
  ce('MPGO55', F_MPGO + '55', 'hidro', cMpgoProj, 'O sistema predial de esgoto sanitário deve ser separado total ou parcialmente em relação ao sistema predial de águas pluviais, podendo existir, em alguns casos específicos previstos em norma, ligação entre os dois sistemas.', 'E',
    'Errado. A NBR 8160 exige sistema separador absoluto: o sistema predial de esgoto sanitário não pode ter nenhuma ligação com o sistema predial de águas pluviais.');
  ce('MPGO56', F_MPGO + '56', 'hidro', cMpgoProj, 'No desenvolvimento de um projeto de instalações hidráulicas de água fria, consideradas as condições específicas inerentes à alimentação, a ligação à rede pública deverá ser escolhida de modo a proporcionar o maior trajeto possível do alimentador, respeitando-se as exigências da concessionária local.', 'E',
    'Errado. A ligação à rede pública deve ser escolhida de modo a proporcionar o menor trajeto possível do alimentador predial, o que reduz perda de carga, custo e risco de vazamentos.');
  ce('MPGO57', F_MPGO + '57', 'fiscalizacao', cMpgoFisc, 'O diário de obra é documento necessário para uma obra, que deve ser mantido no canteiro de obras, preenchido e atualizado pela contratada, diariamente, e conter o registro de fatos normais do andamento dos serviços, como entrada e saída de equipamentos, serviços em andamento, efetivo de pessoal e condições climáticas.', 'C',
    'Certo. O diário de obra fica no canteiro, é preenchido diariamente pela contratada e registra os fatos normais do andamento dos serviços: entrada e saída de equipamentos, serviços em andamento, efetivo e condições climáticas. A fiscalização anota nele suas observações.');
  ce('MPGO58', F_MPGO + '58', 'fiscalizacao', cMpgoFisc, 'Em contrato regido pela Lei n.º 14.133/2021, a empresa contratada poderá, desde que previamente e expressamente autorizada pela fiscalização do contrato, efetivar, mesmo sem a aprovação de termo aditivo de serviços, supressões e aumentos de quantidades de serviços contratados e(ou) a inclusão de quantidades de serviços novos no contrato, antecipando a execução de trabalhos adicionais na obra, os quais poderão ser medidos e pagos, desde que a formalização e aprovação do respectivo termo aditivo ocorra em até 90 dias, antes do término da vigência contratual.', 'E',
    'Errado. A regra é o aditivo prévio. A exceção do art. 132 da Lei 14.133/2021 exige justificada necessidade de antecipação dos efeitos e formalização em até 1 mês, não em 90 dias. A autorização da fiscalização não supre o termo aditivo.');
  ce('MPGO60', F_MPGO + '60', 'fiscalizacao', cMpgoFisc, 'Na gestão contratual, a administração pública pode alterar unilateralmente um contrato, de forma qualitativa, quando houver modificação do projeto ou das especificações, para melhor adequação técnica a seus objetivos, e(ou) quantitativa, quando for necessária a modificação do valor contratual em decorrência de acréscimo ou diminuição quantitativa de seu objeto, nos limites permitidos pela legislação vigente; no caso de obras, serviços e compras, o limite para acréscimos ou supressões é de até 25% e, no caso de reforma de edifício, o limite de acréscimos é de até 50%.', 'C',
    'Certo. São as hipóteses de alteração unilateral do art. 124, I, da Lei 14.133/2021, qualitativa e quantitativa, com os limites do art. 125: 25% para acréscimos ou supressões em obras, serviços e compras e 50% para acréscimos em reforma de edifício ou de equipamento.');
  ce('MPGO61', F_MPGO + '61', 'fiscalizacao', cMpgoFisc, 'A fiscalização deve verificar, em relação à locação da obra, a obediência à referência de nível (RN) e aos alinhamentos estabelecidos pelo levantamento topográfico original, além de efetuar as verificações e aferições que julgar necessárias durante e após a conclusão dos serviços pela equipe de topografia da contratada.', 'C',
    'Certo. Na locação, cabe à fiscalização conferir a obediência à referência de nível e aos alinhamentos do levantamento topográfico original e fazer as aferições que julgar necessárias, durante e após os serviços da equipe de topografia da contratada.');
  ce('MPGO62', F_MPGO + '62', 'fundacoes', cMpgoFisc, 'No que se refere ao controle tecnológico da execução de aterros em obras de edificações, além dos ensaios geotécnicos, deve ser controlado no local o grau de compactação a ser atingido, que é de, no mínimo, 85% ou mais elevado, conforme especificações especialmente elaboradas para a obra.', 'E',
    'Errado. Pela NBR 5681, o grau de compactação mínimo é de 95%, ou mais elevado, conforme as especificações da obra. O valor de 85% é insuficiente.');
  ce('MPGO63', F_MPGO + '63', 'execucao', cMpgoFisc, 'A atividade de concretagem de uma estrutura de concreto armado requer alguns cuidados especiais a serem observados pela fiscalização, tais como: o concreto deve ser lançado de forma contínua e conduzido de modo a não haver interrupções superiores ao tempo de pega do concreto; a operação de lançamento deve ser realizada de modo a minimizar o efeito de retração inicial do concreto; cada camada de concreto deve ser consolidada até o máximo praticável no que diz respeito à densidade; devem ser evitados vazios ou ninhos, de tal forma que o concreto seja perfeitamente ajustado às formas e peças embutidas.', 'C',
    'Certo. São cuidados clássicos de concretagem: lançamento contínuo, sem interrupções maiores que o tempo de pega, para evitar juntas frias; adensamento de cada camada até a máxima compacidade praticável; e preenchimento completo das fôrmas, sem vazios ou ninhos.');
  ce('MPGO64', F_MPGO + '64', 'fiscalizacao', cMpgoFisc, 'Caso a obra contratada envolva atividades realizadas com diferença de nível acima de 2 metros do nível inferior e haja risco de queda, como trabalhos em telhados e em coberturas, a empresa contratada deverá apresentar todas as medidas de segurança em atendimento aos princípios da NR 18, que dispõe sobre segurança e saúde no trabalho na indústria da construção civil.', 'E',
    'Errado. A definição apresentada (atividade acima de 2 m do nível inferior, com risco de queda) é a de trabalho em altura da NR-35, norma cujos requisitos devem ser atendidos nesses serviços. A NR-18 trata das condições de segurança na indústria da construção e, para o trabalho em altura, remete à NR-35.');
  ce('MPGO65', F_MPGO + '65', 'fiscalizacao', cMpgoFisc, 'Em qualquer contrato, são necessárias cláusulas que estabeleçam a periodicidade da medição de serviços; para obras e serviços de engenharia, sempre que compatível com o regime de execução, a medição será bimestral.', 'E',
    'Errado. A medição é mensal, sempre que compatível com o regime de execução (art. 92, § 5.º, da Lei 14.133/2021).');
  ce('MPGO66', F_MPGO + '66', 'orcamento', cMpgoSinapi, 'A documentação para a contratação de obras públicas deverá conter a anotação de responsabilidade técnica (ART) pelas planilhas orçamentárias, a qual consiste na declaração do orçamentista acerca da compatibilidade do orçamento com o projeto e com os custos do sistema de referência.', 'C',
    'Certo. O Decreto 7.983/2013 exige que a ART pelas planilhas orçamentárias conste do projeto que integra o edital, com declaração de compatibilidade dos quantitativos e dos custos com o projeto e com o sistema de referência. A Súmula TCU 260 vai no mesmo sentido.');
  ce('MPGO67', F_MPGO + '67', 'orcamento', cMpgoSinapi, 'No cálculo do custo da mão de obra, os encargos sociais incidentes variam conforme a unidade federativa considerada.', 'C',
    'Certo. O SINAPI calcula os encargos sociais por estado, pois parcelas como feriados locais, dias de chuva e rotatividade variam conforme a unidade da Federação, além da distinção entre horistas e mensalistas e da opção pela desoneração.');
  ce('MPGO68', F_MPGO + '68', 'orcamento', cMpgoSinapi, 'O referido sistema divulga periodicamente relatórios com composições de custos de diversos serviços da construção civil, podendo o preço correspondente ser estimado mediante o acréscimo de bonificações e despesas indiretas (BDI) — valor percentual que computa o lucro e as despesas indiretas, como administração central, despesas financeiras e imposto de renda.', 'E',
    'Errado. O BDI reúne lucro, administração central, seguros, garantias, riscos, despesas financeiras e tributos sobre o faturamento (PIS, Cofins, ISS e, se for o caso, CPRB). O imposto de renda (IRPJ) e a CSLL são tributos personalíssimos e não podem compor o BDI (Súmula TCU 254).');
  ce('MPGO69', F_MPGO + '69', 'fiscalizacao', cMpgoLic, 'O projeto básico de uma obra pública deve caracterizar os aspectos gerais da obra e conter soluções técnicas globais, de modo a permitir, por ocasião da elaboração do projeto executivo e à luz das investigações complementares, detalhamentos que resultem em reformulações no que diz respeito à qualidade, ao preço e ao prazo.', 'E',
    'Errado. Pela Lei 14.133/2021 (art. 6.º, XXV), o projeto básico deve conter soluções técnicas globais e localizadas suficientemente detalhadas, justamente para evitar, no projeto executivo e na execução, reformulações ou variantes quanto à qualidade, ao preço e ao prazo inicialmente definidos.');
  ce('MPGO70', F_MPGO + '70', 'fiscalizacao', cMpgoLic, 'Conforme estabelece a Lei n.º 14.133/2021, é obrigatória em obras de engenharia a exigência de garantias do licitante para assegurar a plena execução do objeto, expressas no edital e formalizadas no contrato.', 'E',
    'Errado. A exigência de garantia é faculdade da Administração: o art. 96 da Lei 14.133/2021 diz que ela poderá ser exigida, a critério da autoridade competente, mediante previsão no edital.');
  ce('MPGO71', F_MPGO + '71', 'fiscalizacao', cMpgoLic, 'Em um pregão cujo objeto envolva serviço comum de engenharia de manutenção predial, caso a administração não disponha de previsão precisa dos quantitativos demandados, admite-se como critério de julgamento o maior desconto ofertado pelas empresas licitantes.', 'C',
    'Certo. Serviço comum de engenharia pode ser licitado por pregão, e a lei admite o critério de maior desconto. Em manutenção predial com quantitativos incertos, é usual licitar o maior desconto sobre tabela de referência, como o SINAPI.');
  ce('MPGO73', F_MPGO + '73', 'fiscalizacao', cMpgoLic, 'Na contratação de um projeto básico de engenharia, com valor estimado em R$ 500.000, o julgamento por técnica e preço deverá, obrigatoriamente, considerar a proporção de 70% de valoração da proposta técnica.', 'C',
    'Certo. Projeto básico é serviço técnico especializado de natureza predominantemente intelectual. Acima de R$ 300 mil (valor original da lei, atualizado anualmente), o julgamento deve ser por melhor técnica ou por técnica e preço, este na proporção de 70% para a proposta técnica (art. 37, § 2.º, da Lei 14.133/2021).');
  ce('MPGO74', F_MPGO + '74', 'fiscalizacao', cMpgoLic, 'A comprovação da qualificação técnico-profissional para a execução de obras e serviços de engenharia com características semelhantes à do objeto contratado poderá ser feita por meio de certidões de acervo técnico emitidas pelo conselho profissional competente ou por meio de provas alternativas, previstas no edital de licitação, de que o profissional possui o conhecimento técnico e a experiência requeridos.', 'E',
    'Errado. A substituição dos atestados e certidões por provas alternativas é admitida pela Lei 14.133/2021, salvo na contratação de obras e serviços de engenharia (art. 67, § 3.º). Nessas, a capacidade técnico-profissional se comprova por profissional registrado, detentor de atestado de responsabilidade técnica.');
  ce('MPGO75', F_MPGO + '75', 'fiscalizacao', cMpgoLic, 'O objeto da contratação deve ser definido de forma concisa, clara e precisa, podendo sua caracterização inadequada resultar na nulidade do ato e na responsabilização de quem lhe tiver dado causa.', 'C',
    'Certo. Reproduz o art. 150 da Lei 14.133/2021: nenhuma contratação será feita sem a caracterização adequada de seu objeto e sem a indicação dos créditos orçamentários, sob pena de nulidade do ato e de responsabilização de quem lhe tiver dado causa.');
  ce('MPGO79', F_MPGO + '79', 'manutencao', cMpgoDesemp, 'Dadas as necessidades básicas de segurança, saúde, higiene e economia, são estabelecidos para os diferentes sistemas, incluindo-se os estruturais, requisitos mínimos de desempenho, os quais devem ser considerados e atendidos.', 'C',
    'Certo. A NBR 15575 fixa, para cada sistema da edificação (estrutura, pisos, vedações, coberturas e hidrossanitário), requisitos e critérios com um nível mínimo de desempenho, de atendimento obrigatório.');
  ce('MPGO80', F_MPGO + '80', 'manutencao', cMpgoDesemp, 'Os construtores são responsáveis pelos valores teóricos de vida útil do projeto, não podendo se responsabilizar pelo valor efetivamente atingido de vida útil de uma edificação, uma vez que este depende de fatores fora de seu controle, como rebaixamento do lençol freático ao longo do tempo no entorno.', 'C',
    'Certo. A NBR 15575 distingue a vida útil de projeto (VUP), valor teórico definido em projeto, da vida útil efetivamente atingida, que depende também do uso, da manutenção e de fatores externos, como alterações no entorno. Projetistas, construtores e incorporadores respondem pela VUP, não pelo valor efetivo.');
  ce('MPGO81', F_MPGO + '81', 'estruturas', cMpgoPele, 'A função da armadura de pele é minimizar os efeitos nocivos decorrentes de fenômenos de retração e(ou) de variações de temperatura, que podem gerar fissurações ao longo da superfície de uma viga.', 'C',
    'Certo. A armadura de pele (pela NBR 6118, 0,10% da área da alma em cada face, em vigas com altura superior a 60 cm) controla a abertura de fissuras na alma, provocadas pela retração e por variações de temperatura, na região entre a armadura principal e a linha neutra.');
  ce('MPGO82', F_MPGO + '82', 'orcamento', cMpgoOrc, 'Os custos diretos, elencados no orçamento, são aqueles obtidos pela soma dos custos de todos os insumos que serão empregados para a realização do empreendimento, como, por exemplo, custos de mão de obra com encargos trabalhistas.', 'C',
    'Certo. Custos diretos são os dos insumos aplicados diretamente nos serviços da obra: materiais, equipamentos e mão de obra com seus encargos sociais.');
  ce('MPGO83', F_MPGO + '83', 'orcamento', cMpgoOrc, 'A curva ABC é uma ferramenta gerencial que permite uma melhor visualização dos serviços necessários para a realização de uma obra, pois os apresenta em ordem alfabética.', 'E',
    'Errado. A curva ABC ordena insumos ou serviços por ordem decrescente de participação no custo total, não por ordem alfabética. A faixa A concentra poucos itens que respondem pela maior parte do custo.');
  ce('MPGO84', F_MPGO + '84', 'orcamento', cMpgoAprop, 'A análise do andamento dos trabalhos, a possibilidade da realização tempestiva de ajustes para a garantia do cumprimento de prazos e o controle dos gastos com a obra são vantagens competitivas de se realizar a apropriação de serviços.', 'C',
    'Certo. A apropriação mede o consumo real de mão de obra, materiais e tempo. Comparada ao orçamento e ao cronograma, permite corrigir desvios a tempo, controlar gastos e calibrar as composições de custos para obras futuras.');
  ce('MPGO85', F_MPGO + '85', 'fiscalizacao', cMpgoEdital, 'O edital deve prever índice de reajustamento de preço, independentemente do prazo de duração da avença, com data-base vinculada à data de assinatura do contrato.', 'E',
    'Errado. O índice de reajustamento é de fato obrigatório independentemente do prazo do contrato, mas a data-base é vinculada à data do orçamento estimado, não à da assinatura do contrato (art. 25, § 7.º).');
  ce('MPGO86', F_MPGO + '86', 'materiais', cMpgoC25, 'O concreto C25 é aquele cuja resistência característica à compressão é de 25 kgf/m².', 'E',
    'Errado. A classe C25 indica resistência característica à compressão (fck) de 25 MPa aos 28 dias, cerca de 250 kgf/cm².');
  ce('MPGO87', F_MPGO + '87', 'materiais', cMpgoC25, 'Se, no momento do recebimento do concreto, o ensaio do abatimento do tronco de cone apresentar resultado igual a 14 cm, deve-se esperar um intervalo de 2 horas, com o concreto em repouso no interior da betoneira do caminhão, para que parte da água da mistura evapore e se faça novo ensaio de abatimento, garantindo-se que o valor fique dentro do especificado.', 'E',
