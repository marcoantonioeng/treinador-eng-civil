    'Errado. Abatimento de 14 cm está fora da tolerância (8 a 12 cm), e o concreto deve ser recusado. Esperar duas horas não corrige o excesso de água, que continua na mistura, e ainda compromete o prazo de aplicação, pois a pega avança.');
  ce('MPGO88', F_MPGO + '88', 'manutencao', cMpgoImp, 'Um sistema rígido moldado in loco é o mais apropriado para ser aplicado em uma cobertura de edificação exposta ao sol, uma vez que se amoldará à base na qual é instalado, preenchendo possíveis poros existentes e evitando vazios na superfície que criem caminhos para o acesso dos fluidos.', 'E',
    'Errado. Cobertura exposta ao sol sofre grande movimentação térmica. Sistemas rígidos, como argamassas impermeáveis e cristalizantes, fissuram nessas condições e servem a elementos sem movimentação, como subsolos e reservatórios enterrados. Coberturas pedem sistemas flexíveis, como mantas e membranas.');
  ce('MPGO89', F_MPGO + '89', 'orcamento', cMpgoGest, 'O caminho crítico é aquele em que o atraso de qualquer atividade produzirá atraso na conclusão da obra.', 'C',
    'Certo. As atividades do caminho crítico têm folga total nula. Qualquer atraso em uma delas, mantidas as demais durações, atrasa o término do empreendimento.');
  ce('MPGO93', F_MPGO + '93', 'hidro', cMpgoConstr, 'São funções dos tubos de ventilação do sistema de esgotamento sanitário: conduzir gases para o exterior da edificação; evitar a autossifonagem dos aparelhos sanitários; aliviar sobrepressões no sistema; evitar odores desagradáveis e a propagação de bactérias por meio dos aparelhos sanitários.', 'C',
    'Certo. A ventilação do esgoto conduz os gases para a atmosfera, acima da cobertura, e mantém as pressões equilibradas na tubulação. Com isso protege os fechos hídricos contra sifonagem e sobrepressão e impede a passagem de odores e microrganismos para os ambientes.');
  ce('MPGO94', F_MPGO + '94', 'fundacoes', cMpgoConstr, 'A escolha do tipo de fundação a ser empregada em uma construção depende exclusivamente das características do solo sobre o qual se erguerá a edificação e do tipo e da magnitude dos carregamentos que serão transmitidos ao solo pela edificação.', 'E',
    'Errado. Solo e cargas são fatores essenciais, mas não exclusivos. Pesam também o nível d\'água, as construções vizinhas, as limitações de acesso e de equipamento, a disponibilidade local, o prazo e o custo.');
  ce('MPGO95', F_MPGO + '95', 'execucao', cMpgoEsq, 'As peças fixas representadas na figura são conhecidas como bandeiras da esquadria.', 'C',
    'Certo. Bandeira é o painel, fixo ou móvel, situado acima das folhas de portas e janelas, que complementa o vão para iluminação ou ventilação.');
  ce('MPGO96', F_MPGO + '96', 'manutencao', cMpgoReq, 'A responsabilidade pela manutenção das edificações recai exclusivamente sobre o corpo técnico especializado, prescindindo-se do envolvimento dos usuários.', 'E',
    'Errado. A manutenção envolve proprietários, síndico ou gestor, usuários e empresas ou profissionais especializados. Os usuários devem usar a edificação conforme o manual, colaborar com o programa de manutenção e comunicar falhas.');
  ce('MPGO97', F_MPGO + '97', 'manutencao', cMpgoReq, 'A manutenção das instalações elétricas e hidráulicas, que visa prevenir falhas e garantir o funcionamento adequado dos sistemas, é requisito fundamental para a manutenção das edificações.', 'C',
    'Certo. As instalações elétricas e hidráulicas estão entre os sistemas de maior incidência de falhas e de risco. Sua manutenção preventiva é parte obrigatória de qualquer programa de manutenção.');
  ce('MPGO98', F_MPGO + '98', 'manutencao', cMpgoProg, 'O programa em apreço deve incluir a documentação detalhada dos procedimentos de manutenção, os registros de intervenções anteriores e planejamento futuro para a garantia da rastreabilidade e da continuidade das ações de manutenção.', 'C',
    'Certo. A NBR 5674 exige procedimentos documentados, registros das inspeções e intervenções realizadas e planejamento das atividades futuras. Os registros dão rastreabilidade e servem de evidência da gestão da manutenção.');
  ce('MPGO99', F_MPGO + '99', 'manutencao', cMpgoProg, 'O referido programa deve ser revisado e atualizado apenas quando ocorrem falhas ou danos evidentes.', 'E',
    'Errado. O programa deve ser revisado periodicamente, com base nas inspeções, nos registros, no envelhecimento dos sistemas e nas mudanças de uso. Esperar a falha é manutenção apenas corretiva.');
  ce('MPGO100', F_MPGO + '100', 'manutencao', cMpgoPlano, 'O plano em questão deve ser elaborado por profissionais qualificados, com conhecimento técnico específico no que diz respeito aos sistemas construtivos e instalações da edificação.', 'C',
    'Certo. O plano deve ser elaborado por profissional habilitado que conheça os sistemas construtivos e as instalações da edificação, a partir do manual de uso, operação e manutenção e dos projetos.');
  ce('MPGO101', F_MPGO + '101', 'manutencao', cMpgoPlano, 'O mencionado plano é único para todas as edificações, independentemente de suas características e necessidades específicas, as quais deverão ser consideradas na fase de planejamento estratégico.', 'E',
    'Errado. Cada edificação tem o próprio plano, elaborado conforme a tipologia, o uso, os sistemas instalados, a idade, o ambiente e as recomendações de projetistas e fabricantes. Não existe plano único.');
  ce('MPGO102', F_MPGO + '102', 'manutencao', cMpgoInsp, 'As inspeções prediais devem ser focadas nas áreas externas da edificação, desconsiderando-se os ambientes internos.', 'E',
    'Errado. A inspeção predial (NBR 16747) avalia a edificação como um todo: estrutura, fachadas, cobertura, áreas internas, instalações e equipamentos, bem como a documentação e as condições de uso e manutenção.');
  ce('MPGO103', F_MPGO + '103', 'manutencao', cMpgoInsp, 'O uso de tecnologias avançadas nas inspeções prediais, como drones e termografia, pode aumentar a eficiência e a precisão na identificação de problemas estruturais e de infiltração, sem a necessidade de acesso direto às áreas de difícil alcance.', 'C',
    'Certo. Drones alcançam fachadas e coberturas sem andaimes, e a termografia revela umidade, destacamentos e falhas não visíveis a olho nu. São ensaios não destrutivos que complementam a inspeção sensorial.');
  ce('MPGO104', F_MPGO + '104', 'manutencao', cMpgoPatol, 'A documentação de todas as etapas do diagnóstico e do reparo das patologias é essencial para que se mantenha um histórico detalhado das condições da edificação e das intervenções realizadas.', 'C',
    'Certo. Registrar anamnese, inspeções, ensaios, diagnóstico, projeto de reparo e execução forma o histórico da edificação, base para avaliar a eficácia das intervenções e orientar manutenções futuras.');
  ce('MPGO105', F_MPGO + '105', 'manutencao', cMpgoPatol, 'Em casos urgentes, os reparos das patologias das edificações devem ser realizados de forma imediata, sem diagnóstico prévio.', 'E',
    'Errado. Sem diagnóstico, trata-se o sintoma e a causa permanece. Em urgências, adotam-se medidas emergenciais de segurança, como isolamento e escoramento, mas o reparo definitivo depende da identificação da causa e do mecanismo do problema.');
  ce('MPGO106', F_MPGO + '106', 'manutencao', cMpgoGar, 'A garantia das edificações aplica-se tão somente aos elementos estruturais, excluídos os sistemas elétricos, hidráulicos e acabamentos.', 'E',
    'Errado. A garantia alcança todos os sistemas da edificação: estrutura, vedações, impermeabilização, instalações elétricas e hidráulicas, esquadrias e acabamentos, com prazos diferenciados por sistema (NBR 15575 e NBR 17170).');
  ce('MPGO107', F_MPGO + '107', 'manutencao', cMpgoGar, 'A garantia das edificações deve cobrir defeitos construtivos e falhas de materiais e assegurar que reparos necessários sejam realizados sem custos adicionais para os proprietários durante o período estabelecido.', 'C',
    'Certo. Durante o prazo de garantia, vícios e defeitos de construção ou de materiais devem ser reparados pelo construtor ou incorporador sem ônus para o proprietário, desde que observadas as condições de uso e manutenção do manual.');
  ce('MPGO108', F_MPGO + '108', 'orcamento', cMpgoAcomp, 'Por meio da técnica do valor agregado (TVA), é possível ajustar e acompanhar o cronograma de execução de obras e serviços de engenharia a partir da identificação das atividades que podem atrasar a conclusão do empreendimento no prazo acordado em contrato, isto é, do caminho crítico.', 'E',
    'Errado. A técnica do valor agregado compara valor planejado, valor agregado e custo real para medir o desempenho de prazo e de custo. Quem identifica as atividades que condicionam o prazo final, o caminho crítico, é o método CPM.');
  ce('MPGO109', F_MPGO + '109', 'manutencao', cMpgoVist, 'Como se trata de uma obra concluída, ainda que recentemente, os custos para correção dos referidos vícios de execução apontados no laudo técnico da vistoria em questão são absorvidos pelo ente público, proprietário do imóvel.', 'E',
    'Errado. Vícios de execução em obra recém-concluída são de responsabilidade da construtora, que deve repará-los a suas expensas (art. 119 da Lei 14.133/2021). O recebimento definitivo não exclui a responsabilidade pela solidez e pela segurança da obra, com prazo mínimo de 5 anos (art. 140, § 6.º).');
  ce('MPGO110', F_MPGO + '110', 'manutencao', cMpgoVist, 'Entre outras informações, na apresentação do laudo devem constar o diagnóstico da situação encontrada e a indicação do proprietário do bem objeto da vistoria.', 'C',
    'Certo. O laudo deve identificar o objeto e o solicitante ou proprietário, descrever a metodologia e as constatações e apresentar o diagnóstico da situação encontrada e as conclusões, com data e assinatura do responsável técnico.');
  ce('MPGO111', F_MPGO + '111', 'manutencao', cMpgoVist, 'Por se tratar de um contrato de prestação de serviço, é obrigatória a apresentação, ao contratante, do registro do profissional responsável pela vistoria e do respectivo laudo no Conselho Regional de Engenharia e Agronomia (CREA), no entanto, pela natureza da atividade, dispensa-se o registro de anotação de responsabilidade técnica (ART).', 'E',
    'Errado. Vistoria, laudo e parecer técnico são atividades de engenharia sujeitas a ART, obrigatória para todo contrato de prestação de serviços de engenharia (Lei 6.496/1977). O registro do profissional no Crea não a dispensa.');
  ce('MPGO112', F_MPGO + '112', 'fiscalizacao', cMpgoPag, 'Quando houver controvérsia a respeito da qualidade da execução de algum serviço ou parte da obra objeto do contrato, a parcela incontroversa poderá ser liberada no prazo previsto para o pagamento.', 'C',
    'Certo. É o art. 143 da Lei 14.133/2021: havendo controvérsia sobre a execução quanto a dimensão, qualidade e quantidade, a parcela incontroversa deve ser liberada no prazo previsto para pagamento.');
  ce('MPGO113', F_MPGO + '113', 'fiscalizacao', cMpgoPag, 'Poderá ser estabelecida remuneração variável vinculada ao desempenho do contratado, com base em metas, padrões de qualidade, critérios de sustentabilidade ambiental e prazos de entrega, desde que definidos no edital de licitação e no contrato.', 'C',
    'Certo. O art. 144 da Lei 14.133/2021 admite, em obras, fornecimentos e serviços, inclusive de engenharia, remuneração variável vinculada ao desempenho do contratado, com base em metas, padrões de qualidade, critérios de sustentabilidade ambiental e prazos de entrega definidos no edital e no contrato.');
  ce('MPGO114', F_MPGO + '114', 'fiscalizacao', cMpgoDoc, 'A cláusula contratual definidora de riscos e de responsabilidades entre as partes e caracterizadora do equilíbrio econômico-financeiro inicial do contrato, em termos de ônus financeiro decorrente de eventos supervenientes à contratação, denomina-se matriz de riscos.', 'C',
    'Certo. É a definição do art. 6.º, XXVII, da Lei 14.133/2021. A matriz lista os possíveis eventos supervenientes e aloca seus impactos entre contratante e contratado.');
  ce('MPGO115', F_MPGO + '115', 'fiscalizacao', cMpgoDoc, 'O caderno de encargos estabelece o detalhamento das características dos materiais e equipamentos requeridos nos projetos.', 'E',
    'Errado. O detalhamento das características de materiais e equipamentos é função das especificações técnicas. O caderno de encargos define o objeto e estabelece requisitos, condições e diretrizes técnicas e administrativas para a execução do contrato.');
  ce('MPGO116', F_MPGO + '116', 'fiscalizacao', cMpgoNr18, 'Na periferia da edificação em apreço, é obrigatória a instalação de proteção contra queda de trabalhadores e projeção de materiais a partir do início dos serviços necessários à concretagem da primeira laje.', 'C',
    'Certo. A NR-18 obriga a instalar, na periferia da edificação, proteção contra queda de trabalhadores e projeção de materiais a partir do início dos serviços necessários à concretagem da primeira laje.');
  ce('MPGO117', F_MPGO + '117', 'fiscalizacao', cMpgoNr18, 'Calçados para proteção dos pés contra choques elétricos e perneiras para proteção das pernas contra umidade proveniente de operações com utilização de água são exemplos de equipamentos para proteção dos membros inferiores dos operários.', 'C',
    'Certo. Ambos constam do Anexo I da NR-6 entre os EPI para proteção dos membros inferiores: calçado contra agentes provenientes de energia elétrica e perneira contra umidade proveniente de operações com uso de água.');
  ce('MPGO118', F_MPGO + '118', 'fiscalizacao', cMpgoNr18, 'Como não haverá cozinha no canteiro de obras, as refeições dos operários podem ser aquecidas em fogareiros portáteis, no local onde realizam suas atividades de trabalho ou nos pavimentos já construídos, sendo proibida a utilização de fogueiras.', 'E',
    'Errado. É proibido aquecer ou tomar refeições nos locais de trabalho ou fora das áreas destinadas a esse fim. Mesmo sem cozinha, o canteiro deve ter local para refeições, com meios adequados para aquecê-las, conforme a NR-18 e a NR-24.');
  ce('MPGO119', F_MPGO + '119', 'fiscalizacao', cMpgoNr18, 'No elevador referido na situação hipotética, o operador e o responsável pelo material a ser transportado podem subir juntos com a carga, desde que fisicamente isolados dela.', 'C',
    'Certo. A NR-18 proíbe o transporte simultâneo de pessoas e materiais no elevador, mas excetua o operador e o responsável pelo material, desde que isolados da carga por barreira física.');
  ce('MPGO120', F_MPGO + '120', 'fiscalizacao', cMpgoNr18, 'Andaimes suspensos podem ser utilizados para o transporte vertical de materiais da obra, desde que não haja trabalhadores no balancim.', 'E',
    'Errado. A NR-18 proíbe usar andaimes suspensos para transporte de pessoas ou de materiais que não estejam vinculados aos serviços em execução. O transporte vertical de materiais da obra deve ser feito por elevador, guincho ou grua.');

  /* ===================== Petrobras, Ênfase 10: Engenharia Civil (edital de 2021) ===================== */
  var F_PETRO = 'Petrobras 2021 · Cebraspe · item ';
  var cPetroVisc = 'Considere a seção reta, na parte central, de uma viga de concreto armado em balanço, com a linha neutra tracejada, quatro barras de aço longitudinais (duas acima e duas abaixo da linha neutra) e a armadura de estribo (retângulo interno). A viga está engastada em um único apoio, com carga distribuída uniformemente de cima para baixo, e a parte central é um ponto intermediário do comprimento do balanço. Com base nessas informações, julgue o item.';
  var cPetroPremo = 'Durante a construção de uma edificação em estrutura de concreto pré-moldado, observou-se, entre outros, o que se destaca a seguir. (i) Nos elementos protendidos, utilização de argamassa de injeção com aditivos à base de halogenetos. (ii) Alteração do projeto, que previa o uso de pilares vazados como condutor de água pluvial, para que dutos pluviais fossem instalados de forma aparente, fora da estrutura. (iii) Reprovação das alças de içamento, pois o material adotado era o aço do tipo CA60. Tendo em vista essas informações, julgue o item, conforme as normas vigentes.';
  var cPetroAco = 'O engenheiro responsável pelo projeto de uma edificação em estrutura de aço tomou as seguintes decisões: (i) nas ligações com parafusos de alta resistência, adotou o aperto normal; (ii) considerou a influência de todas as ações que poderiam impactar significativamente a estrutura, adotando, na sua análise, tanto o estado-limite de serviço como o estado-limite último; (iii) desprezou a carga de vento devido às condições locais; (iv) determinou os esforços internos do material aplicando a análise global elástica. A respeito das decisões do engenheiro, julgue o item, com base nas normas vigentes.';
  var cPetroGraf = 'O gráfico, sem escala, representa os diagramas tensão-deformação convencional (linha contínua, pontos 0, 1, 2, 3 e 4) e real (linha tracejada, pontos 0, 1, 2 e 5) de uma barra de aço adotada em determinada obra. As regiões indicadas são: A, de 0 a 1 (trecho inicial reto); B, de 1 a 2 (patamar de escoamento); C, de 2 a 3 (até a tensão máxima); e D, de 3 a 4 (queda da tensão convencional até a ruptura). Em relação às características das curvas, julgue o item.';
  var cPetroViga = 'Uma viga isostática inclinada, de 5 metros de comprimento (vão horizontal de 4 m e desnível de 3 m), tem apoio fixo em A (extremidade superior) e apoio móvel em B (extremidade inferior), e recebe um carregamento uniformemente distribuído q = 500 kgf/m, aplicado verticalmente ao longo do vão horizontal. A partir dessas informações, julgue o item.';
  var cPetroTrelica = 'Uma treliça plana tem três barras: a barra 1, horizontal, entre os apoios A (fixo) e B (móvel), e as barras inclinadas 2 e 3, que se encontram no nó superior, onde atua uma carga vertical F. Considerando essa treliça, julgue o item.';
  var cPetroCuid = 'Quanto aos cuidados que devem ser tomados em relação à execução de estruturas de concreto em uma obra, julgue o item.';
  var cPetroFund = 'No que se refere às soluções e cuidados no projeto e execução de fundações rasas e profundas, julgue o item.';
  var cPetroHgeo = 'Acerca da hidrogeologia, julgue o item.';
  var cPetroMsolos = 'De acordo com os fundamentos da mecânica dos solos, julgue o item.';
  var cPetroTerra = 'Na execução de uma obra de terraplanagem, decidiu-se lançar uma primeira camada de aterro com material granular permeável, além disso, definiu-se uma altura máxima de 30 cm para cada camada compactada e, nas escavações, observou-se a necessidade de emprego constante de escarificador, com uso eventual de explosivos. Tendo como referência a situação hipotética precedente, julgue o item.';
  var cPetroCron = 'Ao verificar o cronograma de execução de uma obra de 10 milhões de reais, observou-se que, apesar dos pagamentos no valor total de 5 milhões de reais ocorrerem conforme o programado, algumas atividades estavam atrasadas. Ao checar os boletins de medição, constatou-se que nenhum pagamento foi efetuado sem a devida execução dos serviços. Também se observou que havia, no almoxarifado, um estoque de insumos da obra no valor de 1 milhão de reais. Considerando essa situação hipotética, julgue o item.';
  var cPetroConc = 'Ao preparar o concreto na execução de uma obra exposta a um ambiente agressivo, foram utilizados areia lavada de cor avermelhada como agregado miúdo, cimento Portland pozolânico (CP IV) como aglomerante e restolho como agregado graúdo. Considerando essas informações, julgue o item, a respeito dos materiais adotados na preparação da massa.';
  var cPetroSold = 'Durante a execução de uma edificação em estrutura de concreto armado, optou-se por emendar as barras de aço da estrutura com solda, pois sua composição obedecia aos limites estabelecidos em norma para esse procedimento. Após autorizada a concretagem, a usina de concreto informou que um dos caminhões foi carregado com atraso, mas chegaria ao canteiro antes do final do expediente. No final da concretagem, como uma parte da obra ficaria paralisada por mais de três meses, determinou-se que as ferragens expostas na estrutura fossem revestidas com graxa, para evitar oxidação. A partir da situação hipotética precedente, julgue o item, em relação aos cuidados adotados, de acordo com as normas vigentes.';
  var cPetroVane = 'Na execução de obras em aterros, o ensaio de Palheta, também conhecido como Vane-Test, é realizado em campo para determinar a resistência não drenada de solos puramente coesivos. A esse respeito, julgue o item.';
  var cPetroEmp = 'Acerca das fórmulas empíricas utilizadas para a análise do escoamento e do dimensionamento hidráulico das tubulações, julgue o item.';
  var cPetroAf = 'Com relação ao dimensionamento das tubulações de instalações prediais de água fria, julgue o item.';
  var cPetroProt = 'Julgue o item, relativo aos conceitos e verificações em projetos de estruturas de concreto protendido.';
  var cPetroElet = 'Julgue o item, relativo a instalações prediais elétricas.';
  var cPetroConf = 'Julgue o item, referente a conforto, desempenho e manutenção de edificações.';
  var cPetroGq = 'Com referência a ferramentas e técnicas de gestão da qualidade na construção civil, julgue o item.';
  ce('PETRO51', F_PETRO + '51', 'estruturas', cPetroVisc, 'O estribo está sujeito a um esforço de torção.', 'E',
    'Errado. O estribo resiste ao esforço cortante e confina o concreto e as barras longitudinais. Na viga em balanço com carga distribuída vertical, o esforço dominante é a flexão, com cortante máximo no engaste. Não há torção, que exigiria carga excêntrica em relação ao eixo da viga.');
  ce('PETRO52', F_PETRO + '52', 'estruturas', cPetroVisc, 'A parte central é a posição da viga com maior momento fletor.', 'E',
    'Errado. No balanço com carga uniformemente distribuída, o momento fletor máximo ocorre no engaste (qL²/2) e vai a zero na extremidade livre. Na parte central, o momento é de apenas qL²/8, ou seja, um quarto do valor no engaste.');
  ce('PETRO53', F_PETRO + '53', 'estruturas', cPetroVisc, 'A zona abaixo da linha neutra está exposta a um esforço de compressão.', 'C',
    'Certo. No balanço com carga de cima para baixo, a fibra superior é tracionada e a inferior, comprimida. A linha neutra separa as duas zonas, então a região abaixo dela trabalha à compressão.');
  ce('PETRO54', F_PETRO + '54', 'estruturas', cPetroVisc, 'As duas barras de aço longitudinais acima da linha neutra têm como principal função manter os estribos em sua posição de projeto.', 'E',
    'Errado. No balanço, a face superior é a tracionada. As barras acima da linha neutra formam a armadura longitudinal principal, dimensionada para resistir ao momento fletor, e não servem apenas como porta-estribos.');
  ce('PETRO55', F_PETRO + '55', 'estruturas', cPetroPremo, 'A utilização de argamassa de injeção com aditivos à base de halogenetos não é recomendada, pois esses elementos podem provocar corrosão no aço da estrutura.', 'C',
    'Certo. Aditivos à base de halogenetos, como os cloretos, na calda de injeção das bainhas favorecem a corrosão das armaduras de protensão. Por isso as normas de concreto protendido proíbem cloretos na calda.');
  ce('PETRO56', F_PETRO + '56', 'estruturas', cPetroPremo, 'Para o içamento de peças pré-moldadas, é correto adotar o aço CA60, tendo em vista sua maior resistência à tração.', 'E',
    'Errado. O aço CA-60 é trefilado e pouco dúctil, e a norma de pré-moldados (NBR 9062) pede aço dúctil nas alças de içamento, como o CA-25 ou o CA-50. O critério é a ductilidade, não a maior resistência à tração. (fundamento normativo a conferir)');
  ce('PETRO58', F_PETRO + '58', 'estruturas', cPetroAco, 'O engenheiro deve justificar a adoção de análise global elástica, que é indicada, por norma, somente para situações excepcionais.', 'E',
    'Errado. A análise global elástica é o procedimento corrente e pode ser aplicada a qualquer tipo de estrutura (NBR 8800). As análises plásticas é que têm condições restritivas de uso. Logo, a escolha da análise elástica não é excepcional nem exige justificativa especial.');
  ce('PETRO60', F_PETRO + '60', 'estruturas', cPetroAco, 'Ao considerar a influência de todas as ações que possam impactar significativamente a estrutura, o engenheiro poderia ter desprezado o estado-limite de serviço ao adotar o estado-limite último na análise.', 'E',
    'Errado. A verificação de segurança exige tanto os estados-limites últimos quanto os de serviço. Os deslocamentos e as vibrações, controlados pelo estado-limite de serviço, não podem ser dispensados só porque o estado-limite último foi verificado.');
  ce('PETRO61', F_PETRO + '61', 'estruturas', cPetroAco, 'Pelo comportamento flexível da estrutura em aço e pelos diversos fatores de segurança adotados em outros carregamentos, as cargas de vento podem ser desconsideradas no cálculo estrutural.', 'E',
    'Errado. As estruturas de aço são leves e esbeltas, e a ação do vento deve ser considerada (NBR 6123 e NBR 8800). Dispensá-la exige análise específica, não basta a flexibilidade da estrutura nem a existência de outros carregamentos.');
  ce('PETRO62', F_PETRO + '62', 'estruturas', cPetroGraf, 'A região A do gráfico representa o comportamento elástico da barra de aço.', 'C',
    'Certo. A região A, de 0 a 1, é o trecho inicial reto: tensão proporcional à deformação (lei de Hooke) e deformação reversível. É o comportamento elástico do aço.');
  ce('PETRO63', F_PETRO + '63', 'estruturas', cPetroGraf, 'O diagrama delimitado pelos pontos 0, 1, 2 e 5 representa a tensão-deformação real da barra de aço.', 'C',
    'Certo. A curva tracejada, que passa pelos pontos 0, 1, 2 e 5, é a real: considera a área e o comprimento instantâneos e, por isso, continua subindo após a tensão máxima. A curva contínua (0, 1, 2, 3 e 4) é a convencional, calculada com a seção inicial.');
  ce('PETRO64', F_PETRO + '64', 'estruturas', cPetroGraf, 'A estricção ocorre na região C, logo após a fase de escoamento.', 'E',
    'Errado. A estricção, redução localizada da seção da barra, ocorre depois da tensão máxima, na região D (de 3 a 4). A região C, que segue o escoamento, é a do encruamento.');
  ce('PETRO65', F_PETRO + '65', 'estruturas', cPetroViga, 'A reação no apoio B é maior do que a reação no apoio A.', 'E',
    'Errado. O apoio B é móvel e a carga é vertical, então as reações são verticais. Com a carga distribuída sobre o vão horizontal de 4 m, RA = RB = 500 × 4 / 2 = 1.000 kgf. As reações são iguais.');
  ce('PETRO66', F_PETRO + '66', 'estruturas', cPetroViga, 'O momento fletor máximo ocorre no centro da viga e tem valor igual a 1.000 kgf × m.', 'C',
    'Certo. O momento máximo de viga com carga uniformemente distribuída ocorre no meio do vão e vale qL²/8, com L = 4 m (vão horizontal): 500 × 4² / 8 = 1.000 kgf × m.');
  ce('PETRO67', F_PETRO + '67', 'estruturas', cPetroTrelica, 'A estrutura em treliça em tela é considerada isostática, pois a quantidade de reações nos apoios somada à quantidade de barras é o dobro do número total de nós.', 'C',
    'Certo. A treliça tem 3 nós, 3 barras e 3 reações de apoio (2 em A e 1 em B): b + r = 3 + 3 = 6 = 2n = 2 × 3. Essa igualdade caracteriza a treliça isostática.');
  ce('PETRO68', F_PETRO + '68', 'estruturas', cPetroTrelica, 'Teoricamente, na treliça em questão a flexão é nula nas barras 1, 2 e 3.', 'C',
    'Certo. Na treliça ideal, as barras são rotuladas e as cargas atuam nos nós, então as barras trabalham só com esforço normal, de tração ou compressão. A flexão é nula nas barras 1, 2 e 3.');
  ce('PETRO69', F_PETRO + '69', 'execucao', cPetroCuid, 'Para evitar a deformação de peças estruturais de concreto por retração, deve-se evitar a aplicação de cargas nas peças estruturais nos primeiros meses após a concretagem.', 'E',
    'Errado. A retração é a deformação própria do concreto, causada pela perda de água, e independe de carregamento. Para limitá-la, usam-se cura adequada, baixa relação água/cimento, juntas e armadura. A restrição a carregar a peça nos primeiros meses relaciona-se à resistência na idade e à fluência.');
  ce('PETRO70', F_PETRO + '70', 'materiais', cPetroCuid, 'O fator água/cimento influi diretamente na variabilidade da resistência à compressão do concreto, por isso, deve-se tomar o cuidado de não colocar excesso de água no concreto fresco com o objetivo de melhorar sua trabalhabilidade.', 'C',
    'Certo. A resistência à compressão cai quando a relação água/cimento aumenta (lei de Abrams), e o excesso de água também amplia a variabilidade da resistência. Para melhorar a trabalhabilidade, o recurso correto é o uso de aditivos plastificantes, não a água.');
  ce('PETRO72', F_PETRO + '72', 'fundacoes', cPetroFund, 'Em projeto de fundações rasas, quando o centro de gravidade da sapata não coincide com centro de carga do pilar, a viga de equilíbrio é uma solução viável.', 'C',
    'Certo. Quando o centro de carga do pilar não coincide com o centro da sapata, como em pilares de divisa, a viga de equilíbrio (viga alavanca) absorve o momento da excentricidade e uniformiza as tensões no solo.');
  ce('PETRO73', F_PETRO + '73', 'fundacoes', cPetroFund, 'Considerando-se o efeito de um grupo de estacas, é correto afirmar que a sua carga admissível não pode ser superior à de uma sapata de mesmo contorno que o do grupo.', 'C',
    'Certo. Pelo efeito de grupo, a carga admissível do conjunto de estacas não pode exceder a de uma sapata fictícia de mesmo contorno do grupo, apoiada na cota das pontas das estacas. (fundamento normativo a conferir)');
  ce('PETRO74', F_PETRO + '74', 'fundacoes', cPetroFund, 'Em terrenos com camadas de argila muito moles, uma alternativa recomendável em relação às fundações rasas é usar a estaca Franki, pois a cravação do seu tubo é realizada com a ponta fechada.', 'E',
    'Errado. Em argilas muito moles, o fuste concretado in loco da estaca Franki está sujeito a estrangulamento, por falta de confinamento lateral, e por isso a solução não é recomendável nessas camadas. A cravação do tubo com ponta fechada (bucha seca) é característica da estaca, mas não a torna adequada a esse solo. (fundamento normativo a conferir)');
  ce('PETRO75', F_PETRO + '75', 'fundacoes', cPetroFund, 'Chumbamentos e escalonamento em superfícies horizontais são preparações que podem viabilizar o assentamento de fundações sobre rochas de superfície inclinada.', 'C',
    'Certo. Em rocha com superfície inclinada, apoiar fundações rasas exige preparar o terreno: escalonar a superfície em patamares horizontais ou ancorar a fundação com chumbamentos, para evitar o deslizamento.');
  ce('PETRO76', F_PETRO + '76', 'fundacoes', cPetroHgeo, 'A infiltração diferencia-se da percolação no sentido de que a primeira refere-se ao fluxo que ocorre na interface solo-atmosfera e a segunda, ao fluxo que ocorre no interior do solo, sem a necessidade de um gradiente hidráulico.', 'E',
    'Errado. A infiltração é a entrada da água pela interface solo-atmosfera, e a percolação é o movimento no interior do solo. Esse movimento depende de gradiente hidráulico: sem diferença de carga hidráulica não há fluxo.');
  ce('PETRO77', F_PETRO + '77', 'fundacoes', cPetroHgeo, 'Tanto a precipitação quanto a evaporação podem ser tratadas como condições de contorno na solução da equação diferencial parcial de fluxo de água em meio poroso não saturado.', 'C',
    'Certo. Na análise de fluxo em meio não saturado (equação de Richards), a precipitação (infiltração) e a evaporação são impostas nas fronteiras superficiais como condições de contorno, em termos de fluxo ou de poropressão.');
  ce('PETRO78', F_PETRO + '78', 'fundacoes', cPetroHgeo, 'Para efeitos práticos, admite-se que a capacidade de infiltração seja superior ao coeficiente de condutividade hidráulica do solo saturado.', 'E',
    'Errado. A capacidade de infiltração é máxima no início da chuva e decresce até tender à condutividade hidráulica do solo saturado. Para efeitos práticos, admite-se que ela é igual a essa condutividade (taxa final de infiltração), não superior.');
  ce('PETRO79', F_PETRO + '79', 'fundacoes', cPetroMsolos, 'O regime de fluxo laminar observado nos solos ocorre abaixo de um valor crítico do número de Reynolds, o que permite desprezar a influência das forças de inércia e da energia cinética da água.', 'C',
    'Certo. O fluxo é laminar quando o número de Reynolds está abaixo do valor crítico, regime em que as forças viscosas predominam e a lei de Darcy vale. Nesse caso, a parcela de energia cinética (v²/2g) é desprezível na carga total.');
  ce('PETRO80', F_PETRO + '80', 'fundacoes', cPetroMsolos, 'Solos pouco compactados apresentam valores de resistência ao cisalhamento e de compressibilidade mais baixos.', 'E',
    'Errado. O solo pouco compactado tem maior índice de vazios e, por isso, menor resistência ao cisalhamento e maior compressibilidade. Sua compressibilidade não é mais baixa.');
  ce('PETRO81', F_PETRO + '81', 'fundacoes', cPetroMsolos, 'A diferença de pressão entre as fases ar e água é denominada sucção do solo; essa grandeza normalmente é utilizada para representar o estado energético da água em solos não saturados.', 'C',
    'Certo. A sucção matricial é a diferença entre a pressão do ar e a da água nos poros do solo (ua menos uw), e é usada para representar o estado de energia da água em solos não saturados.');
  ce('PETRO82', F_PETRO + '82', 'fundacoes', cPetroMsolos, 'Solos com granulometria mais fina exigem menores valores de sucção para serem drenados do que solos relativamente mais granulares.', 'E',
    'Errado. Solos finos retêm a água com maior força capilar, então exigem sucções maiores para serem drenados (maior valor de entrada de ar na curva característica). Os solos granulares drenam com sucções menores.');
  ce('PETRO83', F_PETRO + '83', 'fundacoes', cPetroTerra, 'Para impedir possível assoreamento, deve-se evitar lançar uma primeira camada de material permeável na base no aterro.', 'E',
    'Errado. A camada de base permeável funciona como colchão drenante e é recomendada em aterros sobre terrenos úmidos, para drenar a água e limitar a ascensão capilar. O risco de carreamento de finos se trata com filtro de proteção, e não evitando a camada drenante.');
  ce('PETRO85', F_PETRO + '85', 'fundacoes', cPetroTerra, 'Para tornar economicamente viável a obra, é correto definir as camadas de compactação com espessura superiores a 1 metro.', 'E',
    'Errado. A espessura das camadas compactadas depende do equipamento e costuma ficar em torno de 20 a 30 cm. Camadas acima de 1 m não são compactadas de forma homogênea, o que compromete o grau de compactação e a estabilidade do aterro.');
  ce('PETRO86', F_PETRO + '86', 'orcamento', cPetroCron, 'O valor de 1 milhão de reais de insumos estocados deve ser computado como custo real dos serviços já executados.', 'E',
    'Errado. Insumo estocado é material comprado e ainda não aplicado: representa desembolso ou compromisso, mas não serviço executado. O custo real dos serviços já executados considera apenas o que foi efetivamente incorporado à obra.');
  ce('PETRO87', F_PETRO + '87', 'orcamento', cPetroCron, 'Se os pagamentos efetuados corresponderem aos serviços efetivamente executados, eles comprovam que a obra está com sua programação física em dia.', 'E',
    'Errado. Pagar o valor programado não prova que o cronograma físico está em dia: o desembolso pode coincidir com o previsto mesmo com atividades atrasadas, se houver antecipação de serviços de maior valor. O avanço físico se confere comparando o executado com o planejado por atividade, sobretudo as do caminho crítico.');
  ce('PETRO88', F_PETRO + '88', 'materiais', cPetroConc, 'A cor avermelhada da areia não significa necessariamente material de má qualidade.', 'C',
    'Certo. A cor, por si só, não indica a qualidade da areia: a tonalidade avermelhada pode vir de óxidos de ferro inofensivos. A qualidade se confirma por ensaios de impurezas orgânicas, material pulverulento e torrões de argila (NBR 7211).');
  ce('PETRO90', F_PETRO + '90', 'materiais', cPetroConc, 'A vantagem da escolha do cimento pozolânico em obras expostas a ambientes agressivos é proporcionar maior impermeabilidade e durabilidade ao concreto.', 'C',
    'Certo. O cimento pozolânico (CP IV) tem alto teor de pozolana, que reage com o hidróxido de cálcio liberado na hidratação, reduz a porosidade e a permeabilidade e aumenta a resistência a sulfatos e cloretos. Isso favorece a durabilidade em ambiente agressivo.');
  ce('PETRO91', F_PETRO + '91', 'execucao', cPetroSold, 'A emenda por solda é permitida, desde que, nas peças de concreto com preponderância de cargas acidentais, haja uma redução da resistência de cálculo das barras de aço sujeitas à tração.', 'C',
    'Certo. A NBR 6118 admite a emenda por solda em barras de aço soldável. Em peças com carga variável (acidental) preponderante, a resistência de cálculo das barras tracionadas deve ser reduzida, por causa do efeito da solda e da fadiga.');
  ce('PETRO92', F_PETRO + '92', 'execucao', cPetroSold, 'O uso de graxa para proteger as barras contra corrosão é inadequado; devido o tempo longo de exposição, elas devem ser pintadas com pasta de cimento.', 'C',
    'Certo. A graxa prejudica a aderência da barra ao concreto e não é proteção adequada contra a corrosão. Para paralisações longas, as barras expostas devem ser protegidas, por exemplo com pasta de cimento, antes da retomada da concretagem. (fundamento normativo a conferir)');
  ce('PETRO93', F_PETRO + '93', 'materiais', cPetroSold, 'Na chegada do caminhão betoneira antes do expediente, se for constatado o início da pega, a liberação da concretagem somente pode ocorrer após a adição de água para a melhoria da trabalhabilidade da massa, verificada mediante o teste Slump.', 'E',
    'Errado. Concreto com início de pega não pode ser lançado nem recuperado: adicionar água para devolver a trabalhabilidade compromete a resistência e a durabilidade. A carga deve ser rejeitada. O ensaio de abatimento (slump) confere a consistência, não autoriza concreto em início de pega.');
  ce('PETRO94', F_PETRO + '94', 'fundacoes', cPetroVane, 'Uma reorganização das tensões principais no círculo de ruptura do aterro gerado pela anisotropia leva a uma resistência do solo superior à obtida no Vane-Test.', 'C',
    'Certo. Na ruptura real do aterro, as tensões principais giram ao longo da superfície circular e o solo é anisotrópico, enquanto a palheta impõe uma superfície cilíndrica e outra trajetória de tensões. Por isso a resistência mobilizada pode superar a obtida no ensaio. (fundamento normativo a conferir)');
  ce('PETRO95', F_PETRO + '95', 'fundacoes', cPetroVane, 'A velocidade do ensaio deve ser controlada, pois o aumento da velocidade leva a um endurecimento aparente do material, afetando o resultado do teste.', 'C',
    'Certo. A resistência não drenada depende da velocidade de cisalhamento: rotações mais rápidas dão valores maiores (endurecimento aparente). Por isso a velocidade do ensaio de palheta é padronizada e deve ser controlada (NBR 10905).');
  ce('PETRO96', F_PETRO + '96', 'fundacoes', cPetroVane, 'Devido ao efeito de fluência, o Vane-Test pode medir uma resistência do solo superior aquela que será utilizada no dimensionamento do aterro.', 'C',
    'Certo. O ensaio é rápido, e o aterro é construído lentamente. Pelo efeito de fluência (tempo), a resistência mobilizada no aterro é menor que a medida na palheta, o que exige correção do valor de campo para o projeto.');
  ce('PETRO100', F_PETRO + '100', 'hidro', cPetroEmp, 'A fórmula de Fair-Whipple-Hsiao é indicada para a análise de encanamentos de pequeno diâmetro, como é o caso do projeto de instalações prediais de água fria.', 'C',
    'Certo. A fórmula de Fair-Whipple-Hsiao é empírica e se aplica a tubulações de pequeno diâmetro (até cerca de 100 mm), como as das instalações prediais de água fria e quente.');
  ce('PETRO101', F_PETRO + '101', 'hidro', cPetroEmp, 'Na fórmula universal de perda de carga, também conhecida como Equação de Darcy-Weisbach, a perda de carga unitária é proporcional ao cubo da velocidade média.', 'E',
    'Errado. Na equação universal de perda de carga (Darcy-Weisbach), a perda é proporcional ao quadrado da velocidade média: hf = f × (L/D) × v² / 2g. Não é proporcional ao cubo.');
  ce('PETRO102', F_PETRO + '102', 'hidro', cPetroEmp, 'Uma das vantagens da fórmula de Hazen-Williams é o seu amplo limite de aplicação; ela pode ser utilizada para a análise de adutoras, redes de distribuição de água e sistemas de recalque.', 'C',
    'Certo. A fórmula de Hazen-Williams tem ampla faixa de aplicação (diâmetros de 50 mm ou mais) e é usada em adutoras, redes de distribuição e sistemas de recalque, com coeficiente C que depende do material e do envelhecimento do tubo.');
  ce('PETRO106', F_PETRO + '106', 'hidro', cPetroAf, 'O dimensionamento pelo método do consumo máximo possível utiliza como base ou unidade o tubo de 20 mm (3/4”) ao qual os diâmetros dos demais trechos se referem.', 'E',
    'Errado. O consumo máximo possível admite o uso simultâneo de todas as peças e soma as suas vazões. A unidade de tubo de referência (15 mm, ou 1/2 polegada) pertence ao método das seções equivalentes, e não é de 20 mm. (fundamento normativo a conferir)');
  ce('PETRO108', F_PETRO + '108', 'hidro', cPetroAf, 'No método do consumo máximo provável, a vazão ou descarga para o dimensionamento dos ramais e das colunas de alimentação é obtida pela divisão do coeficiente de descarga pela soma dos pesos das peças de utilização.', 'E',
    'Errado. No método do consumo máximo provável, a vazão de projeto é Q = C × √(ΣP), com C = 0,3 L/s e ΣP a soma dos pesos relativos das peças (NBR 5626). Não se divide o coeficiente pela soma dos pesos.');
  ce('PETRO109', F_PETRO + '109', 'estruturas', cPetroProt, 'Entre as verificações importantes em projetos de concreto protendido, estão os estados limites de descompressão e de compressão excessiva.', 'C',
    'Certo. No concreto protendido, verificam-se, entre os estados-limites de serviço, a descompressão e a compressão excessiva, além dos estados-limites últimos, conforme a NBR 6118.');
  ce('PETRO110', F_PETRO + '110', 'estruturas', cPetroProt, 'Em estruturas de concreto protendido, as armaduras passivas são aquelas utilizadas para produzir as forças de protensão, isto é, na qual se aplica um pré-alongamento inicial.', 'E',
    'Errado. A armadura ativa é a que recebe o pré-alongamento inicial e produz a força de protensão. A armadura passiva não é pré-alongada e trabalha só quando o concreto se deforma, como a armadura comum.');
  ce('PETRO113', F_PETRO + '113', 'complementares', cPetroElet, 'Segundo a ABNT, em banheiros, cozinhas, copas e áreas de serviço, a potência a ser atribuída a cada ponto de tomada deve ser de no mínimo 300 VA, até três pontos, e 75 VA, por ponto, para os excedentes, considerando-se cada um desses ambientes separadamente.', 'E',
    'Errado. Pela NBR 5410, em banheiros, cozinhas, copas e áreas de serviço, atribuem-se no mínimo 600 VA por tomada, até três tomadas, e 100 VA por tomada excedente, considerando cada ambiente separadamente.');
  ce('PETRO117', F_PETRO + '117', 'manutencao', cPetroConf, 'Segundo a ABNT, um dos conceitos considerados para a definição da vida útil de projeto dos sistemas, elementos e componentes de um edifício é a maior facilidade ou dificuldade de manutenção e reparação em caso de falha no desempenho.', 'C',
    'Certo. A NBR 15575 considera, na definição da vida útil de projeto, a facilidade ou dificuldade de manutenção e reparação em caso de falha de desempenho, além da durabilidade dos materiais, do ambiente e das condições de uso.');
  ce('PETRO118', F_PETRO + '118', 'manutencao', cPetroConf, 'Segundo a ABNT, o fator de luz diurna (FLD) é um parâmetro utilizado para medição in loco do desempenho lumínico das dependências das edificações habitacionais durante o dia, considerando as iluminações natural e artificial.', 'E',
    'Errado. O fator de luz diurna (FLD) relaciona a iluminância interna, em um ponto, à externa, com céu aberto, e avalia apenas a iluminação natural. Não considera a iluminação artificial.');
  ce('PETRO120', F_PETRO + '120', 'orcamento', cPetroGq, 'O principal objetivo da curva ABC é a identificação das possíveis relações de causa e efeito envolvendo as atividades de uma obra.', 'E',
    'Errado. A curva ABC (diagrama de Pareto) ordena os itens por participação no custo e prioriza os poucos que concentram a maior parte do valor. Identificar relações de causa e efeito é objetivo do diagrama de Ishikawa (espinha de peixe).');

  /* ===================== TCE-AC, Auditor de Controle Externo, Engenharia Civil (edital de 2024) ===================== */
  var F_TCEACA = 'TCE-AC 2024 (Auditor) · Cebraspe · item ';
  var cTceacaSeg = 'A respeito da segurança e higiene do trabalho em obras de engenharia, julgue o item.';
  var cTceacaProj = 'Julgue o item, relativo a projeto e execução de edificações.';
  var cTceacaRod = 'A respeito de projeto e execução de rodovias e ferrovias, julgue o item.';
  var cTceacaAgr = 'Acerca dos ensaios utilizados para verificar as propriedades físicas e mecânicas de materiais betuminosos e dos agregados, comumente utilizados em obras de pavimentação rodoviária, julgue o item.';
  var cTceacaSpt = 'A sondagem a percussão, também conhecida como SPT (standard penetration test), é um dos tipos de sondagem mais executadas em investigações geotécnicas. Acerca desse tipo de prospecção, julgue o item.';
  var cTceacaSolos = 'Julgue o item, referente à mecânica dos solos.';
  var cTceacaRm = 'Julgue o item, relativo a resistência dos materiais e análise material.';
  var cTceacaBarra = 'Considere uma barra homogênea de comprimento L, seção transversal uniforme de área A, de material com módulo de elasticidade E, presa em sua extremidade superior e solicitada por uma força axial centrada P na extremidade inferior (desprezam-se os efeitos do peso próprio da barra). Com base nessas informações, julgue o item, relativo a esforços em uma seção.';
  var cTceacaBieng = 'Considere uma viga biengastada, constituída de um material homogêneo de módulo de elasticidade E, comprimento L e seção transversal uniforme de área A, submetida a uma variação de temperatura de intensidade ΔT (desprezam-se os efeitos do peso próprio da viga). Com base nessas informações, julgue o item.';
  var cTceacaBalanco = 'Considere uma viga de concreto armado, engastada na extremidade esquerda, de seção transversal retangular, com comprimento L = 3 m, submetida exclusivamente a um carregamento uniformemente distribuído q = 10 kN/m, de cima para baixo. A partir dessas informações, julgue o item, considerando um eixo horizontal x orientado da esquerda para a direita e com origem no engaste.';
  var cTceacaConc = 'Julgue o item, relativo a dimensionamento de estruturas em concreto.';
  var cTceacaReaj = 'Acerca da composição e aplicação de índices para atualização de custos na construção civil, julgue o item.';
  var cTceacaArt = 'Julgue o item, relativo a emissão de ART e análise de documentação técnica para a concessão de aditivos contratuais.';
  var cTceacaPat = 'Julgue o item, referente a patologias em obras de engenharia civil.';
  ce('TCEACA51', F_TCEACA + '51', 'fiscalizacao', cTceacaSeg, 'A responsabilidade legal por violações das normas de segurança recai principalmente sobre os gerentes de projeto.', 'E',
    'Errado. Pela NR-1, cabe ao empregador cumprir e fazer cumprir as normas de segurança e saúde no trabalho, e é ele quem responde pelas violações. A responsabilidade não recai principalmente sobre os gerentes de projeto.');
  ce('TCEACA52', F_TCEACA + '52', 'fiscalizacao', cTceacaSeg, 'A implantação de medidas de segurança no trabalho é responsabilidade exclusiva do empregador.', 'E',
    'Errado. Embora caiba ao empregador implementar as medidas de segurança, os trabalhadores também têm deveres, como cumprir as normas e ordens de serviço e usar corretamente os EPIs fornecidos (NR-1). A responsabilidade não é exclusiva do empregador.');
  ce('TCEACA53', F_TCEACA + '53', 'fundacoes', cTceacaProj, 'A estabilização de taludes com a técnica de solo grampeado é ineficaz em meios porosos predominantemente arenosos.', 'C',
    'Certo. Em solos predominantemente arenosos e porosos, a aplicação do solo grampeado é restrita: a falta de coesão dificulta a escavação por etapas e a estabilidade da face, e a calda injetada tende a se perder nos vazios. A técnica rende mais em solos com alguma coesão. (fundamento normativo a conferir)');
  ce('TCEACA54', F_TCEACA + '54', 'fundacoes', cTceacaProj, 'Provas de carga são dispensáveis na execução de fundações caso o estudo geotécnico seja detalhado e conclusivo.', 'E',
    'Errado. A NBR 6122 exige provas de carga em fundações profundas conforme o tipo e o número de elementos da obra. Um estudo geotécnico detalhado não as dispensa, pois elas verificam o comportamento real do elemento de fundação. (fundamento normativo a conferir)');
  ce('TCEACA55', F_TCEACA + '55', 'fundacoes', cTceacaProj, 'Em escavações profundas, o uso de poços de drenagem é suficiente para controlar o nível de água subterrânea.', 'E',
    'Errado. Poços de drenagem isolados nem sempre bastam para rebaixar o lençol em escavações profundas. O método depende do solo e da vazão: ponteiras filtrantes, poços profundos, drenos horizontais ou cortinas estanques, definidos em projeto.');
  ce('TCEACA56', F_TCEACA + '56', 'fundacoes', cTceacaProj, 'O uso de geotêxteis é recomendado para a contenção de taludes expostos a altos níveis de erosão superficial.', 'C',
    'Certo. Geotêxteis, em mantas ou geocélulas, protegem a superfície do talude contra a erosão superficial: retêm partículas, favorecem a drenagem e a fixação da vegetação.');
  ce('TCEACA57', F_TCEACA + '57', 'fundacoes', cTceacaProj, 'A análise de estabilidade de taludes temporários é prescindível se as paredes da escavação forem escoradas.', 'E',
    'Errado. O escoramento não dispensa a análise de estabilidade: ele é dimensionado com base nos empuxos obtidos nessa análise, e a estabilidade global e a de fundo da escavação devem ser verificadas.');
  ce('TCEACA60', F_TCEACA + '60', 'fundacoes', cTceacaRod, 'O ensaio de vane test é inadequado para a determinação da capacidade de carga em solos granulares sob rodovias.', 'C',
    'Certo. O ensaio de palheta (vane test) mede a resistência não drenada de argilas moles saturadas. Em solos granulares, a resistência é drenada e depende do atrito, então o ensaio não se aplica. Para esses solos, usam-se SPT, CPT ou ensaios de laboratório.');
  ce('TCEACA64', F_TCEACA + '64', 'materiais', cTceacaAgr, 'A distribuição granulométrica dos agregados é determinada, usualmente, por meio de uma análise por peneiramento.', 'C',
    'Certo. A composição granulométrica dos agregados é determinada por peneiramento, em séries de peneiras normalizadas (NBR NM 248), e expressa pelas porcentagens retidas e pela curva granulométrica.');
  ce('TCEACA65', F_TCEACA + '65', 'fundacoes', cTceacaSpt, 'O índice de resistência a penetração (N) é determinado pelo número de golpes correspondente à cravação de 30 cm do amostrador padrão, após a cravação inicial de 15 cm.', 'C',
    'Certo. No SPT, o amostrador padrão é cravado por golpes de um martelo de 65 kg, caindo de 75 cm. Os primeiros 15 cm de cravação são de assentamento, e o N é o número de golpes para os 30 cm seguintes (NBR 6484).');
  ce('TCEACA66', F_TCEACA + '66', 'fundacoes', cTceacaSolos, 'O ângulo de atrito é um parâmetro usado para medir a resistência ao cisalhamento do solo, ao passo que sua deformabilidade é medida pela coesão.', 'E',
    'Errado. A resistência ao cisalhamento é expressa pelos parâmetros ângulo de atrito e coesão (critério de Mohr-Coulomb). A deformabilidade é medida pelo módulo de deformação (e pelo coeficiente de Poisson), não pela coesão.');
  ce('TCEACA67', F_TCEACA + '67', 'fundacoes', cTceacaSolos, 'O comportamento das areias sob baixos níveis de tensão é praticamente constante, independentemente do índice de vazios inicial.', 'E',
    'Errado. O comportamento das areias depende do índice de vazios (compacidade): areias fofas se contraem no cisalhamento, e areias compactas se dilatam, com maior resistência de pico. O comportamento não é independente do índice de vazios.');
  ce('TCEACA71', F_TCEACA + '71', 'estruturas', cTceacaRm, 'Um material dúctil é caracterizado por apresentar, durante o ensaio de tração, no início do diagrama, tensão e deformação em crescimento de maneira proporcional, até atingir o ponto de escoamento, em que se observa uma longa deformação, com pouco aumento da carga aplicada.', 'C',
    'Certo. Materiais dúcteis, como o aço doce, têm trecho inicial linear (tensão proporcional à deformação) e, no escoamento, grande deformação com pouco aumento de carga. Depois vêm o encruamento e a estricção.');
  ce('TCEACA72', F_TCEACA + '72', 'estruturas', cTceacaBarra, 'A deformação total da barra, para um carregamento que não extrapole o regime elástico do material, é dada por PA/(EL).', 'E',
    'Errado. Pela lei de Hooke, a deformação total é δ = PL/(EA): carga e comprimento no numerador, rigidez axial EA no denominador. A expressão apresentada, PA/(EL), troca os termos.');
  ce('TCEACA73', F_TCEACA + '73', 'estruturas', cTceacaBieng, 'Para uma variação de temperatura positiva, o esforço normal de compressão será o único atuante sobre a viga.', 'C',
    'Certo. Com os dois extremos engastados, a dilatação térmica positiva é impedida e surge compressão axial. Não há carga transversal nem gradiente de temperatura, então não há cortante nem flexão: o esforço normal de compressão é o único atuante.');
  ce('TCEACA74', F_TCEACA + '74', 'estruturas', cTceacaBieng, 'A tensão atuante na barra, considerando-se que a solicitação permaneça dentro do regime elástico, em módulo, é igual a EαΔT, em que α é o coeficiente de dilatação térmica.', 'C',
    'Certo. A deformação impedida é ε = αΔT e, no regime elástico, a tensão correspondente é σ = EαΔT, em módulo (compressão, para ΔT positivo).');
  ce('TCEACA75', F_TCEACA + '75', 'estruturas', cTceacaBalanco, 'A armadura longitudinal principal deve ser posicionada próxima à face superior da viga, a fim de reforçar a região tracionada da peça, já que o concreto é um material pouco resistente à tração.', 'C',
    'Certo. No balanço, a face superior é a tracionada. Como o concreto resiste pouco à tração, a armadura longitudinal principal é posicionada próxima à face superior.');
  ce('TCEACA76', F_TCEACA + '76', 'estruturas', cTceacaBalanco, 'A função do esforço cortante ao longo do eixo x é dada por V(x) = −30 − 10x.', 'E',
    'Errado. Com origem no engaste, na extremidade esquerda, a reação vertical é qL = 30 kN e, pela convenção usual, V(x) = 30 − 10x (kN), decrescendo até zero na extremidade livre (x = 3 m). A função apresentada, −30 − 10x, tem sinal trocado no termo constante.');
  ce('TCEACA77', F_TCEACA + '77', 'estruturas', cTceacaBalanco, 'A função do momento fletor ao longo do eixo x é dada por M(x) = −45 − 30x − 5x².', 'E',
    'Errado. O momento no engaste é −qL²/2 = −45 kN·m e M(x) = −45 + 30x − 5x². A função apresentada, −45 − 30x − 5x², tem o termo linear com sinal trocado e daria −180 kN·m na extremidade livre, onde o momento deve ser nulo.');
  ce('TCEACA78', F_TCEACA + '78', 'estruturas', cTceacaConc, 'A fluência é um tipo de deformação de natureza elástica que surge imediatamente após a retirada do escoramento, sendo função da umidade relativa do ar e das dimensões das peças.', 'E',
    'Errado. A fluência é deformação lenta, dependente do tempo e da tensão aplicada, e não elástica nem imediata. A deformação imediata é a elástica. A fluência depende, entre outros fatores, da umidade relativa do ar e das dimensões da peça.');
  ce('TCEACA79', F_TCEACA + '79', 'estruturas', cTceacaConc, 'O dimensionamento das peças de concreto pré-moldado deve levar em consideração o tipo de transporte que será utilizado para conduzir os elementos até seu local de utilização.', 'C',
    'Certo. As peças pré-moldadas passam por desforma, içamento, transporte e montagem, fases com esquemas estáticos e solicitações próprios, que devem ser verificados no projeto (NBR 9062).');
  ce('TCEACA80', F_TCEACA + '80', 'estruturas', cTceacaConc, 'As armaduras ativas são submetidas a forças de compressão aplicadas antes de a peça estrutural entrar em serviço, a fim de que sejam originadas tensões de compressão na referida peça, que reduzirão as tensões de tração a serem produzidas no concreto.', 'E',
    'Errado. As armaduras ativas são tracionadas (pré-alongadas) antes de a peça entrar em serviço. Ao serem liberadas, transferem ao concreto forças de compressão, que reduzem as tensões de tração produzidas pelas cargas. A tração se aplica ao aço, e a compressão, ao concreto.');
  ce('TCEACA81', F_TCEACA + '81', 'fiscalizacao', cTceacaReaj, 'Em uma contratação pública regida pela Lei n.º 14.133/2021, a administração deverá indicar, no respectivo contrato de prestação de serviços, cláusula que estabeleça o índice de reajustamento de preço, com data-base vinculada à data do orçamento estimado.', 'C',
    'Certo. É obrigatória a previsão, no edital e no contrato, de índice de reajustamento de preço, independentemente do prazo de duração do contrato, com data-base vinculada à data do orçamento estimado (art. 25, § 7.º, da Lei 14.133/2021).');
  ce('TCEACA83', F_TCEACA + '83', 'fiscalizacao', cTceacaArt, 'Registros de variação do valor contratual para fazer face ao reajuste ou à repactuação de preços previstos no próprio contrato poderão ser realizados por simples apostila, não sendo necessária a celebração de termo aditivo.', 'C',
    'Certo. A Lei 14.133/2021 dispensa termo aditivo para registrar a variação do valor contratual decorrente de reajuste ou repactuação previstos no próprio contrato: basta a apostila (art. 136, I).');
  ce('TCEACA84', F_TCEACA + '84', 'fiscalizacao', cTceacaArt, 'Nas hipóteses em que for adotada a contratação integrada ou semi-integrada, poderão ser concedidas alterações dos valores contratuais, por ocorrência de evento superveniente alocado na respectiva matriz de riscos como de responsabilidade da administração.', 'C',
    'Certo. Nas contratações integrada e semi-integrada, a Lei 14.133/2021 admite alteração do valor contratual por evento superveniente que a matriz de riscos atribua à Administração. A matriz distribui os riscos e fixa o equilíbrio econômico-financeiro inicial do contrato. (fundamento normativo a conferir)');
  ce('TCEACA85', F_TCEACA + '85', 'fiscalizacao', cTceacaArt, 'Profissionais indicados pela licitante para fins de qualificação técnico-profissional deverão participar da execução contratual e não poderão ser substituídos, mesmo que por outros profissionais com comprovada experiência equivalente ou superior.', 'E',
    'Errado. Os profissionais indicados para a qualificação técnico-profissional devem participar da obra ou serviço, mas a Lei 14.133/2021 admite substituí-los por outros de experiência equivalente ou superior, com aprovação da Administração (art. 67, § 6.º).');
  ce('TCEACA88', F_TCEACA + '88', 'manutencao', cTceacaPat, 'Considere que tenha sido identificada uma fissura em uma edificação, com inclinação próxima a 45° e variações entre as dimensões das aberturas em seus extremos. Nesse caso, há indícios de patologia causada por processo de recalque diferencial na fundação da edificação, podendo a regra de Dickran, também conhecida como regra da mediatriz, ser utilizada como técnica auxiliar para a identificação do elemento estrutural provocador da fissura.', 'C',
    'Certo. Fissuras inclinadas a cerca de 45°, com aberturas diferentes nos extremos, são típicas de recalque diferencial da fundação. A regra de Dickran (da mediatriz) auxilia a localizar o elemento estrutural que se deslocou e provocou a fissura.');

  /* ===================== MPCE, Analista Ministerial, Engenharia Civil (edital de 2020) ===================== */
  var F_MPCE = 'MPCE 2020 · Cebraspe · item ';
  var cMpceLic = 'Julgue o item, relativo a licitação de obras públicas.';
  var cMpceContr = 'Julgue o item, relativo a contratos de obras públicas.';
  var cMpceEsp = 'Julgue o item, relativo à contratação e ao orçamento de obras e serviços de engenharia.';
  var cMpceSeg = 'A respeito da segurança e higiene do trabalho, julgue o item.';
  var cMpcePlan = 'Acerca da fase de planejamento de projetos e obras, julgue o item.';
  var cMpceExec = 'Na execução de uma obra prevista em contrato, devem ser levados em consideração diversos aspectos construtivos e de controle de qualidade. Acerca desses aspectos, julgue o item.';
  var cMpceAspc = 'A respeito de aspectos construtivos de uma edificação, julgue o item.';
  var cMpceOrc = 'A respeito da análise orçamentária de uma obra, julgue o item.';
  var cMpceGest = 'Acerca da gestão na produção de edificações, julgue o item.';
  var cMpceIrrig = 'Julgue o item, a respeito dos diferentes métodos de irrigação.';
  var cMpceRod = 'Seis meses após o início de uma obra contratada por empreitada por preço unitário, a construtora responsável pela execução de determinada rodovia pleiteou um acréscimo de quantitativo em razão de erro de projeto. Além disso, devido ao aumento de serviços, a construtora solicitou pagamento de reajustamento e acréscimo de prazo de execução. Com base na situação hipotética apresentada, julgue o item.';
  ce('MPCE51', F_MPCE + '51', 'fiscalizacao', cMpceLic, 'É hipótese de inexigibilidade de licitação a contratação de profissional ou empresa de notória especialização para fiscalização, supervisão ou gerenciamento de obras, de natureza singular, quando houver inviabilidade de competição.', 'C',
    'Certo. A inexigibilidade por inviabilidade de competição alcança serviços técnicos especializados de notória especialização, entre eles a fiscalização, supervisão ou gerenciamento de obras ou serviços. O gabarito é de 2020, sob a Lei 8.666/1993; a Lei 14.133/2021 mantém a hipótese (art. 74, III) e dispensa a exigência de natureza singular. (fundamento normativo a conferir)');
  ce('MPCE52', F_MPCE + '52', 'fiscalizacao', cMpceLic, 'Em processo licitatório para escolha de trabalho técnico, científico ou artístico, deve-se utilizar uma combinação das modalidades convite e concurso.', 'E',
    'Errado. O trabalho técnico, científico ou artístico é escolhido por concurso, modalidade própria, com critérios definidos em edital e prêmio ou remuneração ao vencedor. Ele não se combina com o convite, modalidade que a Lei 14.133/2021 extinguiu.');
  ce('MPCE53', F_MPCE + '53', 'fiscalizacao', cMpceLic, 'A revogação consiste em desfazer um ato válido, legítimo, porém não mais conveniente, útil ou oportuno para a administração pública, não cabendo recurso administrativo após a intimação desse ato ou a lavratura da ata.', 'E',
    'Errado. Revogar é desfazer ato válido por conveniência e oportunidade, mas cabe recurso administrativo contra a anulação ou revogação da licitação, no prazo de 3 dias úteis contado da intimação ou da lavratura da ata (art. 165, I, da Lei 14.133/2021).');
  ce('MPCE55', F_MPCE + '55', 'fiscalizacao', cMpceLic, 'Para fins de adiantamento de cronograma, é permitida a execução de obras concomitantemente à fase de elaboração do projeto básico, desde que autorizado pela administração.', 'E',
    'Errado. A licitação e a execução de obras dependem de projeto básico aprovado, e a Administração não pode autorizar o início da obra em paralelo à sua elaboração. A autorização não supre essa exigência. (fundamento normativo a conferir)');
  ce('MPCE60', F_MPCE + '60', 'fiscalizacao', cMpceContr, 'A administração pública pode exigir de empresa executora de obra pública um projeto as built, com o objetivo de documentar as condições da construção.', 'C',
    'Certo. O projeto as built registra a obra como foi efetivamente executada, com as alterações feitas em campo. A Administração pode exigi-lo da contratada para documentar as condições da construção e subsidiar a manutenção.');
  ce('MPCE61', F_MPCE + '61', 'fiscalizacao', cMpceContr, 'Reajuste ou repactuação é um direito do contratado de formalizar, junto à administração, pedido de modificação contratual em decorrência de alteração extraordinária nos preços que não esteja relacionada a correção monetária. Nesse contexto, o pedido de reajuste é o meio que o contratado utiliza quando a atividade de execução do contrato se sujeita a uma excepcional elevação de preços ou quando os encargos contratualmente previstos são ampliados ou se tornam extremamente onerosos.', 'E',
    'Errado. O pedido decorrente de fato extraordinário ou imprevisível, que desequilibra o contrato, é a revisão (reequilíbrio econômico-financeiro), não o reajuste. O reajuste é a correção de preços por índice previsto no contrato, para a variação ordinária de custos.');
  ce('MPCE62', F_MPCE + '62', 'fiscalizacao', cMpceContr, 'Para a contratação de obras e serviços de engenharia, cabe às comissões de licitação dos órgãos públicos exigir dos participantes do certame certidão de registro e quitação dos membros da equipe técnica nas respectivas entidades profissionais competentes.', 'C',
    'Certo. Nas obras e serviços de engenharia, a habilitação técnica exige prova de registro ou inscrição na entidade profissional competente (CREA ou CAU), com certidão de registro e quitação da empresa e dos profissionais da equipe técnica.');
  ce('MPCE64', F_MPCE + '64', 'orcamento', cMpceEsp, 'Ao elaborar o orçamento estimado para uma licitação, a administração deve considerar, para o cálculo do BDI, as despesas financeiras, as garantias, os seguros, o lucro, os materiais e a mão de obra.', 'E',
    'Errado. O BDI cobre despesas indiretas e o lucro: administração central, seguros, garantias, despesas financeiras, riscos e tributos. Materiais e mão de obra são custos diretos e ficam nas composições de custos unitários, fora do BDI.');
  ce('MPCE65', F_MPCE + '65', 'fiscalizacao', cMpceSeg, 'A higiene do trabalho refere-se ao conjunto de normas e procedimentos que visa à proteção da integridade física e mental do trabalhador, preservando-o dos riscos de saúde inerentes às tarefas do cargo e ao ambiente físico onde são executadas.', 'C',
    'Certo. A higiene do trabalho trata do ambiente e das condições de trabalho, para preservar a saúde do trabalhador contra os riscos inerentes às tarefas e ao ambiente físico. A segurança do trabalho cuida da prevenção de acidentes.');
  ce('MPCE66', F_MPCE + '66', 'fiscalizacao', cMpceSeg, 'As normas regulamentadoras (NR) relativas à segurança e higiene do trabalho devem, obrigatoriamente, ser seguidas pelas empresas privadas e públicas e pelos órgãos públicos da administração direta e indireta, bem como pelos órgãos dos Poderes Legislativo e Judiciário que possuam empregados regidos pela Consolidação das Leis do Trabalho (CLT).', 'C',
    'Certo. As normas regulamentadoras são de observância obrigatória por empresas privadas e públicas, órgãos da administração direta e indireta e dos Poderes Legislativo e Judiciário que tenham empregados regidos pela CLT (NR-1).');
  ce('MPCE67', F_MPCE + '67', 'fiscalizacao', cMpceSeg, 'A norma regulamentadora que versa sobre transporte, movimentação, armazenagem e manuseio de materiais é um exemplo de norma de segurança do trabalho.', 'C',
    'Certo. A NR-11 trata de transporte, movimentação, armazenagem e manuseio de materiais e é uma norma de segurança do trabalho.');
  ce('MPCE68', F_MPCE + '68', 'fiscalizacao', cMpcePlan, 'O projeto básico é o conjunto de elementos necessários e suficientes, com nível de precisão adequado, para caracterizar a obra objeto da licitação; é elaborado com base nas indicações de estudos técnicos preliminares que assegurem a viabilidade técnica e o adequado tratamento do impacto ambiental do empreendimento e que possibilitem a avaliação do custo da obra e a definição dos métodos e do prazo de execução.', 'C',
    'Certo. É a definição de projeto básico das Leis 8.666/1993 (art. 6.º, IX) e 14.133/2021 (art. 6.º, XXV): elementos necessários e suficientes, com nível de precisão adequado, para caracterizar a obra, com base em estudos técnicos preliminares que assegurem a viabilidade técnica e o tratamento do impacto ambiental e permitam avaliar o custo e definir métodos e prazo.');
  ce('MPCE70', F_MPCE + '70', 'fiscalizacao', cMpcePlan, 'O projeto executivo é um conjunto de elementos que explicita a obra, o serviço ou o complexo de obras e serviços que compõem o empreendimento, de tal modo que suas características básicas e desempenho almejado estejam perfeitamente definidos, deixando a estimativa de seu custo e prazo de execução para a fase do projeto básico.', 'E',
    'Errado. O projeto executivo é o conjunto de elementos necessários e suficientes à execução completa da obra, com detalhes construtivos e especificações. A estimativa de custo e prazo parte do projeto básico, que antecede o executivo. O item inverte essa relação.');
  ce('MPCE71', F_MPCE + '71', 'fiscalizacao', cMpceExec, 'As especificações técnicas de um projeto reúnem informações detalhadas sobre as propriedades mínimas dos materiais e a técnica a ser empregada na construção.', 'C',
    'Certo. As especificações técnicas descrevem as propriedades mínimas dos materiais e serviços e a técnica construtiva, complementam os desenhos do projeto e orientam a aquisição, a execução e a fiscalização.');
  ce('MPCE72', F_MPCE + '72', 'materiais', cMpceExec, 'No caso dos concretos, a retomada de um processo de cura abandonado permite que a estrutura recupere parte da resistência perdida, desde que o processo seja reiniciado o mais rápido possível.', 'C',
    'Certo. A cura úmida favorece a hidratação do cimento. Se for abandonada e retomada logo, a hidratação prossegue e a estrutura recupera parte da resistência perdida. Quanto mais tardia a retomada, menor a recuperação.');
  ce('MPCE73', F_MPCE + '73', 'materiais', cMpceExec, 'No que diz respeito à compatibilidade entre aditivos utilizados no concreto, é apropriado o uso simultâneo do acelerador e do retardador, desde que aprovado previamente em testes de laboratório.', 'E',
    'Errado. Aceleradores e retardadores agem de forma antagônica sobre a pega, e o uso combinado pode anular os efeitos ou causar comportamento imprevisível. Não é apropriado. (fundamento normativo a conferir)');
  ce('MPCE75', F_MPCE + '75', 'materiais', cMpceAspc, 'Nos casos de edificação com estrutura de concreto armado em que a mistura do concreto for feita em obra, o técnico responsável deve garantir que a resistência média do concreto à compressão aos 28 dias (Fc28) esteja de acordo com a resistência característica do concreto à compressão (Fck). Nesse sentido, a relação entre Fc28 e Fck é dada em função do nível de controle da qualidade da concretagem.', 'C',
    'Certo. A resistência média de dosagem é o fck somado a um valor proporcional ao desvio-padrão da produção (fcj = fck + 1,65 sd). O desvio depende do nível de controle (condições A, B ou C da NBR 12655), por isso a relação entre a resistência média e a característica varia com o controle da qualidade.');
  ce('MPCE78', F_MPCE + '78', 'orcamento', cMpceOrc, 'Por diversos motivos, pode haver variações nos preços de insumos necessários para uma obra, o que pode ocasionar mudanças significativas no custo total do empreendimento. No caso de aumento do preço de determinado insumo durante a realização da obra, a construtora pode requerer um reajuste contratual para realinhar os preços. Nesse contexto, a curva ABC de insumos permite que o cliente avalie se o valor do reajuste solicitado está de acordo com o aumento no insumo em questão.', 'C',
    'Certo. A curva ABC ordena os insumos por impacto no custo total. Com ela, o cliente identifica os insumos mais relevantes e confere se o reajuste pedido para um insumo é compatível com o seu peso no custo e com a variação de preço informada.');
  ce('MPCE79', F_MPCE + '79', 'orcamento', cMpceOrc, 'Em uma composição de custos unitários, o valor apresentado na coluna de custo unitário consiste no custo de aquisição ou emprego de uma unidade do insumo, enquanto o valor da coluna de custo total é obtido pela multiplicação do custo unitário pela quantidade do insumo necessária à obra.', 'E',
    'Errado. Na composição de custo unitário, o custo total do insumo é o produto do coeficiente de consumo (quantidade por unidade do serviço) pelo custo unitário do insumo. Ele se refere a uma unidade do serviço, e não à quantidade necessária à obra, que só aparece ao multiplicar pelo quantitativo do orçamento.');
  ce('MPCE80', F_MPCE + '80', 'orcamento', cMpceOrc, 'Situação hipotética: Uma obra cujo custo orçado era de R$ 75.000 foi negociada em uma cidade onde os impostos correspondiam a 10% do preço de venda. Na negociação de venda, a construtora responsável pela obra obteve um lucro de 15% sobre o preço de venda do empreendimento. Assertiva: A construtora vendeu a obra pelo valor de R$ 100.000.', 'C',
    'Certo. Sendo P o preço de venda: P = 75.000 + 0,10P + 0,15P, ou 0,75P = 75.000, logo P = R$ 100.000. Conferência: impostos de R$ 10.000 e lucro de R$ 15.000 somados ao custo de R$ 75.000.');
  ce('MPCE85', F_MPCE + '85', 'execucao', cMpceGest, 'O primeiro estágio do ciclo de vida de um projeto consiste na concepção e viabilidade, o que inclui, entre outras etapas, a definição de escopo, a estimativa de custos e o estudo de viabilidade.', 'C',
    'Certo. O ciclo de vida de um projeto começa pela concepção e viabilidade (definição de escopo, estimativa de custos e estudo de viabilidade) e segue com planejamento, execução e encerramento.');
  ce('MPCE94', F_MPCE + '94', 'hidro', cMpceIrrig, 'A irrigação de subsuperfície consiste em colocar a água a determinada profundidade para que ela seja transferida para a zona das raízes por capilaridade.', 'C',
    'Certo. Na irrigação subsuperficial, a água é aplicada abaixo da superfície, por elevação do lençol ou por tubos enterrados, e chega à zona das raízes por capilaridade.');
  ce('MPCE95', F_MPCE + '95', 'hidro', cMpceIrrig, 'A irrigação por sulcos e a irrigação por faixa lateral são exemplos de irrigação superficial.', 'C',
    'Certo. A irrigação superficial distribui a água sobre o terreno por gravidade, e sulcos e faixas são exemplos clássicos.');
  ce('MPCE113', F_MPCE + '113', 'fiscalizacao', cMpceRod, 'A variação de quantitativo em decorrência de erro de projeto é risco da contratada, que já será ressarcida no item riscos e eventuais, constante na composição das bonificações e despesas indiretas (BDI).', 'E',
    'Errado. O erro do projeto básico fornecido pela Administração é risco dela e justifica aditivo quantitativo dentro dos limites legais. O item riscos e eventuais do BDI cobre incertezas ordinárias do contratado, não erros de projeto da contratante.');
  ce('MPCE114', F_MPCE + '114', 'orcamento', cMpceRod, 'O acréscimo de prazo de execução implica aumento de custos de administração local.', 'C',
    'Certo. A administração local (equipe técnica e administrativa, canteiro e consumos) é custo direto proporcional ao tempo de obra. Acrescentar prazo de execução prorroga essa estrutura e aumenta seu custo.');
  ce('MPCE115', F_MPCE + '115', 'fiscalizacao', cMpceRod, 'A contratada somente terá direito a reajustamento um ano após o início da obra.', 'E',
    'Errado. A anualidade do reajuste conta da data-base do orçamento estimado (ou da proposta), e não do início da obra, pois o índice recompõe a variação ocorrida desde essa referência (art. 25, § 7.º, da Lei 14.133/2021).');
  ce('MPCE116', F_MPCE + '116', 'fiscalizacao', cMpceRod, 'Em obra rodoviária, em um mesmo contrato pode haver índices diferenciados para determinados tipos de serviços.', 'C',
    'Certo. A Lei 14.133/2021 admite mais de um índice específico ou setorial no mesmo contrato, conforme a realidade de mercado dos respectivos insumos (art. 25, § 7.º).');

  /* ===================== INÉDITAS (estilo Cebraspe) ===================== */
  var cNbr6118 = 'Acerca do projeto de estruturas de concreto armado conforme a ABNT NBR 6118, julgue o item.';
  ce('IN01', F_IN, 'estruturas', cNbr6118, 'Para vigas e pilares de concreto armado situados em ambiente de classe de agressividade ambiental III, o cobrimento nominal mínimo é de 40 mm.', 'C',
    'Certo. Tabela 7.2 da NBR 6118 (Δc = 10 mm), para viga e pilar: CAA I = 25 mm, II = 30 mm, III = 40 mm e IV = 50 mm. Para lajes, 20, 25, 35 e 45 mm.');
  ce('IN02', F_IN, 'estruturas', cNbr6118, 'Em ambiente de classe de agressividade ambiental II, o concreto armado deve ter classe mínima C25 e relação água/cimento máxima de 0,60.', 'C',
    'Certo. Tabela 7.1 da NBR 6118 para concreto armado: CAA I – C20 e a/c ≤ 0,65; II – C25 e 0,60; III – C30 e 0,55; IV – C40 e 0,45.');
  ce('IN03', F_IN, 'estruturas', cNbr6118, 'Para a verificação de aceitabilidade sensorial visual, o deslocamento-limite das flechas totais de vigas e lajes é L/250.', 'C',
    'Certo. A tabela 13.3 da NBR 6118 fixa L/250 para deslocamentos visíveis (efeito visual) e L/350 para vibrações sentidas no piso.');
  ce('IN04', F_IN, 'estruturas', cNbr6118, 'Nas combinações normais de estado-limite último, os coeficientes de ponderação das resistências do concreto e do aço valem, respectivamente, 1,4 e 1,15.', 'C',
    'Certo. γc = 1,4 e γs = 1,15 nas combinações normais. Nas combinações especiais ou de construção, 1,2 e 1,15; nas excepcionais, 1,2 e 1,0.');
  ce('IN05', F_IN, 'estruturas', cNbr6118, 'No estádio II, admite-se que o concreto tracionado colabora com o aço na resistência à tração da seção fissurada.', 'E',
    'Errado. No estádio II o concreto já fissurou na zona tracionada e sua resistência à tração é desprezada; toda a tração vai para a armadura. O concreto à tração só é considerado no estádio I.');
  ce('IN06', F_IN, 'estruturas', cNbr6118, 'Uma laje retangular apoiada nos quatro bordos cuja relação entre o vão maior e o vão menor seja superior a 2 é usualmente calculada como armada em uma só direção.', 'C',
    'Certo. Com λ = ly/lx > 2, a carga vai quase toda na direção do menor vão, e a laje é tratada como armada em uma direção, com armadura de distribuição na outra.');

  var cRes = 'Com relação à resistência dos materiais e à análise de estruturas, julgue o item.';
  ce('IN07', F_IN, 'estruturas', cRes, 'Em uma viga biapoiada sob carga uniformemente distribuída p, de vão L e rigidez EI, a flecha máxima vale 5pL⁴/(384EI) e o momento máximo vale pL²/8.', 'C',
    'Certo. São os resultados clássicos da viga biapoiada com carga uniforme, ambos no meio do vão.');
  ce('IN08', F_IN, 'estruturas', cRes, 'Dobrando-se o comprimento de flambagem de um pilar, mantidos material e seção, sua carga crítica de Euler reduz-se à metade.', 'E',
    'Errado. Pcr = π²EI/Le². Dobrar Le reduz a carga crítica a um quarto.');
  ce('IN09', F_IN, 'estruturas', cRes, 'Uma viga biengastada submetida a carregamento plano genérico é três vezes hiperestática.', 'C',
    'Certo. São 6 reações (3 em cada engaste) e 3 equações de equilíbrio no plano: grau de hiperestaticidade 6 − 3 = 3.');
  ce('IN10', F_IN, 'estruturas', cRes, 'O aço estrutural ASTM A36, muito usado em perfis laminados, possui resistência ao escoamento de 250 MPa.', 'C',
    'Certo. O A36 tem fy = 250 MPa e fu entre 400 e 550 MPa. Perfis de alta resistência, como o A572 Gr. 50, têm fy = 345 MPa.');
  ce('IN11', F_IN, 'estruturas', 'Sobre projetos de fôrmas e escoramentos e a NBR 14931, julgue o item.', 'A retirada das fôrmas e do escoramento pode ser feita em qualquer sequência, desde que transcorridos sete dias da concretagem.', 'E',
