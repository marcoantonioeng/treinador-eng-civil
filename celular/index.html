    'Errado. A desforma depende de o concreto ter atingido a resistência necessária e de seguir um plano que evite esforços não previstos. Balanços, por exemplo, são desescorados da extremidade para o apoio. Não existe prazo único que autorize qualquer sequência.');

  var cFund = 'Acerca de investigações geotécnicas, fundações e contenções, julgue o item.';
  ce('IN12', F_IN, 'fundacoes', cFund, 'No ensaio SPT, o índice N corresponde ao número de golpes necessários para cravar os 30 cm finais do amostrador padrão, com martelo de 65 kg caindo de 75 cm de altura.', 'C',
    'Certo. NBR 6484: o amostrador é cravado 45 cm em três segmentos de 15 cm, e o NSPT é a soma dos golpes dos dois últimos (30 cm). O martelo tem 65 kg e cai de 75 cm.');
  ce('IN13', F_IN, 'fundacoes', cFund, 'Pela NBR 8036, para edificação com área de projeção de 350 m², o número mínimo de sondagens de simples reconhecimento é três.', 'C',
    'Certo. A NBR 8036 pede no mínimo 2 furos para áreas até 200 m² e 3 furos entre 200 e 400 m². Acima disso, 1 furo a cada 200 m² até 1.200 m².');
  ce('IN14', F_IN, 'fundacoes', cFund, 'Segundo a teoria de Rankine, para solo não coesivo com ângulo de atrito φ, o coeficiente de empuxo ativo é Ka = tan²(45° − φ/2), sempre menor que o coeficiente de empuxo passivo.', 'C',
    'Certo. Ka = tan²(45° − φ/2) e Kp = tan²(45° + φ/2) = 1/Ka. Para φ > 0, Ka < 1 < Kp.');
  ce('IN15', F_IN, 'fundacoes', cFund, 'O atrito negativo em estacas ocorre quando o solo ao redor do fuste recalca mais que a estaca, como no caso de aterro recente sobre argila mole, acrescentando carga à fundação.', 'C',
    'Certo. Quando o solo desce em relação à estaca, o atrito lateral passa a atuar para baixo e soma carga à fundação, em vez de resistir.');
  ce('IN16', F_IN, 'fundacoes', cFund, 'Na estaca hélice contínua monitorada, o concreto é bombeado pelo tubo central do trado durante sua retirada, e a armadura é introduzida após a concretagem.', 'C',
    'Certo. É a sequência executiva da hélice contínua: perfuração contínua, concretagem por bombeamento durante a extração do trado e inserção da armação no concreto fresco.');
  ce('IN17', F_IN, 'fundacoes', cFund, 'Tubulões a céu aberto são indicados para escavações abaixo do nível d\'água em areias puras, dispensando revestimento ou uso de ar comprimido.', 'E',
    'Errado. Tubulões a céu aberto são escavados acima do nível d\'água, em solos coesivos que se mantêm estáveis. Abaixo do lençol, sobretudo em areias, usam-se revestimento e ar comprimido, ou outra solução.');
  ce('IN18', F_IN, 'fundacoes', cFund, 'Muros de arrimo de gravidade resistem ao empuxo de terra principalmente por meio do próprio peso.', 'C',
    'Certo. Muros de gravidade (concreto ciclópico, pedra, gabiões) equilibram o empuxo pelo peso próprio e são verificados quanto a tombamento, deslizamento e capacidade de carga da base.');

  var cMat = 'Julgue o item acerca de materiais de construção e de seu controle tecnológico.';
  ce('IN19', F_IN, 'materiais', cMat, 'Segundo a NBR 7212, o concreto dosado em central deve ser transportado de modo que o intervalo entre o início da mistura e a entrega não ultrapasse 90 minutos, e a descarga deve terminar em até 150 minutos do início da mistura.', 'C',
    'Certo. São os limites usuais da NBR 7212 para concreto sem aditivo retardador: 90 min até a entrega e 150 min até o fim da descarga.');
  ce('IN20', F_IN, 'materiais', cMat, 'O ensaio de abatimento do tronco de cone permite estimar diretamente a resistência à compressão do concreto fresco.', 'E',
    'Errado. O slump test (NBR 16889) mede a consistência e a trabalhabilidade. A resistência é verificada em corpos de prova cilíndricos rompidos à compressão (NBR 5739).');
  ce('IN21', F_IN, 'materiais', cMat, 'No controle de aceitação do concreto (NBR 12655), cada exemplar é constituído por dois corpos de prova da mesma amassada, adotando-se como resistência do exemplar o maior dos dois valores obtidos.', 'C',
    'Certo. A NBR 12655 define o exemplar como dois CPs moldados da mesma betonada, e vale o maior dos dois resultados.');

  ce('IN23', F_IN, 'materiais', cMat, 'O cimento Portland de alto-forno (CP III), por apresentar menor calor de hidratação e maior resistência a sulfatos, é indicado para concreto massa e obras em ambiente agressivo.', 'C',

  ce('IN28', F_IN, 'execucao', cExec, 'No adensamento com vibrador de imersão, recomenda-se encostar a agulha na armadura para transmitir a vibração a toda a massa de concreto.', 'E',

  ce('IN44', F_IN, 'complementares', cComp, 'Nos sistemas VRF (fluxo de refrigerante variável), uma unidade condensadora pode atender várias unidades evaporadoras, modulando a vazão de refrigerante conforme a carga.', 'C',

  ce('IN45', F_IN, 'complementares', cComp, 'Nos elevadores sem casa de máquinas (MRL), a máquina de tração fica instalada na própria caixa de corrida.', 'C',

  ce('IN46', F_IN, 'complementares', cComp, 'O Decreto nº 10.306/2020 estabelece a utilização do BIM na execução direta ou indireta de obras e serviços de engenharia por órgãos e entidades da administração pública federal, de forma gradual.', 'C',

  ce('IN49', F_IN, 'orcamento', cOrcI, 'Na curva ABC de insumos ou serviços, a classe A reúne pequena quantidade de itens que respondem pela maior parcela do custo total da obra.', 'C',

  ce('IN50', F_IN, 'orcamento', cOrcI, 'Nas obras e serviços de engenharia contratados com recursos da União, o custo global de referência deve ser obtido, em regra, a partir das composições do SINAPI, ou do SICRO para obras rodoviárias.', 'C',

  ce('IN51', F_IN, 'orcamento', cOrcI, 'Na técnica PERT, o tempo esperado de uma atividade é te = (a + 4m + b)/6, em que a, m e b são as durações otimista, mais provável e pessimista.', 'C',

  ce('IN53', F_IN, 'orcamento', cOrcI, 'Qualquer atraso em atividade do caminho crítico, mantidas as demais durações, implica atraso no prazo final do empreendimento.', 'C',

  ce('IN54', F_IN, 'orcamento', cOrcI, 'O cronograma físico-financeiro relaciona a evolução física dos serviços ao desembolso em cada período; sua representação acumulada gera a chamada curva S.', 'C',

  ce('IN56', F_IN, 'orcamento', cOrcI, 'No custo horário produtivo de um equipamento, consideram-se, entre outras parcelas, depreciação, juros do capital, manutenção, materiais de operação e mão de obra de operação.', 'C',

  ce('IN58', F_IN, 'manutencao', cMan, 'Segundo a NBR 5674, a manutenção corretiva caracteriza-se por serviços que demandam ação ou intervenção imediata, a fim de permitir a continuidade do uso dos sistemas, elementos ou componentes, ou de evitar graves riscos ou prejuízos.', 'C',

  ce('IN61', F_IN, 'manutencao', cMan, 'No ensaio com fenolftaleína, a região carbonatada do concreto adquire coloração vermelho-carmim, enquanto a região não carbonatada permanece incolor.', 'E',

  ce('IN62', F_IN, 'manutencao', cMan, 'A eflorescência consiste em depósitos salinos, geralmente esbranquiçados, formados na superfície de alvenarias e concretos pela migração de sais solúveis transportados pela água.', 'C',

  ce('IN63', F_IN, 'manutencao', cMan, 'Segundo a Lei de Sitter, os custos de intervenção crescem em progressão geométrica de razão 5 conforme a fase em que a medida é tomada: projeto, execução, manutenção preventiva e manutenção corretiva.', 'C',

  ce('IN64', F_IN, 'manutencao', cMan, 'Fissuras inclinadas a aproximadamente 45° a partir dos cantos de janelas e portas em alvenarias são típicas da ausência ou insuficiência de vergas e contravergas.', 'C',

  ce('IN66', F_IN, 'manutencao', cMan, 'Concluída a impermeabilização de uma laje, deve-se realizar teste de estanqueidade com lâmina d\'água mantida por, no mínimo, 72 horas.', 'C',

  ce('IN70', F_IN, 'fiscalizacao', cFis, 'Em obras, o recebimento provisório é feito pelo responsável pelo acompanhamento e fiscalização, mediante termo detalhado, e o definitivo, por servidor ou comissão designada pela autoridade competente, após comprovação do atendimento das exigências contratuais.', 'C',

  ce('IN73', F_IN, 'fiscalizacao', cFis, 'Na contratação integrada, a administração fornece o projeto básico e o contratado elabora apenas o projeto executivo e executa a obra.', 'E',

  ce('IN74', F_IN, 'fiscalizacao', cFis, 'O estudo técnico preliminar é o documento da fase preparatória que caracteriza o interesse público envolvido e a melhor solução, servindo de base ao anteprojeto, ao termo de referência ou ao projeto básico.', 'C',

  ce('IN75', F_IN, 'fiscalizacao', cFis, 'É obrigatória a Anotação de Responsabilidade Técnica (ART) para todo contrato, escrito ou verbal, de execução de obras ou prestação de serviços de engenharia.', 'C',

  ce('IN76', F_IN, 'fiscalizacao', cFis, 'Pela NR-35, considera-se trabalho em altura toda atividade executada acima de 2,00 m do nível inferior, onde haja risco de queda.', 'C',

  ce('IN77', F_IN, 'fiscalizacao', cFis, 'Com a revisão da NR-18 de 2020, o Programa de Gerenciamento de Riscos (PGR) substituiu o PCMAT nos canteiros de obras.', 'C',

  /* ===================== TRF6 2024 (Analista Judiciário) ===================== */
  var F_BTRF6 = 'TRF6 2024 · Cebraspe · item ';
  var cBTRF6A = 'Considere o texto a seguir. [1] O Poder Judiciário brasileiro tem em torno de 80 milhões de processos judiciais. Esse número é estarrecedor quando comparado com a população do país, cuja estimativa é de 203 milhões de brasileiros. Sendo assim, para pouco mais de dois brasileiros, há um processo judicial, o que representa uma situação praticamente insustentável sob o aspecto econômico, gerencial e jurídico. [2] Já houve redução no tempo e no custo do processo judicial com a implantação do processo eletrônico, mas há muito o que fazer quando se depara com o tempo de resolutividade e os gastos para a manutenção do serviço de prestação jurisdicional: estima-se que, no ano de 2022, tenham sido gastos, só na justiça federal, R$ 12.369.100.765. Em relação ao custo processual, no ano de 2015, por exemplo, cada brasileiro desembolsou R$ 387,00 para manter o Poder Judiciário, o que equivalia a 1,3% do PIB. Se avaliarmos de 2009 a 2015, o crescimento foi de 31%. Em 2020, os gastos foram de R$ 479,16 por habitante. (Grégore Moreira de Moura. Um sonho de desjudicialização. Revista do TRF da Sexta Região, 2023, com adaptações.) Em relação às ideias e às propriedades linguísticas do texto, julgue o item a seguir.';
  var cBTRF6B = 'Considere o texto a seguir. [1] Uma curiosa característica da historiografia geral, política e social foi a relativamente pequena atenção dada à história da justiça ou, se quisermos ser mais limitados, à história do Poder Judiciário. [2] Pode-se levantar uma hipótese: a justiça foi percebida como um poder alheio àquilo que se chamou comumente política a partir do século XIX, ou seja, a luta e a disputa para ocupar posições de governo, de mando em geral e de decisão em lugar dos outros. [3] Uma segunda hipótese: os historiadores não se sentem à vontade com um campo muito específico, como são o direito e o dos juristas. O direito se constitui em esfera especial e profissional à qual se tem acesso apenas por meio de um curso universitário, enquanto a política permite acesso aos lugares de poder por meio de eleições e não exige, pois, nenhum preparo intelectual determinado. Qualquer um do povo pode ser político, mas nem todos podem ser juristas ou juízes profissionais. (José Reinaldo de Lima Lopes. História da justiça e do processo no Brasil do século XIX, 2017, com adaptações.) Julgue o item seguinte, relativo ao conteúdo do texto e a aspectos linguísticos a ele pertinentes.';
  var cBTRF6DC = 'Com base na teoria geral dos direitos fundamentais, julgue o item a seguir.';
  var cBTRF6DA = 'Considere o Regime Jurídico dos Servidores Públicos Civis da União, das Autarquias e das Fundações Públicas Federais (Lei n.º 8.112/1990), a Lei de Improbidade Administrativa (Lei n.º 8.429/1992) e a Lei do Processo Administrativo (Lei n.º 9.784/1999) e julgue o item a seguir.';
  ce('BTRF61', F_BTRF6 + '1', 'portugues', cBTRF6A, 'Haveria prejuízo da correção gramatical do texto caso se inserisse vírgula após “R$ 387,00” (segundo período do segundo parágrafo).', 'E',
    'Errado. A oração “para manter o Poder Judiciário” é adjunto adverbial de finalidade, deslocável e com autonomia, e admite pausa antes de si. A vírgula não separa verbo e complemento (o complemento “R$ 387,00” vem antes dela), então a correção gramatical é mantida.');
  ce('BTRF62', F_BTRF6 + '2', 'portugues', cBTRF6A, 'Para atingir seu propósito comunicativo, o autor constrói o texto com base nas tipologias textuais expositiva e argumentativa.', 'C',
    'Certo. O autor expõe dados (número de processos, população, gastos por habitante), o que caracteriza a sequência expositiva, e os orienta para uma avaliação (situação “praticamente insustentável”), o que é próprio da argumentação.');
  ce('BTRF63', F_BTRF6 + '3', 'portugues', cBTRF6A, 'Infere-se do texto que a implantação do processo eletrônico é ineficiente para a redução da quantidade de processos a serem resolvidos pelo Poder Judiciário.', 'E',
    'Errado. O texto afirma que já houve redução de tempo e de custo com o processo eletrônico e apenas ressalva que ainda há muito a fazer. Não classifica a medida como ineficiente nem trata da quantidade de processos como objeto dessa redução.');
  ce('BTRF64', F_BTRF6 + '4', 'portugues', cBTRF6A, 'Com o emprego do adjetivo “estarrecedor” (segundo período do primeiro parágrafo), o autor do texto expressa uma avaliação negativa em relação à quantidade de processos judiciais em tramitação no Poder Judiciário brasileiro.', 'C',
    'Certo. “Estarrecedor” é adjetivo de carga negativa (chocante, assustador) aplicado ao número de processos. A avaliação é reforçada pela expressão “praticamente insustentável” no período seguinte.');
  ce('BTRF65', F_BTRF6 + '5', 'portugues', cBTRF6A, 'No segundo período do primeiro parágrafo, a forma pronominal “cuja” é um elemento de coesão textual que tanto se refere a um antecedente quanto estabelece a conexão entre orações.', 'C',
    'Certo. “Cuja” é pronome relativo possessivo: retoma o antecedente “país” (a estimativa da população “do país”) e, ao mesmo tempo, liga a oração subordinada adjetiva à oração principal.');
  ce('BTRF66', F_BTRF6 + '6', 'portugues', cBTRF6A, 'No segmento “estima-se que, no ano de 2022, tenham sido gastos, só na justiça federal, R$ 12.369.100.765” (primeiro período do segundo parágrafo), a oração introduzida pelo termo “que” funciona como complemento direto da oração expressa pela forma verbal “estima-se”.', 'E',
    'Errado. Em “estima-se que...”, o verbo está na voz passiva sintética: o que se estima é a ideia expressa pela oração iniciada por “que”, que é o sujeito de “estima-se” (oração subordinada substantiva subjetiva), e não um complemento direto.');
  ce('BTRF68', F_BTRF6 + '8', 'portugues', cBTRF6B, 'No segundo período do terceiro parágrafo, o vocábulo “pois” está empregado com sentido conclusivo.', 'C',
    'Certo. Em “não exige, pois, nenhum preparo”, “pois” aparece deslocado, entre vírgulas, no interior da oração, e equivale a “portanto”: como a política dá acesso por eleições, conclui-se que não exige preparo determinado. Antes do verbo, sem vírgulas, seria explicativo.');
  ce('BTRF69', F_BTRF6 + '9', 'portugues', cBTRF6B, 'O texto informa que um dos fatores responsáveis pela falta de histórias da justiça é o seu distanciamento da política, tomada como espaço de luta e de disputa para “ocupar posições de governo, de mando em geral e de decisão em lugar dos outros”.', 'E',
    'Errado. O autor não apresenta isso como informação, e sim como hipótese (“Pode-se levantar uma hipótese”). O item transforma uma conjectura do texto em fato apurado.');
  ce('BTRF610', F_BTRF6 + '10', 'portugues', cBTRF6B, 'Conforme as ideias do texto, o direito e a justiça constituem campos específicos que restringem o ingresso das pessoas neles.', 'C',
    'Certo. O terceiro parágrafo descreve o direito como esfera especial e profissional, acessível apenas por curso universitário, e conclui que nem todos podem ser juristas ou juízes profissionais: o campo é específico e restringe o ingresso.');
  ce('BTRF611', F_BTRF6 + '11', 'portugues', cBTRF6B, 'Seriam mantidos os sentidos e a correção gramatical do texto se o primeiro parágrafo fosse reescrito da seguinte forma: Uma característica curiosa da historiografia geral, política e social, se quisermos ser mais limitados, foi a atenção relativamente pequena dada à história da justiça ou à história do Poder Judiciário.', 'E',
    'Errado. No original, “se quisermos ser mais limitados” restringe a expressão “história da justiça” a “história do Poder Judiciário”. Na reescrita, a ressalva passa a se ligar à “historiografia geral, política e social”, e o segmento final deixa de indicar restrição. Os sentidos mudam.');
  ce('BTRF612', F_BTRF6 + '12', 'portugues', cBTRF6B, 'A supressão do acento indicativo de crase empregado no vocábulo “à”, em “à qual” (segundo período do terceiro parágrafo), manteria a correção gramatical do texto.', 'E',
    'Errado. “Acesso” exige a preposição “a”, e o antecedente “esfera” é feminino e pede o artigo “a”, que se antepõe ao relativo “qual”. A fusão preposição + artigo exige o acento grave; sem ele, o trecho fica incorreto.');
  ce('BTRF613', F_BTRF6 + '13', 'portugues', cBTRF6B, 'O termo “àquilo” (segundo parágrafo) e o segmento “aos lugares de poder” (segundo período do terceiro parágrafo) complementam, respectivamente, o sentido de um adjetivo e de um substantivo, por isso desempenham, nas orações em que se inserem, a função sintática de complemento nominal.', 'C',
    'Certo. “Àquilo” completa o adjetivo “alheio” (alheio a algo) e “aos lugares de poder” completa o substantivo “acesso” (acesso a algo). Termos preposicionados que completam nome (adjetivo ou substantivo) são complementos nominais.');
  ce('BTRF614', F_BTRF6 + '14', 'portugues', cBTRF6B, 'No trecho “O direito se constitui em esfera especial e profissional” (segundo período do terceiro parágrafo), a colocação enclítica do pronome “se” prejudicaria a correção gramatical do texto.', 'E',
    'Errado. Com o sujeito “O direito” expresso e sem palavra atrativa antes do verbo, a próclise (“se constitui”) e a ênclise (“constitui-se”) são ambas corretas. A ênclise não prejudicaria a correção.');
  ce('BTRF632', F_BTRF6 + '32', 'constitucional', cBTRF6DC, 'Admite-se a negociação de efeitos patrimoniais, de forma temporária, dos direitos fundamentais.', 'C',
    'Certo. Os direitos fundamentais são, em regra, irrenunciáveis, mas a doutrina admite limitação voluntária, temporária e pontual de seus efeitos patrimoniais (por exemplo, a cessão onerosa de uso de imagem por prazo certo), desde que preservado o núcleo essencial e a dignidade da pessoa humana.');
  ce('BTRF633', F_BTRF6 + '33', 'constitucional', cBTRF6DC, 'Entre as características dos direitos fundamentais citam-se o seu caráter absoluto, bem como a expansividade e a universalidade.', 'E',
    'Errado. Os direitos fundamentais são relativos (limitáveis), porque podem colidir entre si e devem ser harmonizados, e não absolutos. Universalidade e expansividade (tendência de ampliação do rol) são características apontadas pela doutrina.');
  ce('BTRF615', F_BTRF6 + '15', 'administrativo', cBTRF6DA, 'A mera indicação política realizada por detentor de mandato eletivo configura ato de improbidade administrativa, independentemente da aferição de dolo com finalidade ilícita na conduta do agente.', 'E',
    'Errado. O art. 11, § 5.º, da Lei 8.429/1992 (redação da Lei 14.230/2021) diz que não se configura improbidade a mera nomeação ou indicação política por detentores de mandato eletivo, sendo necessária a aferição de dolo com finalidade ilícita por parte do agente.');
  ce('BTRF616', F_BTRF6 + '16', 'administrativo', cBTRF6DA, 'As disposições da Lei de Improbidade Administrativa são aplicáveis, no que couber, àquele que, mesmo não sendo agente público, induza ou concorra, culposa ou dolosamente, para a prática de ato de improbidade.', 'E',
    'Errado. Pelo art. 3.º da Lei 8.429/1992, o terceiro responde se induzir ou concorrer dolosamente para o ato de improbidade. Com a Lei 14.230/2021, a modalidade culposa deixou de existir na lei, e a responsabilização depende de dolo.');
  ce('BTRF617', F_BTRF6 + '17', 'administrativo', cBTRF6DA, 'É proibido ao servidor atuar, como procurador ou intermediário, junto a repartições públicas para tratar de benefícios previdenciários ou assistenciais de parentes, até o segundo grau, de cônjuge ou de companheiro.', 'E',
    'Errado. O art. 117, XI, da Lei 8.112/1990 proíbe atuar como procurador ou intermediário junto a repartições públicas, salvo quando se tratar de benefícios previdenciários ou assistenciais de parentes até o segundo grau e de cônjuge ou companheiro. Nesses casos a atuação é permitida.');
  ce('BTRF618', F_BTRF6 + '18', 'administrativo', cBTRF6DA, 'A absolvição criminal que negue a existência do fato ou sua autoria afasta a responsabilidade administrativa do servidor acusado.', 'C',
    'Certo. O art. 126 da Lei 8.112/1990 estabelece que a responsabilidade administrativa do servidor será afastada no caso de absolvição criminal que negue a existência do fato ou sua autoria. As instâncias são independentes, com essa exceção.');
  ce('BTRF621', F_BTRF6 + '21', 'administrativo', cBTRF6DA, 'Os atos do processo administrativo dependem de forma determinada somente quando a lei expressamente a exigir.', 'C',
    'Certo. É o art. 22 da Lei 9.784/1999: os atos do processo administrativo não dependem de forma determinada senão quando a lei expressamente a exigir (princípio do informalismo).');
  ce('BTRF622', F_BTRF6 + '22', 'administrativo', cBTRF6DA, 'No processo administrativo federal, a participação de servidor, bem como de seu cônjuge, companheiro ou parente até o terceiro grau, como perito enseja a arguição da sua suspeição.', 'E',
    'Errado. Ter participado ou vir a participar como perito, testemunha ou representante, ou haver essa situação com cônjuge, companheiro ou parente até o terceiro grau, é hipótese de impedimento (art. 18, II, da Lei 9.784/1999), e não de suspeição. A suspeição (art. 20) decorre de amizade íntima ou inimizade notória.');

  /* ===================== TCE-AC 2024 (Analista Administrativo) ===================== */
  var F_BTCEAC = 'TCE-AC 2024 (Analista) · Cebraspe · item ';
  var cBTCEACP = 'Considere o texto a seguir. [1] O setor público enfrenta o desafio particular de oferecer serviços públicos cada vez melhores a uma população gradualmente mais bem informada, mais consciente de seus direitos e com expectativas crescentes quanto ao papel do Estado. Devido aos recursos limitados, desenvolver serviços públicos inovadores tem sido visto crescentemente como fator fundamental para sustentar um alto nível de serviços para cidadãos e negócios, bem como para enfrentar desafios sociais e aprimorar o bem-estar social da população. [2] Diante desse cenário, o discurso científico sobre inovação em compras públicas ganhou maior atenção nas últimas décadas. A União Europeia reconheceu as compras públicas como instrumento de inovação e de provimento de mercados pioneiros para novos produtos, definindo-as como compras de bens e serviços que ainda não existem, que precisam ser aperfeiçoados ou que requerem pesquisa e inovação para atender às necessidades especificadas pelos usuários. [3] As compras públicas representam grande parte da execução da despesa pública. Entre países da Organização para a Cooperação e Desenvolvimento Econômico (OCDE), a média de gastos públicos representa 12% do GDP (equivalente ao PIB) por ano. No Brasil, anualmente o governo federal gasta, em média, 5% do PIB em compras apenas de bens e serviços. Quando se incluem nos cálculos as despesas efetuadas por estados, municípios e estatais, o percentual chega próximo a 15% do PIB, ou R$ 900 bilhões. (Internet: www.realp.unb.br, com adaptações.) Considerando as ideias e os aspectos linguísticos do texto, julgue o item a seguir.';
  var cBTCEACI = 'Read the text below. [1] Responsible state fiscal policy requires more than just balancing the current year’s budget. It must also include ensuring that the budget is on a sustainable path. Otherwise, policymakers cannot have the lasting impact they hope for. This risk is especially high in the aftermath of the COVID-19 pandemic. Record budget surpluses, driven largely by federal pandemic aid, empowered states to adopt historically large tax cuts and spending increases from 2021 to 2023. [2] State leaders must be able to assess whether their decisions will be affordable over the long term or will jeopardize their ability to solve state problems or even sustain programs and services in the future. Unfortunately, the nature of state budget processes discourages such long-term thinking. State policymakers devote much of their time to developing, enacting, and implementing annual or biennial budgets, a prime opportunity to achieve immediate policy goals. [3] One key strategy for changing this short-term focus is for states to use long-term budget assessments and budget stress tests to regularly measure risks, anticipate potential shortfalls, and identify ways to address impending challenges. Long-term budget assessments project revenue and spending several years into the future, and stress tests estimate the size of temporary budget shortfalls that would result from recessions or other economic events and gauge whether states are prepared for these events. (Internet: pewtrusts.org, adapted.) Considering the ideas conveyed in the text, as well as its linguistic aspects, judge the following item.';
  var cBTCEACC = 'A respeito da Constituição Federal de 1988 (CF), julgue o item a seguir.';
  var cBTCEACA = 'Acerca de noções de direito administrativo, julgue o item a seguir.';
  var cBTCEACTI = 'Acerca de procedimentos de backup, noções do sistema operacional Windows 10, noções de vírus, worms e pragas virtuais e programas e recursos da Microsoft, julgue o item a seguir.';
  ce('BTCEAC1', F_BTCEAC + '1', 'portugues', cBTCEACP, 'O emprego do sinal indicativo de crase no vocábulo “a” presente no primeiro período do texto prejudicaria a sua correção gramatical.', 'C',
    'Certo. O “a” do primeiro período é a preposição que antecede “uma população” (“oferecer serviços... a uma população”). Antes de artigo indefinido não ocorre crase, então o acento seria erro.');
  ce('BTCEAC2', F_BTCEAC + '2', 'portugues', cBTCEACP, 'De acordo com o texto, o acesso à informação pela população, o aumento da consciência sobre seus direitos e a expectativa crescente com relação ao papel do Estado têm sido importantes entraves para o oferecimento de serviços públicos de qualidade.', 'E',
    'Errado. O texto apresenta a população mais informada e exigente como o contexto que eleva o desafio de oferecer serviços melhores, não como entrave. A dificuldade que o texto aponta vem dos recursos limitados.');
  ce('BTCEAC3', F_BTCEAC + '3', 'portugues', cBTCEACP, 'Entende-se da leitura do texto que o desenvolvimento de serviços públicos inovadores é considerado essencial para o enfrentamento de desafios sociais e o aprimoramento do bem-estar social da população.', 'C',
    'Certo. O primeiro parágrafo diz que desenvolver serviços públicos inovadores é visto como fator fundamental para sustentar o nível dos serviços, enfrentar desafios sociais e aprimorar o bem-estar da população.');
  ce('BTCEAC4', F_BTCEAC + '4', 'portugues', cBTCEACP, 'Segundo as informações do texto, a média de gastos anual nas diferentes esferas de governo no Brasil é maior que a média de gastos públicos por ano que se verifica em países da OCDE.', 'C',
    'Certo. A média dos países da OCDE é de 12% do PIB. No Brasil, somadas as despesas da União, dos estados, dos municípios e das estatais, o percentual chega a cerca de 15% do PIB, portanto acima da média da OCDE.');
  ce('BTCEAC5', F_BTCEAC + '5', 'portugues', cBTCEACP, 'Depreende-se do texto que, nos países da União Europeia, a inovação é fortemente influenciada pelas compras públicas.', 'E',
    'Errado. O texto diz apenas que a União Europeia reconheceu as compras públicas como instrumento de inovação e as definiu em certos termos. Não afirma que a inovação nesses países seja fortemente influenciada por elas: a ideia foi extrapolada.');
  ce('BTCEAC6', F_BTCEAC + '6', 'portugues', cBTCEACP, 'O trecho “A União Europeia reconheceu as compras públicas como instrumento de inovação e de provimento de mercados pioneiros para novos produtos” (segundo período do segundo parágrafo) poderia ser reescrito, mantendo-se a correção e os sentidos do texto, da seguinte forma: A União Europeia concebe as compras públicas como forma de inovar e de provir mercados pioneiros para novos produtos.', 'E',
    'Errado. “Provir” significa originar-se, proceder, e não equivale a “prover” (fornecer, dotar), que é a base de “provimento”. A troca compromete o sentido. Além disso, “reconheceu” (pretérito) e “concebe” (presente) não são equivalentes.');
  ce('BTCEAC7', F_BTCEAC + '7', 'portugues', cBTCEACP, 'A forma verbal “requerem” (segundo período do segundo parágrafo) está empregada no texto com o sentido de demandam, necessitam de.', 'C',
    'Certo. Em “que requerem pesquisa e inovação para atender às necessidades”, o verbo “requerer” significa exigir, demandar, necessitar de, e pode ser substituído por esses termos sem alterar o sentido.');
  ce('BTCEAC8', F_BTCEAC + '8', 'portugues', cBTCEACP, 'A correção gramatical e os sentidos do texto seriam mantidos caso se substituísse a forma verbal “incluem” (último período do terceiro parágrafo) por considera.', 'E',
    'Errado. “Incluem” concorda com o sujeito plural “as despesas efetuadas por estados, municípios e estatais” (voz passiva sintética: “se incluem as despesas”). “Considera” está no singular e quebra a concordância verbal.');
  ce('BTCEAC9', F_BTCEAC + '9', 'ingles', cBTCEACI, 'The author believes the risk of a fiscal policy not having its expected long-term impacts is increased in the years following the COVID-19 pandemic.', 'C',
    'Certo. O texto diz que, sem um orçamento em trajetória sustentável, os formuladores de política não terão o impacto duradouro esperado e acrescenta: “This risk is especially high in the aftermath of the COVID-19 pandemic”. O risco aumenta nos anos seguintes à pandemia.');
  ce('BTCEAC10', F_BTCEAC + '10', 'ingles', cBTCEACI, 'The word “gauge”, in the last sentence of the text, has a similar meaning as the one of estimate.', 'C',
    'Certo. No texto, “gauge whether states are prepared” significa avaliar, medir, estimar se os estados estão preparados. “Gauge” e “estimate” são próximos nesse contexto.');
  ce('BTCEAC11', F_BTCEAC + '11', 'ingles', cBTCEACI, 'It is correct to conclude from the text that long-term budget assessments and stress tests are two crucial tools for states that seek to establish more than a short-term approach to their budgets.', 'C',
    'Certo. O terceiro parágrafo apresenta as avaliações orçamentárias de longo prazo e os testes de estresse como “key strategy” para mudar o foco de curto prazo, o que sustenta a conclusão do item.');
  ce('BTCEAC12', F_BTCEAC + '12', 'ingles', cBTCEACI, 'In the first sentence of the second paragraph, the word “jeopardize” is being used with a similar meaning as the one of enhance.', 'E',
    'Errado. “Jeopardize” significa pôr em risco, comprometer. “Enhance” significa melhorar, ampliar: sentido oposto.');
  ce('BTCEAC29', F_BTCEAC + '29', 'constitucional', cBTCEACC, 'Quanto à origem, a Constituição Federal de 1988 é considerada uma constituição outorgada, uma vez que o povo não participou de sua elaboração, senão mediante representantes eleitos.', 'E',
    'Errado. Constituição outorgada é a imposta sem participação popular. A CF/1988 é promulgada (democrática), elaborada por uma Assembleia Nacional Constituinte formada por representantes eleitos pelo povo.');
  ce('BTCEAC30', F_BTCEAC + '30', 'constitucional', cBTCEACC, 'Quanto à estabilidade, a Constituição Federal de 1988 é classificada como semirrígida, na medida em que admite modificações, desde que observado procedimento legislativo especial e desde que as alterações não tenham por objeto cláusula pétrea.', 'E',
    'Errado. A CF/1988 é rígida: só se altera por procedimento mais solene que o das leis ordinárias (art. 60: três quintos, em dois turnos, em cada Casa) e tem limites materiais (cláusulas pétreas). Semirrígida é a que tem parte rígida e parte flexível.');
  ce('BTCEAC31', F_BTCEAC + '31', 'constitucional', cBTCEACC, 'É incompatível com a Constituição Federal de 1988 a ideia de um direito ao esquecimento, assim entendido como o poder de obstar, em razão da passagem do tempo, a divulgação de fatos ou dados verídicos e licitamente obtidos e publicados em meios de comunicação social analógicos ou digitais.', 'C',
    'Certo. No Tema 786 de repercussão geral (RE 1.010.606), o STF fixou que é incompatível com a Constituição a ideia de um direito ao esquecimento com esse alcance. Eventuais excessos ou abusos são examinados caso a caso, à luz da liberdade de expressão e dos direitos da personalidade.');
  ce('BTCEAC32', F_BTCEAC + '32', 'constitucional', cBTCEACC, 'O rol de direitos e garantias fundamentais constitucionais é exemplificativo.', 'C',
    'Certo. O art. 5.º, § 2.º, da CF diz que os direitos e garantias nela expressos não excluem outros decorrentes do regime e dos princípios adotados ou de tratados internacionais de que o Brasil seja parte. Por isso o rol é aberto, exemplificativo.');
  ce('BTCEAC33', F_BTCEAC + '33', 'administrativo', cBTCEACA, 'Pelo princípio da autotutela, a administração pública pode rever seus atos de ofício quanto à atuação administrativa, considerando aspectos de legalidade e de mérito.', 'C',
    'Certo. Pela autotutela, a Administração controla seus próprios atos: anula os ilegais e revoga os inconvenientes ou inoportunos (mérito), de ofício (Súmula 473 do STF e art. 53 da Lei 9.784/1999).');
  ce('BTCEAC34', F_BTCEAC + '34', 'administrativo', cBTCEACA, 'A permissão e a autorização são atos administrativos discricionários e precários que permitem que o particular utilize privativamente bem público.', 'C',
    'Certo. A autorização e a permissão de uso de bem público são atos unilaterais, discricionários e precários: a Administração pode revogá-los por conveniência e oportunidade, em regra sem indenização, e consentem ao particular o uso privativo do bem.');
  ce('BTCEAC35', F_BTCEAC + '35', 'administrativo', cBTCEACA, 'Os princípios da motivação e do interesse público, por serem princípios implícitos da administração pública, não estão expressamente previstos na lei que regula o processo administrativo no âmbito da administração pública federal.', 'E',
    'Errado. O art. 2.º da Lei 9.784/1999 menciona expressamente, entre outros, os princípios da legalidade, finalidade, motivação, razoabilidade, proporcionalidade, moralidade, ampla defesa, contraditório, segurança jurídica, interesse público e eficiência.');
  ce('BTCEAC36', F_BTCEAC + '36', 'administrativo', cBTCEACA, 'É vedada a forma eletrônica de celebração de contrato administrativo decorrente de processo licitatório.', 'E',
    'Errado. A Lei 14.133/2021, no art. 91, § 3.º, admite a celebração de contratos e termos aditivos na forma eletrônica, atendidas as exigências previstas em regulamento. Não há vedação.');
  ce('BTCEAC45', F_BTCEAC + '45', 'ti', cBTCEACTI, 'No tipo de ataque denominado sniffing, o invasor usa um computador infectado para retirar de operação um serviço ou uma rede.', 'E',
    'Errado. Sniffing é a captura e a análise do tráfego da rede (farejamento de pacotes) para obter informações. Tirar um serviço ou uma rede de operação é negação de serviço (DoS/DDoS).');
  ce('BTCEAC46', F_BTCEAC + '46', 'ti', cBTCEACTI, 'No Windows 10, por meio da opção Atualização e Segurança, é possível realizar a atualização do sistema operacional, recuperação e backup.', 'C',
    'Certo. Em Configurações do Windows 10, “Atualização e Segurança” reúne o Windows Update, a Segurança do Windows, o Backup e a Recuperação do sistema.');
  ce('BTCEAC47', F_BTCEAC + '47', 'ti', cBTCEACTI, 'A versão online do Microsoft Word permite a edição de um documento de texto no navegador, oferecendo ao usuário todas as mesmas funcionalidades da versão instalável desse programa.', 'E',
    'Errado. O Word online edita documentos no navegador, mas tem funcionalidades reduzidas em relação à versão instalada (menos recursos de formatação, de referências, de revisão e de macros).');
  ce('BTCEAC49', F_BTCEAC + '49', 'ti', cBTCEACTI, 'O histórico do navegador Microsoft Edge apresenta os sites visitados pelo usuário.', 'C',
    'Certo. O Histórico do Edge lista as páginas visitadas, com data e hora, e permite reabri-las ou apagá-las.');
  ce('BTCEAC50', F_BTCEAC + '50', 'ti', cBTCEACTI, 'No Microsoft Excel, a função PROCV permite procurar itens em uma tabela ou um intervalo por linha.', 'C',
    'Certo. A função PROCV (VLOOKUP) procura um valor na primeira coluna de uma tabela ou intervalo e retorna o valor de outra coluna da mesma linha, isto é, localiza itens por linha.');

  /* ===================== TCE-AC 2024 (Auditor de Controle Externo) ===================== */
  var F_BTCEACA = 'TCE-AC 2024 (Auditor) · Cebraspe · item ';
  var cBTCEAAP = 'Considere o texto a seguir. [1] A ideia de que a mente pertence a um domínio separado, distinto do corpo, foi teorizada bem cedo, em grandes textos como o Fédon, de Platão (IV a.C.) e a Suma teológica, de Tomás de Aquino (1265-1274), um texto fundador da concepção cristã da alma. Mas foi o filósofo francês René Descartes (1596-1650) quem estabeleceu aquilo que é hoje conhecido como dualismo: a tese de que a mente dotada de consciência é feita de uma substância imaterial que não está sujeita às leis da física. [2] Ridicularizar Descartes tornou-se moda em neurociência. Depois da publicação, em 1994, de O erro de Descartes, o best-seller de Antonio Damasio, muitos manuais contemporâneos que tratam de consciência passaram a criticar Descartes, alegando que ele teria atrasado a pesquisa em neurociência. A verdade, porém, é que Descartes foi um cientista pioneiro, fundamentalmente um reducionista, cuja análise mecânica da mente humana, muito à frente de seu tempo, foi o primeiro exercício de biologia sintética e de modelagem teórica. O dualismo de Descartes não foi um capricho de momento — fundamentava-se em um argumento lógico que afirmava a impossibilidade, para qualquer máquina, de imitar a liberdade da mente consciente. (Stanislas Dehaene. É assim que pensamos. Trad.: Rodolfo Ilari. São Paulo: Contexto, 2024, p. 12, com adaptações.) Em relação às ideias e às estruturas linguísticas do texto, julgue o item a seguir.';
  var cBTCEAAI = 'Read the text below. [1] Iowa, a small midwestern state, finds itself in the national economic spotlight. For conservative commentators, Iowa has emerged as America’s tax-cutting champion, a paragon of fiscal responsibility. To critics it looks more like an example of economic recklessness. [2] Either way, Iowa is playing an outsized role in a bigger debate about how American states ought to manage their revenues and spending. Until a few years ago it had one of the highest income-tax rates in America. By 2026 it will be down to a flat tax of 3.9%. Iowa is far from alone. Some 25 states have cut individual income taxes over the past years. A handful, including Georgia and Idaho, are shifting to a flat tax. And a few others want to eliminate their income taxes altogether. [3] Virtually all states, regardless of political make-up, have lowered their citizens’ tax bills since 2021. Overall, this has been a rough decline in states’ tax revenues during this time, the steepest such reduction in at least four decades. But the most aggressive moves have been cuts to income taxes, and Iowa has been at the forefront of these efforts. (The Economist. A tax-cutting wave is sweeping over America’s states, adapted.) Based on the ideas of the text and on its linguistic aspects, judge the following item.';
  var cBTCEAAC = 'A respeito da administração pública e da organização do Estado, julgue o item a seguir.';
  var cBTCEAAD = 'No que se refere a direito administrativo, julgue o item a seguir.';
  var cBTCEAATI = 'Com relação ao Windows e a ferramentas de edição de textos, apresentações e navegação, julgue o item a seguir.';
  ce('BTCEACA1', F_BTCEACA + '1', 'portugues', cBTCEAAP, 'No primeiro período do segundo parágrafo, a oração “Ridicularizar Descartes” funciona como complemento da forma verbal “tornou-se”.', 'E',
    'Errado. “Tornar-se” é verbo de ligação aqui, e “moda em neurociência” é o predicativo. “Ridicularizar Descartes” é o sujeito da oração (oração subordinada substantiva subjetiva reduzida de infinitivo), não complemento.');
  ce('BTCEACA2', F_BTCEACA + '2', 'portugues', cBTCEAAP, 'Conclui-se da leitura do texto que seu autor tem uma visão negativa do trabalho de Descartes, o que se comprova pelo emprego, no terceiro período do segundo parágrafo, do adjetivo “reducionista” e da expressão “análise mecânica da mente humana”.', 'E',
    'Errado. O autor defende Descartes: “A verdade, porém, é que Descartes foi um cientista pioneiro”, com análise “muito à frente de seu tempo”. “Reducionista” e “análise mecânica” descrevem o método e fazem parte desse elogio; as críticas citadas são de outros autores.');
  ce('BTCEACA3', F_BTCEACA + '3', 'portugues', cBTCEAAP, 'Conforme as ideias do texto, a distinção entre mente e corpo como objetos de estudo já era conhecida desde a Antiguidade, mas apenas com René Descartes essa distinção foi teorizada e difundida.', 'E',
    'Errado. O texto afirma que a ideia de mente separada do corpo foi “teorizada bem cedo”, em Platão e em Tomás de Aquino. Descartes a estabeleceu como dualismo, mas não foi o primeiro a teorizá-la.');
  ce('BTCEACA4', F_BTCEACA + '4', 'portugues', cBTCEAAP, 'O último período do texto é construído com base na tipologia argumentativa.', 'C',
    'Certo. O último período defende uma tese (o dualismo de Descartes não foi capricho) e a sustenta com um argumento lógico: é construção argumentativa, e não narrativa ou descritiva.');
  ce('BTCEACA5', F_BTCEACA + '5', 'portugues', cBTCEAAP, 'No segundo período do primeiro parágrafo, os dois pontos são empregados para introduzir uma explicação.', 'C',
    'Certo. Depois de “dualismo”, os dois pontos introduzem a explicação do termo: “a tese de que a mente dotada de consciência é feita de uma substância imaterial”.');
  ce('BTCEACA6', F_BTCEACA + '6', 'portugues', cBTCEAAP, 'A supressão do acento indicativo de crase em “às leis da física” (segundo período do primeiro parágrafo) prejudicaria a correção gramatical do texto.', 'C',
    'Certo. “Sujeita” rege a preposição “a” e o termo regido é feminino plural determinado (“as leis”). A fusão preposição + artigo exige o acento grave; sem ele, o trecho fica incorreto.');
  ce('BTCEACA7', F_BTCEACA + '7', 'portugues', cBTCEAAP, 'Caso se suprimisse a vírgula logo após a palavra “pioneiro” (terceiro período do segundo parágrafo), não haveria prejuízo da correção gramatical nem da coerência textual, embora o sentido original do texto fosse alterado.', 'E',
    'Errado. A vírgula depois de “pioneiro” abre o segmento intercalado “fundamentalmente um reducionista”, fechado pela vírgula seguinte. Suprimir só a primeira deixa a intercalação mal delimitada e prejudica a correção gramatical; o item afirma que não haveria prejuízo.');
  ce('BTCEACA8', F_BTCEACA + '8', 'ingles', cBTCEAAI, 'Even though both forms are used to indicate an action in the past, replacing “have lowered” (first sentence of the third paragraph) with lowered would make the sentence grammatically wrong.', 'C',
    'Certo. “Since 2021” marca o ponto de partida de uma situação que chega ao presente, o que pede o present perfect (“have lowered”). Com “since”, o simple past (“lowered”) nessa estrutura é incorreto.');
  ce('BTCEACA9', F_BTCEACA + '9', 'ingles', cBTCEAAI, 'According to the text, the tax policy of the state of Iowa is seen by some as being too heavy on taxpayers.', 'E',
    'Errado. Iowa é vista por comentaristas conservadores como campeã de corte de impostos e, pelos críticos, como exemplo de imprudência econômica por causa desses cortes. Ninguém a vê, no texto, como pesada para os contribuintes.');
  ce('BTCEACA10', F_BTCEACA + '10', 'ingles', cBTCEAAI, 'The word “Some” (fifth sentence of the second paragraph) indicates that the author is providing an approximate number of states that have cut individual income taxes.', 'C',
    'Certo. Antes de numeral, “some” indica quantidade aproximada: “Some 25 states” significa “cerca de 25 estados”.');
  ce('BTCEACA11', F_BTCEACA + '11', 'ingles', cBTCEAAI, 'Iowa is going to cut down its taxes by a rate of 3.9% in the next two years.', 'E',
    'Errado. O texto diz que, até 2026, Iowa terá um imposto de renda de alíquota única (“flat tax”) de 3,9%. O 3,9% é a alíquota final, e não a taxa de redução.');
  ce('BTCEACA28', F_BTCEACA + '28', 'constitucional', cBTCEAAC, 'A Constituição Federal de 1988 permite que os estados instituam, mediante lei complementar, regiões metropolitanas, aglomerações urbanas e microrregiões, constituídas por agrupamentos de municípios limítrofes, para integrar a organização, o planejamento e a execução de funções públicas de interesse comum.', 'C',
    'Certo. É a redação do art. 25, § 3.º, da CF: os estados podem, mediante lei complementar, instituir regiões metropolitanas, aglomerações urbanas e microrregiões de municípios limítrofes para integrar a organização, o planejamento e a execução de funções públicas de interesse comum.');
  ce('BTCEACA29', F_BTCEACA + '29', 'constitucional', cBTCEAAC, 'A Constituição Federal de 1988 determina que o período para a criação, a fusão e o desmembramento de municípios seja estabelecido em lei complementar estadual.', 'E',
    'Errado. Pelo art. 18, § 4.º, da CF, a criação, a incorporação, a fusão e o desmembramento de municípios fazem-se por lei estadual, dentro do período determinado por lei complementar federal, e dependem de consulta prévia às populações envolvidas. A lei complementar é federal, não estadual.');
  ce('BTCEACA30', F_BTCEACA + '30', 'constitucional', cBTCEAAC, 'A proibição constitucional à nomeação de cônjuge, companheiro ou parente, em linha reta, colateral ou por afinidade, até o terceiro grau, inclusive da autoridade nomeante ou de servidor da mesma pessoa jurídica, investido em cargo de direção, chefia ou assessoramento, para o exercício de cargo em comissão ou de confiança, não se estende aos casos em que haja vínculos cruzados entre nomeados e nomeantes, prática denominada nepotismo cruzado, conforme o entendimento do Supremo Tribunal Federal.', 'E',
    'Errado. A Súmula Vinculante 13 do STF alcança também o chamado nepotismo cruzado, isto é, a nomeação mediante designações recíprocas, e proíbe nomear familiar da autoridade nomeante ou de servidor da mesma pessoa jurídica que ocupe cargo de direção, chefia ou assessoramento. A vedação se estende a essa prática.');
  ce('BTCEACA31', F_BTCEACA + '31', 'constitucional', cBTCEAAC, 'De acordo com o entendimento do Supremo Tribunal Federal, a contratação por tempo determinado, para atendimento de necessidade temporária de excepcional interesse público, realizada em desconformidade com os preceitos constitucionais não gera quaisquer efeitos jurídicos válidos em relação aos servidores contratados, com exceção do direito à percepção dos salários referentes ao período trabalhado e ao levantamento dos depósitos efetuados no Fundo de Garantia do Tempo de Serviço (FGTS).', 'C',
    'Certo. No RE 705.140 (Tema 916), o STF fixou que a contratação temporária irregular (art. 37, IX, da CF) não gera efeitos jurídicos válidos, ressalvados o direito aos salários do período trabalhado e ao levantamento do FGTS.');
  ce('BTCEACA32', F_BTCEACA + '32', 'administrativo', cBTCEAAD, 'O exercício do poder de polícia pelo Estado pode ocorrer pela edição de atos normativos, com conteúdo genérico, abstrato e impessoal, e pela criação de atos concretos.', 'C',
    'Certo. O poder de polícia se manifesta por atos normativos (leis e regulamentos, de conteúdo geral e abstrato) e por atos administrativos concretos (autorizações, licenças, fiscalização, multas e interdições).');
  ce('BTCEACA33', F_BTCEACA + '33', 'administrativo', cBTCEAAD, 'Os serviços públicos uti universi são os prestados à coletividade e usufruídos diretamente por cada indivíduo da sociedade.', 'E',
    'Errado. Os serviços uti universi (gerais) são indivisíveis, prestados à coletividade sem que se possa medir o uso de cada pessoa, como a iluminação pública. Os usufruídos individual e diretamente, com uso mensurável, são os uti singuli.');
  ce('BTCEACA35', F_BTCEACA + '35', 'administrativo', cBTCEAAD, 'Em se tratando de responsabilidade civil do Estado, conforme a teoria do risco administrativo, a responsabilidade independe do nexo causal e ocorrerá ainda que a culpa seja da própria vítima.', 'E',
    'Errado. No risco administrativo (art. 37, § 6.º, da CF) a responsabilidade é objetiva, sem necessidade de provar culpa, mas exige nexo causal entre a conduta estatal e o dano e admite excludentes, como a culpa exclusiva da vítima, o caso fortuito e a força maior.');
  ce('BTCEACA46', F_BTCEACA + '46', 'ti', cBTCEAATI, 'No menu de segurança do Windows 10, é possível visualizar a que rede o computador está conectado por meio da opção Firewall e proteção de rede.', 'C',
    'Certo. Em Segurança do Windows, a área “Firewall e proteção de rede” mostra as redes (de domínio, privada e pública) e indica a rede ativa à qual o computador está conectado.');
  ce('BTCEACA47', F_BTCEACA + '47', 'ti', cBTCEAATI, 'No navegador Microsoft Edge, é possível gravar o endereço de um sítio visitado para futura consulta na opção Histórico.', 'E',
    'Errado. O Histórico apenas registra as páginas visitadas. Para guardar o endereço de um sítio para consulta futura usa-se Favoritos (ou Coleções).');
  ce('BTCEACA48', F_BTCEACA + '48', 'ti', cBTCEAATI, 'Na opção de configuração do Windows 10, é possível ajustar a pesquisa de arquivos nos modos clássico e avançado: no primeiro, a pesquisa é feita de forma personalizada nas bibliotecas e área de trabalho; no segundo, é possível pesquisar o computador inteiro.', 'C',
    'Certo. Em Configurações, na opção de pesquisa do Windows, o modo Clássico indexa as bibliotecas e a área de trabalho, e o modo Avançado indexa todo o computador.');
  ce('BTCEACA49', F_BTCEACA + '49', 'ti', cBTCEAATI, 'No Microsoft Office 365, a opção de Layout da Página do Word permite configurar a página de um documento, podendo-se, por exemplo, alterar a orientação da página para modo retrato ou paisagem.', 'C',
    'Certo. A guia Layout do Word reúne a configuração de página (margens, orientação retrato ou paisagem, tamanho do papel, colunas e quebras).');
  ce('BTCEACA50', F_BTCEACA + '50', 'ti', cBTCEAATI, 'No PowerPoint do Office 365, os modos de exibição de slide mestre, folheto mestre e anotações mestre permitem configurar as formas de transição e animação dos slides.', 'E',
    'Errado. Slide mestre, folheto mestre e anotações mestre servem para definir o layout, a formatação e os elementos padrão de slides, folhetos e anotações. As transições e animações são configuradas nas guias Transições e Animações.');

  /* ===================== MPGO 2024 (Analista) ===================== */
  var F_BMPGO = 'MPGO 2024 · Cebraspe · item ';
  var cBMPGOP = 'Considere o texto a seguir. [1] Quando se fala que o surgimento da escrita não foi apenas a aquisição de mais um modo de expressão, mas também uma revolução, é porque ela mudou toda uma forma de organizar os pensamentos. Na cultura oral, a memória é que determina o conhecimento, portanto só sabemos o que podemos recordar, como pontuou o filósofo e historiador cultural Walter Ong. Dessa forma, o pensamento foi moldado a partir da repetição oral, dos padrões rítmicos ou de alguma forma mnemônica, e de um ritmo mais lento na evolução dos acontecimentos. [2] Quando o suporte sai do corpo da pessoa e vai para a argila, a cerâmica, a pedra, mais tarde para o pergaminho e o papel — suportes que criam a possibilidade de a pessoa retomar a leitura para relembrar ou refletir sobre um acontecimento —, a própria elaboração do pensamento e a transmissão do conhecimento são afetadas. Para além disso, sendo a leitura em suporte escrito uma atividade individualizada, solitária na maioria das vezes, ela modifica a relação de comunicação que se tinha antes na cultura oral, na qual há unidade entre quem fala e quem ouve. [3] O resultado disso teria sido tão impactante que Ong classifica a escrita como uma tecnologia ainda mais extrema que a impressão e os computadores, por exemplo. “A escrita, a impressão e os computadores são todos meios de tecnologizar a palavra. A escrita é, de certo modo, a mais drástica das três tecnologias. Ela iniciou o que a impressão e os computadores apenas continuam, a redução do som dinâmico a um espaço mudo, o afastamento da palavra em relação ao presente vivo, único lugar em que as palavras faladas podem existir. Ao contrário da linguagem natural, oral, a escrita é inteiramente artificial”, escreveu ele. (Renata Penzani. Por que a escrita é a grande revolução da humanidade? Internet: www.companhiadasletras.com.br, com adaptações.) Julgue o item seguinte, relativo aos sentidos e a aspectos linguísticos do texto.';
  var cBMPGOC = 'A respeito dos princípios fundamentais, da organização político-administrativa do Estado brasileiro, das atribuições do presidente da República e dos direitos e deveres individuais e coletivos previstos na Constituição Federal de 1988 (CF), julgue o item a seguir.';
  var cBMPGOIMP = 'De acordo com as disposições da Lei n.º 8.429/1992 no que se refere aos atos de improbidade administrativa, julgue o item a seguir.';
  var cBMPGOD = 'A respeito da organização e dos princípios da administração pública, do Regime Jurídico dos Servidores Públicos Civis da União (Lei n.º 8.112/1990), do uso dos poderes administrativos e dos contratos administrativos, julgue o item a seguir.';
  var cBMPGOLAI = 'Com base na Lei de Acesso à Informação (Lei n.º 12.527/2011), julgue o item que se segue.';
  var cBMPGOTI = 'Julgue o item a seguir, relativo a noções de informática.';
  ce('BMPGO1', F_BMPGO + '1', 'portugues', cBMPGOP, 'Os sentidos e a correção gramatical do texto estariam preservados caso o trecho “o surgimento da escrita não foi apenas a aquisição de mais um modo de expressão, mas também uma revolução” (primeiro período do primeiro parágrafo) fosse assim reescrito: o surgimento da escrita não foi a aquisição de mais um modo de expressão, mas sim uma revolução.', 'E',
    'Errado. No original, a correlação “não apenas... mas também” soma duas ideias: a escrita foi aquisição de um modo de expressão e também uma revolução. Na reescrita, “não foi... mas sim” nega a primeira e afirma só a segunda. O sentido muda.');
  ce('BMPGO2', F_BMPGO + '2', 'portugues', cBMPGOP, 'O vocábulo “mnemônica” (último período do primeiro parágrafo) está empregado no sentido de prolongada.', 'E',
    'Errado. “Mnemônico” é o que se relaciona à memória ou ajuda a memorizar. No texto, “alguma forma mnemônica” liga-se à cultura oral, em que a memória determina o conhecimento. Não tem o sentido de “prolongada”.');
  ce('BMPGO3', F_BMPGO + '3', 'portugues', cBMPGOP, 'Infere-se do texto que o surgimento da escrita não apenas acelerou o processo de evolução do conhecimento, como também possibilitou o desenvolvimento de um pensamento mais analítico, tendo alterado o próprio processo de comunicação.', 'C',
    'Certo. O texto contrapõe o ritmo “mais lento” da cultura oral ao efeito da escrita, que permite retomar a leitura para refletir e que modifica a elaboração do pensamento e a relação de comunicação. A inferência é compatível com essas ideias.');
  ce('BMPGO4', F_BMPGO + '4', 'portugues', cBMPGOP, 'Não haveria prejuízo da correção gramatical e da coerência do texto caso se substituísse “sendo” (segundo período do segundo parágrafo) por por ser.', 'C',
    'Certo. “Sendo a leitura... uma atividade individualizada” é oração reduzida de gerúndio com valor causal. “Por ser”, preposição + infinitivo, mantém a causa e a correção.');
  ce('BMPGO5', F_BMPGO + '5', 'portugues', cBMPGOP, 'A correção gramatical e os sentidos do texto seriam preservados caso o trecho “que a impressão e os computadores” (primeiro período do terceiro parágrafo) fosse reescrito como da impressão e dos computadores.', 'E',
    'Errado. Em “mais extrema que a impressão e os computadores”, “que” é o conectivo do comparativo. Trocá-lo por “da impressão e dos computadores” deixa “mais extrema da...” sem o conectivo comparativo adequado e compromete a correção gramatical.');
  ce('BMPGO6', F_BMPGO + '6', 'portugues', cBMPGOP, 'No primeiro período do segundo parágrafo, seriam preservadas a correção gramatical e a coerência das ideias do texto caso o trecho “suportes que criam a possibilidade de a pessoa retomar a leitura para relembrar ou refletir sobre um acontecimento” fosse isolado por vírgulas em vez dos travessões.', 'C',
    'Certo. O trecho é um aposto explicativo intercalado, que pode ser isolado por travessões, vírgulas ou parênteses sem alterar a correção nem o sentido.');
  ce('BMPGO7', F_BMPGO + '7', 'portugues', cBMPGOP, 'No primeiro período do primeiro parágrafo, o segmento “mas também” correlaciona ideias que se opõem, visto que o vocábulo “mas” veicula noção de oposição.', 'E',
    'Errado. Em “não foi apenas... mas também...”, “mas também” compõe a correlação aditiva “não apenas... mas também”: acrescenta uma ideia à outra. Não há oposição entre as ideias.');
  ce('BMPGO8', F_BMPGO + '8', 'portugues', cBMPGOP, 'No primeiro período do segundo parágrafo, a flexão do vocábulo “afetadas” no feminino plural justifica-se por sua concordância com os termos “elaboração” e “transmissão”.', 'C',
    'Certo. “Afetadas” é o particípio da locução passiva “são afetadas” e concorda com o sujeito composto “a própria elaboração do pensamento e a transmissão do conhecimento”. Os núcleos “elaboração” e “transmissão” são femininos, então o particípio vai ao feminino plural.');
  ce('BMPGO9', F_BMPGO + '9', 'portugues', cBMPGOP, 'No trecho “único lugar em que as palavras faladas podem existir” (penúltimo período do terceiro parágrafo), a substituição de “em que” por onde não prejudicaria a correção gramatical do texto.', 'C',
    'Certo. O antecedente “lugar” indica espaço e o pronome relativo “em que” pode ser substituído por “onde”, que é relativo de lugar. A correção é mantida.');
  ce('BMPGO37', F_BMPGO + '37', 'constitucional', cBMPGOC, 'É competência privativa da União legislar sobre a proteção e o tratamento de dados pessoais, sistema estatístico, informática, telecomunicações e radiodifusão.', 'C',
    'Certo. O art. 22 da CF dá à União competência privativa para legislar sobre informática, telecomunicações e radiodifusão (IV), sistema estatístico (XVIII) e proteção e tratamento de dados pessoais (XXX, incluído pela EC 115/2022).');
  ce('BMPGO38', F_BMPGO + '38', 'constitucional', cBMPGOC, 'A República Federativa do Brasil tem como um de seus fundamentos o pluralismo político e rege-se, nas suas relações internacionais, pelos princípios da independência nacional e da igualdade entre os Estados.', 'C',
    'Certo. O pluralismo político é fundamento da República (art. 1.º, V), e a independência nacional e a igualdade entre os Estados são princípios das relações internacionais (art. 4.º, I e V).');
  ce('BMPGO41', F_BMPGO + '41', 'constitucional', cBMPGOC, 'É ato indelegável e de competência privativa do presidente da República dispor, mediante decreto, sobre a organização e o funcionamento da administração pública federal, quando não implicar aumento de despesa nem criação ou extinção de órgãos públicos.', 'E',
    'Errado. A competência para dispor, mediante decreto, sobre organização e funcionamento da administração federal nos limites do art. 84, VI, “a”, é privativa do Presidente, mas delegável aos Ministros de Estado, ao Procurador-Geral da República e ao Advogado-Geral da União (art. 84, parágrafo único). Não é indelegável.');
  ce('BMPGO42', F_BMPGO + '42', 'constitucional', cBMPGOC, 'As normas constitucionais programáticas impõem um dever político ao órgão com atribuição para executar o seu comando, servem de referência teleológica para a atividade de interpretação e aplicação do direito e podem funcionar como parâmetro de controle de constitucionalidade.', 'C',
    'Certo. As normas programáticas traçam fins e programas a cumprir pelo Estado: vinculam o legislador e o administrador (dever político), orientam a interpretação e a aplicação do direito e podem servir de parâmetro de controle de constitucionalidade.');
  ce('BMPGO43', F_BMPGO + '43', 'constitucional', cBMPGOC, 'Qualquer cidadão, desde que assistido pelo Ministério Público, é parte legítima para propor ação popular que vise a anular ato lesivo ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural, ficando o autor responsável pelo pagamento das custas judiciais e pelo ônus da sucumbência.', 'E',
    'Errado. Pelo art. 5.º, LXXIII, da CF, qualquer cidadão é parte legítima para propor ação popular, sem necessidade de assistência do Ministério Público, e o autor, salvo comprovada má-fé, fica isento de custas judiciais e do ônus da sucumbência.');
  ce('BMPGO32', F_BMPGO + '32', 'administrativo', cBMPGOIMP, 'Ao analisar as circunstâncias do caso concreto, o Ministério Público pode celebrar acordo de não persecução civil, desde que dele advenham, ao menos, os seguintes resultados: a reversão, à pessoa jurídica lesada, da vantagem indevida obtida, ainda que oriunda de agentes privados, e o integral ressarcimento do dano.', 'C',
    'Certo. O art. 17-B da Lei 8.429/1992 permite ao Ministério Público celebrar acordo de não persecução civil, desde que dele advenham, ao menos, o integral ressarcimento do dano e a reversão, à pessoa jurídica lesada, da vantagem indevida obtida, ainda que oriunda de agentes privados.');
  ce('BMPGO33', F_BMPGO + '33', 'administrativo', cBMPGOIMP, 'A aplicação de sanção pela prática de atos de improbidade que atentam contra os princípios da administração pública exige a ocorrência de lesividade relevante ao bem jurídico tutelado e independe do reconhecimento da produção de danos ao erário e de enriquecimento ilícito dos agentes públicos envolvidos em tais atos.', 'C',
    'Certo. O art. 11, § 4.º, da Lei 8.429/1992 exige lesividade relevante ao bem jurídico tutelado para a sanção por violação de princípios, e a violação dos princípios independe da ocorrência de dano ao erário ou de enriquecimento ilícito.');
  ce('BMPGO34', F_BMPGO + '34', 'administrativo', cBMPGOIMP, 'As disposições da Lei n.º 8.429/1992 são aplicáveis, no que couber, àquele que, mesmo não sendo agente público, induza ou concorra, de forma dolosa ou culposa, para a prática do ato de improbidade.', 'E',
    'Errado. O art. 3.º da Lei 8.429/1992 alcança o terceiro que induza ou concorra dolosamente para o ato. A Lei 14.230/2021 retirou a forma culposa: a improbidade exige dolo.');
  ce('BMPGO44', F_BMPGO + '44', 'administrativo', cBMPGOD, 'A publicidade dos atos administrativos é ferramenta importante para a defesa de direitos dos cidadãos.', 'C',
    'Certo. A publicidade (art. 37, caput, da CF) dá transparência e permite o controle dos atos e o acesso a informações pelos cidadãos, o que viabiliza a defesa de seus direitos.');
  ce('BMPGO45', F_BMPGO + '45', 'administrativo', cBMPGOD, 'A responsabilização administrativa de servidor, mediante processo administrativo disciplinar, não exclui a possibilidade de ele ser punido também na esfera criminal pela mesma conduta.', 'C',
    'Certo. As responsabilidades civil, penal e administrativa são cumulativas e independentes entre si (art. 125 da Lei 8.112/1990). A punição administrativa não impede a criminal pelo mesmo fato.');
  ce('BMPGO46', F_BMPGO + '46', 'administrativo', cBMPGOD, 'Uma das características essenciais dos órgãos públicos é que estes possuem personalidade jurídica.', 'E',
    'Errado. Os órgãos públicos são centros de competência da pessoa jurídica a que pertencem e não têm personalidade jurídica própria. A personalidade é da entidade (União, autarquia etc.).');
  ce('BMPGO48', F_BMPGO + '48', 'administrativo', cBMPGOD, 'Não obstante a presunção de validade dos atos da administração pública, os contratos administrativos que envolvam direito real sobre imóvel exigem a lavratura de escritura pública.', 'C',
    'Certo. A Lei 14.133/2021 (art. 91, § 2.º) determina que os contratos relativos a direitos reais sobre imóveis sejam formalizados por escritura pública lavrada em notas de tabelião, com seu teor divulgado em sítio eletrônico oficial.');
  ce('BMPGO49', F_BMPGO + '49', 'administrativo', cBMPGOD, 'Os poderes da administração pública consistem em faculdades de agir, com base nas quais a autoridade competente toma sua decisão, de forma discricionária.', 'E',
    'Errado. Os poderes administrativos são poderes-deveres, instrumentos para atender ao interesse público, e podem ser exercidos de modo vinculado ou discricionário. A decisão não é sempre discricionária (por exemplo, o poder vinculado não deixa margem de escolha).');
  ce('BMPGO50', F_BMPGO + '50', 'administrativo', cBMPGOLAI, 'Consoante a Lei de Acesso à Informação, apenas pessoas físicas podem formular pedidos de acesso à informação.', 'E',
    'Errado. O art. 10 da Lei 12.527/2011 diz que qualquer interessado poderá apresentar pedido de acesso a informações aos órgãos e entidades. O pedido pode partir de pessoa física ou jurídica, e o requerente não precisa justificar o motivo.');
  ce('BMPGO13', F_BMPGO + '13', 'ti', cBMPGOTI, 'A computação em nuvem permite o compartilhamento remoto de servidores (hardwares), aplicações (softwares) e ferramentas de tecnologia da informação, por exemplo, bancos de dados, provendo transparência de acesso e de localização.', 'C',
    'Certo. Na computação em nuvem, recursos de TI (servidores, armazenamento, bancos de dados, aplicações) são compartilhados remotamente como serviço, e o usuário os acessa sem saber onde estão fisicamente (transparência de acesso e de localização).');
  ce('BMPGO14', F_BMPGO + '14', 'ti', cBMPGOTI, 'No sistema operacional Windows, com o uso do Explorador de Arquivos, é possível efetuar backup de arquivos do computador para um dispositivo de armazenamento externo, como um pendrive.', 'C',
    'Certo. Copiar arquivos pelo Explorador de Arquivos para um pendrive ou outro dispositivo externo é uma forma manual de backup, ainda que menos completa que as ferramentas próprias de backup.');
  ce('BMPGO15', F_BMPGO + '15', 'ti', cBMPGOTI, 'Na rede mundial de computadores, a Internet, há um núcleo chamado intranet, em que os conteúdos armazenados não são indexados e, por isso, é difícil encontrá-los ou auditá-los.', 'E',
    'Errado. Intranet é a rede privada de uma organização, que usa as mesmas tecnologias da Internet e tem acesso restrito. A parte da web não indexada pelos mecanismos de busca é a deep web.');
  ce('BMPGO16', F_BMPGO + '16', 'ti', cBMPGOTI, 'Dropbox e Google Drive são repositórios públicos que permitem a transferência de arquivos entre computadores, via Internet, utilizando os protocolos ARP e ICMP.', 'E',
    'Errado. Dropbox e Google Drive são serviços de armazenamento em nuvem associados a contas de usuário, e não repositórios públicos. A transferência usa HTTP/HTTPS. ARP resolve endereços físicos na rede local, e ICMP serve a mensagens de controle e diagnóstico.');

  /* ===================== Petrobras 2021 ===================== */
  var F_BPETRO = 'Petrobras 2021 · Cebraspe · item ';
  var cBPETRO1 = 'Considere o texto a seguir. [1] O texto mais célebre de A República é sem dúvida a Alegoria da Caverna, em que Platão, utilizando-se de linguagem alegórica, discute o processo pelo qual o ser humano pode passar da visão habitual que tem das coisas, “a visão das sombras”, unidirecional, condicionada pelos hábitos e preconceitos que adquire ao longo de sua vida, até a visão do Sol, que representa a possibilidade de alcançar o conhecimento da realidade em seu sentido mais elevado e compreendê-la em sua totalidade. A visão do Sol representa não só o alcance da Verdade e, portanto, do conhecimento em sua acepção mais completa, já que o Sol é “a causa de tudo”, mas também, como diz Sócrates na conclusão dessa passagem: “Nos últimos limites do mundo inteligível, aparece-me a ideia do Bem, que se percebe com dificuldade, mas que não se pode ver sem se concluir que ela é a causa de tudo o que há de reto e de belo. Acrescento que é preciso vê-la se se quer comportar-se com sabedoria, seja na vida privada, seja na vida pública.”. [2] De acordo com este texto, a possibilidade de um indivíduo tornar-se justo e virtuoso depende de um processo de transformação pelo qual deve passar. Assim, afasta-se das aparências, rompe com as cadeias de preconceitos e condicionamentos e adquire o verdadeiro conhecimento. Tal processo culmina com a visão da forma do Bem, representada pela matéria do Sol. O sábio é aquele que atinge essa percepção. Para Platão, conhecer o Bem significa tornar-se virtuoso. Aquele que conhece a justiça não pode deixar de agir de modo justo. (Danilo Marcondes. Textos básicos de ética: de Platão a Foucault. Rio de Janeiro: Jahar, 2007, p. 31, com adaptações.) Em relação às ideias, aos sentidos e a aspectos linguísticos do texto, julgue o item a seguir.';
  var cBPETRO2 = 'Considere o texto a seguir. Muito tem sido escrito e debatido sobre a afirmativa de que a “Internet é terra de ninguém”. Tal afirmativa não é de hoje, mas ainda alimenta uma sensação de impunidade ou de falsa responsabilidade do que é postado ou compartilhado na Internet e pelas redes sociais. A expressão fakes news, em particular, representa um estrangeirismo que mascara diversos crimes cometidos contra a honra, como injúria, calúnia e difamação. Sob um olhar semântico, dizer “compartilhei fake news de alguém” não carrega qualquer sentimento de culpa, ou se carrega, ela é mínima. Agora, dizer “cometi um crime contra honra” já traz outras implicações, não só de ordem jurídica, mas também de grande responsabilidade pessoal. (Marcelo Hugo da Rocha e Fernando Elias José. Cancelado: a cultura do cancelamento e o prejulgamento nas redes sociais. Belo Horizonte: Letramento, 2021, p. 36, com adaptações.) No que se refere às ideias, aos sentidos e às construções linguísticas do texto, assim como a sua tipologia, julgue o item a seguir.';
  var cBPETRO3 = 'Considere o texto a seguir. [1] A PETROBRAS responde por cerca de 80% dos combustíveis ofertados no Brasil. Para isso, muito foi investido em infraestrutura, com operações que consomem quase 100 bilhões de reais ao ano, conforme dados de 2021. [2] O caminho do petróleo do poço até virar combustível no carro das pessoas é longo e complexo. Começa na procura: acertar onde furar e encontrar petróleo exige conhecimento técnico de geólogos e geofísicos e bastante investimento. E, mesmo com um time de experts do mais alto nível, achar petróleo não é certo. [3] Transportar o petróleo do mar até as refinarias é também uma tarefa complexa, para a qual são utilizados dutos e navios. Em terra, ele é tratado em refinarias, que separam desse óleo as frações de gasolina, diesel e gás de cozinha, entre outros derivados. Os produtos são então disponibilizados às diversas distribuidoras que hoje atendem o mercado brasileiro, responsáveis por fazer chegar cada um deles aos consumidores finais. (Internet: duvidasgasolina.petrobras.com.br, com adaptações.) Considerando as ideias, os sentidos e aspectos linguísticos do texto, julgue o item a seguir.';
  var cBPETRO4 = 'Considere o texto a seguir. [1] Alguns linguistas acreditam que o Homo erectus, há mais ou menos 1 milhão e meio de anos, já tinha uma linguagem. Os argumentos que eles dão são que o Homo erectus tinha um cérebro relativamente grande e usava ferramentas de pedra primitivas, porém bastante padronizadas. Essa hipótese pode ser verdadeira, mas pode também estar bem longe do correto. [2] O uso de ferramentas certamente não requer linguagem. Chimpanzés usam galhos como ferramentas para caçar cupins, ou pedras para quebrar nozes. Obviamente, mesmo as ferramentas mais primitivas do Homo erectus (pedras lascadas) são muito mais sofisticadas que qualquer coisa usada por chimpanzés, mas ainda assim não há uma razão convincente para crer que essas pedras não pudessem ter sido produzidas sem linguagem. [3] O tamanho do cérebro é igualmente problemático como indicador da presença de linguagem, porque ninguém tem uma boa ideia de quanto cérebro exatamente é necessário para a linguagem. Além disso, a capacidade para a linguagem pode ter permanecido latente no cérebro por milhões de anos, sem ter sido de fato colocada em uso. (Guy Deutscher. O desenrolar da linguagem. Campinas: Mercado de Letras, 2014, p. 28-29, com adaptações.) A respeito das ideias, dos sentidos e de aspectos linguísticos do texto, julgue o item a seguir.';
  var cBPETRO5 = 'Considere o texto a seguir. As tecnologias de contar e escrever histórias não seguiram um caminho linear. A própria escrita foi inventada pelo menos duas vezes, primeiro na Mesopotâmia e depois nas Américas. Os sacerdotes indianos se recusavam a escrever as histórias sagradas por medo de perder o controle sobre elas. Professores carismáticos (como Sócrates) se recusaram a escrever. Algumas invenções posteriores foram adotadas somente de forma seletiva, como quando os eruditos árabes usaram o papel chinês, mas não demonstraram nenhum interesse por outra invenção chinesa, a impressão. As invenções relacionadas à escrita tinham muitas vezes efeitos colaterais inesperados. Preservar textos antigos significava manter vivas artificialmente as línguas. Desde então, passou-se a estudar línguas mortas e alguns textos acabaram sendo declarados sagrados. (Martin Puchner. O mundo da escrita. São Paulo: Companhia das Letras, 2019, p. 18, com adaptações.) Julgue o item a seguir, relativo à tipologia, aos sentidos e a aspectos linguísticos do texto.';
  var cBPETROE1 = 'Read the text below. [1] The worn wooden floorboards squeak under Rafael Molina’s heavy steps as he paces the saloon. Outside, the sound of galloping horses breaks the silence of the surrounding desert. All around him, the Old West town’s empty shops and abandoned houses look as if they have just been ransacked by cowboy bandits. [2] “When I was a kid, I could only dream about all this,” says the 68-year-old former actor and stuntman. “My aspiration was to see a film set firsthand. Today I own one of the most famous ones in the history of Western movies.” [3] But this busy movie site is located in Spain — not Montana or Texas. It’s one of three faux Old Western towns in the small village of Tabernas and the surrounding desert of the Almería province. Since the late 1950s, these rugged mountains, arid plains, and dry canyons have provided the backdrops for more than 170 movie Westerns, including The Good, The Bad and The Ugly (1966) and Once Upon a Time in The West (1968). [4] Molina belongs to a small community of local cowboy actors and stuntmen in Tabernas who have played a role in movies and TV shows since the first productions in the 1950s. They can perform anything from fistfights to horse drags. Knowledge and skills often pass from father to son, keeping tricks of the trade in the family. Steeped in the golden era of Westerns, these actors embody the values of their movie heroes: pride, bravado, freedom, and a trusting relationship with horses. [5] “I’ve always liked horses and the [U.S.] West,” says 29-year-old Ricardo Cruz Fernández, a stuntman and cowboy who appeared in recent productions including Game of Thrones. Fernández started his career as a cowboy after completing a stuntman course a decade ago. [6] Between productions, he performs daily shows at Fort Bravo for thousands of tourists who visit the set each year. In one show, Fernández portrays a bank robber who absconds with some gold. Visitors encounter him in the saloon, fist and (fake) gun fighting with actors playing his double-crossing accomplices. The town also offers cancan dance shows and set tours by horse-drawn wagon. [7] “I prefer to play the bad guy, because it gives me a wider range of possibilities,” says Fernández. “The good guy only has to keep things in order.” [8] Almería has hosted more than 500 productions, including blockbuster films (Patton, Terminator: Dark Fate) and TV shows (Doctor Who). “Our landscapes are very convenient. We have sea, desert, and snowy mountains all within a short distance,” says local producer Plácido Martínez. “We can serve as Texas, New Mexico, Arizona, California, and endless other natural settings.” (Matteo Fagotto. The Wild West lives on in southern Spain. National Geographic, adapted.) Concerning the text and its linguistic aspects, judge the following item.';
  var cBPETROE2 = 'Read the text below. [1] In a world where many of us are glued to our smartphones, Dulcie Cowling is something of an anomaly — she has ditched hers. The 36-year-old decided at the end of last year that getting rid of her handset would improve her mental health. So, over Christmas she told her family and friends that she was switching to an old Nokia phone that could only make and receive calls and text messages. [2] She recalls that one of the pivotal moments that led to her decision was a day at the park with her two boys, aged six and three: “I was on my mobile at a playground with the kids and I looked up and every single parent — there was up to 20 — were looking at their phones, just scrolling away,” she says. [3] “I thought ‘when did this happen?’. Everyone is missing out on real life. I don’t think you get to your death bed and think you should have spent more time on Twitter, or reading articles online.” [4] Ms Cowling, who is a creative director at London-based advertising agency Hell Yeah!, adds that the idea to abandon her smartphone had built up during the covid-19 lockdowns. [5] “I thought about how much of my life is spent looking at the phone and what else could I do. Being constantly connected to lots of services creates a lot of distractions, and is a lot for the brain to process.” [6] She plans to use the time gained from quitting her smartphone to read and sleep more. [7] About nine out of 10 people in the UK now own a smartphone, a figure broadly replicated across the developed world. And we are glued to them — one recent study found that the average person spends 4.8 hours a day on their handset. [8] Yet for a small, but growing number of people, enough is enough. [9] Alex Dunedin binned his smartphone two years ago. “Culturally we have become addicted to these tools,” says the educational researcher and technology expert. “They are blunting cognition and impeding productivity.” [10] He has become happier and more productive s
