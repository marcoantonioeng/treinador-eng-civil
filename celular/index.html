<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400..700&display=swap">
</head><body>
<style>
/* Conceito: o canteiro desenhado em prancha. Cada tema do edital é um prédio que sobe andar por andar;
   no claro, papel com traço azul; no escuro, cianótipo. O dourado marca tudo o que é conquista. */
:root {
  --fundo: #e8eef6;
  --grade: rgba(27, 92, 174, .075);
  --folha: #fbfcfe;
  --tinta: #13243b;
  --tinta-2: #51637c;
  --linha: #c5d0de;
  --linha-forte: #7f91a9;
  --azul: #1b5cae;
  --azul-suave: #dce7f6;
  --ouro: #f2b51d;
  --ouro-esc: #b47c00;
  --sobre-ouro: #2b1d00;
  --laranja: #cb4c12;
  --laranja-suave: #f8e5d9;
  --certo: #1b7849;
  --certo-suave: #def1e5;
  --errado: #b3281f;
  --errado-suave: #f9e3e0;
  --neutro-suave: #e4eaf2;
  --g-certo: #1b7849; --g-errado: #e8806f; --g-branco: #9aa8bb;
  --sombra: rgba(19, 36, 59, .22);
  --f-titulo: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-texto: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-dado: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --raio: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #0b2140; --grade: rgba(143, 192, 255, .07); --folha: #122e57; --tinta: #eaf1fb; --tinta-2: #a9bdd9;
    --linha: #27497a; --linha-forte: #5f82b3; --azul: #8fc0ff; --azul-suave: #1b3e70; --ouro: #ffc93c; --ouro-esc: #b98500;
    --sobre-ouro: #2b1d00; --laranja: #ff9457; --laranja-suave: #47301f; --certo: #6fdba2; --certo-suave: #14463a; --errado: #ff9086;
    --errado-suave: #4b2937; --neutro-suave: #193765; --sombra: rgba(0, 0, 0, .4); color-scheme: dark;
  --g-certo: #2a8556; --g-errado: #ee8a7d; --g-branco: #6c84a6;
  }
}
:root[data-theme="dark"] {
  --fundo: #0b2140; --grade: rgba(143, 192, 255, .07); --folha: #122e57; --tinta: #eaf1fb; --tinta-2: #a9bdd9;
  --linha: #27497a; --linha-forte: #5f82b3; --azul: #8fc0ff; --azul-suave: #1b3e70; --ouro: #ffc93c; --ouro-esc: #b98500;
  --sobre-ouro: #2b1d00; --laranja: #ff9457; --laranja-suave: #47301f; --certo: #6fdba2; --certo-suave: #14463a; --errado: #ff9086;
  --errado-suave: #4b2937; --neutro-suave: #193765; --sombra: rgba(0, 0, 0, .4); color-scheme: dark;
  --g-certo: #2a8556; --g-errado: #ee8a7d; --g-branco: #6c84a6;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--fundo);
  background-image: linear-gradient(var(--grade) 1px, transparent 1px), linear-gradient(90deg, var(--grade) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--tinta);
  font-family: var(--f-texto);
  font-size: 17px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 56px;
}
.pagina { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.12; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.rot { font-family: var(--f-titulo); text-transform: uppercase; letter-spacing: .09em; font-size: 12.5px; color: var(--tinta-2); font-weight: 600; }
.dado { font-family: var(--f-dado); font-variant-numeric: tabular-nums; }
.ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.16em; }
.bloco { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
@media (prefers-reduced-motion: no-preference) {
  .pagina > * { animation: entra .28s ease-out both; }
  @keyframes entra { from { transform: translateY(10px); } to { transform: none; } }
}

/* ---------- botões de jogo ---------- */
.btn {
  border: 2px solid var(--tinta); background: var(--folha); padding: 10px 18px; border-radius: var(--raio);
  font-family: var(--f-titulo); font-size: 19px; font-weight: 600; letter-spacing: .03em; line-height: 1.2;
  box-shadow: 0 4px 0 var(--tinta); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .06s, box-shadow .06s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.btn.prim { background: var(--ouro); color: var(--sobre-ouro); border-color: var(--ouro-esc); box-shadow: 0 4px 0 var(--ouro-esc); }
.btn.prim:active:not(:disabled) { box-shadow: 0 1px 0 var(--ouro-esc); }
.btn.sec { border-color: var(--linha-forte); box-shadow: 0 4px 0 var(--linha-forte); font-weight: 500; }
.btn.sec:active:not(:disabled) { box-shadow: 0 1px 0 var(--linha-forte); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.grande { font-size: 24px; padding: 14px 22px; width: 100%; }
.btn.cta { flex-direction: column; gap: 0; padding: 12px 18px 14px; }
.cta-t { font-size: 34px; font-weight: 700; line-height: 1.05; display: inline-flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: .05em; }
.cta-s { font-size: 17px; font-weight: 500; letter-spacing: .02em; text-wrap: balance; }
.btn-link { background: none; border: none; padding: 4px 0; color: var(--azul); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }
.acoes { display: flex; flex-wrap: wrap; gap: 12px 10px; }

/* ---------- cabeçalho do jogador ---------- */
.jogador { background: var(--folha); border: 2px solid var(--tinta); border-radius: var(--raio); display: grid; grid-template-columns: 1fr auto; }
.jogador .carreira { padding: 10px 14px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.jogador h1 { font-size: clamp(24px, 5vw, 32px); font-weight: 700; }
.jogador .marcas { display: flex; border-left: 2px solid var(--tinta); }
.marca { padding: 8px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-width: 72px; }
.marca + .marca { border-left: 1px solid var(--linha-forte); }
.marca strong { font-family: var(--f-titulo); font-size: 28px; font-weight: 700; line-height: 1; display: flex; align-items: center; gap: 4px; }
.marca.fogo strong { color: var(--laranja); }
.marca.fogo.apagado strong { color: var(--tinta-2); }
.marca.estrelas strong .ic { color: var(--ouro); }
.barra-xp { height: 12px; background: var(--neutro-suave); border: 1.5px solid var(--tinta); border-radius: 999px; overflow: hidden; }
.barra-xp i { display: block; height: 100%; background: var(--ouro); width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.xp-legenda { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; font-family: var(--f-dado); font-size: 12.5px; color: var(--tinta-2); }

/* ---------- canteiro (skyline) ---------- */
.canteiro { background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio); padding: 10px 8px 4px; overflow-x: auto; }
.canteiro svg { display: block; width: 100%; min-width: 320px; height: auto; }
.canteiro .predio { cursor: pointer; }
.canteiro .a0 { fill: none; stroke: var(--linha-forte); stroke-width: 1; stroke-dasharray: 3 2.5; }
.canteiro .a1 { fill: var(--azul); stroke: var(--tinta); stroke-width: 1; }
.canteiro .a3 { fill: var(--tinta); stroke: var(--tinta); stroke-width: 1; }
.canteiro .jan { fill: var(--folha); }
.canteiro .a3 + .jans .jan, .canteiro .jan.acesa { fill: var(--ouro); }
.canteiro .prox { stroke: var(--ouro-esc); stroke-width: 1.6; stroke-dasharray: none; fill: var(--ouro); fill-opacity: .25; }
.canteiro .chao { stroke: var(--tinta); stroke-width: 2; }
.canteiro text { fill: var(--tinta-2); font-family: var(--f-dado); font-size: 9.5px; }
.canteiro .predio:hover text, .canteiro .predio:focus-visible text { fill: var(--azul); font-weight: 500; }
.canteiro .topo { fill: var(--ouro); stroke: var(--ouro-esc); stroke-width: .8; }
@media (prefers-reduced-motion: no-preference) {
  .canteiro .prox { animation: pisca 1.6s ease-in-out infinite; }
  @keyframes pisca { 50% { fill-opacity: .6; } }
}

/* ---------- modos ---------- */
.modos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.modo {
  background: var(--folha); border: 2px solid var(--tinta); border-radius: var(--raio); box-shadow: 0 4px 0 var(--tinta);
  padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 92px; min-width: 0;
  transition: transform .06s, box-shadow .06s;
}
.modo:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.modo:disabled { opacity: .6; cursor: default; }
.modo .nome { font-family: var(--f-titulo); font-size: 20px; font-weight: 700; line-height: 1.1; display: flex; align-items: center; gap: 6px; }
.modo .nome .ic { color: var(--azul); }
.modo .desc { font-size: 13.5px; color: var(--tinta-2); line-height: 1.3; }
.modo .extra { margin-top: auto; font-family: var(--f-dado); font-size: 12px; color: var(--tinta-2); }
.modo .extra b { color: var(--laranja); font-weight: 500; }

/* ---------- missões ---------- */
.missoes { background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio); padding: 4px 14px; }
.missao { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--linha); font-size: 15.5px; }
.missao:last-child { border-bottom: none; }
.missao .premio { font-family: var(--f-dado); font-size: 12.5px; color: var(--tinta-2); white-space: nowrap; }
.missao .trilho { grid-column: 1 / -1; height: 7px; background: var(--neutro-suave); border-radius: 999px; overflow: hidden; }
.missao .trilho i { display: block; height: 100%; background: var(--azul); }
.missao.feita { color: var(--certo); }
.missao.feita .trilho i { background: var(--certo); }
.missao.feita .premio { color: var(--certo); }

/* ---------- temas ---------- */
.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
.tema {
  text-align: left; background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
}
.tema:hover { border-color: var(--azul); background: var(--azul-suave); }
.tema .nome { font-family: var(--f-titulo); font-size: 19px; font-weight: 600; line-height: 1.15; }
.tema .linha2 { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 8px; min-width: 0; font-family: var(--f-dado); font-size: 12px; color: var(--tinta-2); }
.tema .nome { flex: 1; }
.tema .linha2 span:first-child { white-space: nowrap; }
.tema .trilho { height: 6px; background: var(--neutro-suave); border-radius: 999px; overflow: hidden; }
.tema .trilho i { display: block; height: 100%; background: var(--ouro); }
.tema.completo { border-color: var(--ouro-esc); }

.nota-metodo { font-size: 13.5px; color: var(--tinta-2); max-width: 70ch; }

/* ---------- tela do tema (andares) ---------- */
.topo-tela { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topo-tela h2 { font-size: clamp(26px, 5vw, 34px); font-weight: 700; }
.andares { display: flex; flex-direction: column-reverse; gap: 6px; }
.andar {
  display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; text-align: left;
  padding: 9px 14px; border: 1.5px solid var(--linha-forte); border-radius: var(--raio); background: var(--folha); min-height: 58px;
}
.andar .num { font-family: var(--f-titulo); font-size: 26px; font-weight: 700; line-height: 1; }
.andar .num small { display: block; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--tinta-2); font-weight: 600; }
.andar .info { font-size: 14.5px; color: var(--tinta-2); min-width: 0; }
.andar .info b { display: block; font-family: var(--f-titulo); font-size: 18px; color: var(--tinta); font-weight: 600; }
.andar.atual { border: 2px solid var(--ouro-esc); background: var(--folha); box-shadow: 0 4px 0 var(--ouro-esc); }
.andar.atual .acao { background: var(--ouro); color: var(--sobre-ouro); }
.andar.trancado { border-style: dashed; opacity: .6; cursor: default; }
.andar .acao { font-family: var(--f-titulo); font-weight: 700; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; background: var(--neutro-suave); }
.estrelinhas { display: inline-flex; gap: 2px; color: var(--linha-forte); }
.estrelinhas .on { color: var(--ouro); }
.terreo { border-top: 3px solid var(--tinta); padding-top: 6px; font-family: var(--f-dado); font-size: 12px; color: var(--tinta-2); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- placar do dia (tela inicial) ---------- */
.hoje { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--folha); border: 2px solid var(--tinta); border-radius: var(--raio); overflow: hidden; }
.hoje > div { padding: 8px 10px; display: flex; flex-direction: column; gap: 0; min-width: 0; border-right: 1px solid var(--linha-forte); }
.hoje > div:last-child { border-right: none; }
.hoje .rot { font-size: 11.5px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hoje strong { font-family: var(--f-titulo); font-size: clamp(28px, 8vw, 38px); font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hoje .c strong { color: var(--certo); } .hoje .e strong { color: var(--errado); }

/* ---------- HUD da partida ---------- */
/* Placar e cronômetro ficam presos ao topo enquanto a questão rola por baixo. */
.topo-fixo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12;
  display: flex; flex-direction: column; gap: 8px; padding-block: 8px 6px;
  background: var(--fundo); box-shadow: 0 0 0 100vmax var(--fundo); clip-path: inset(0 -100vmax);
  border-bottom: 1.5px solid var(--linha-forte);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 13; background: var(--fundo); }
:root:has(.topo-fixo) { scroll-padding-top: 150px; }
/* avisos descem para não cobrir o placar fixo */
:root:has(.topo-fixo) #toasts { top: calc(env(safe-area-inset-top, 0px) + 132px); }
.hud { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.hud-sair { background: none; border: 1.5px solid var(--linha-forte); border-radius: 999px; padding: 4px 12px; font-family: var(--f-titulo); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.pips { display: flex; gap: 3px; flex: 1 1 50px; min-width: 40px; }
.pip { height: 10px; flex: 1; max-width: 46px; border-radius: 3px; background: var(--neutro-suave); border: 1px solid var(--linha-forte); }
.pip.c { background: var(--certo); border-color: var(--certo); }
.pip.e { background: var(--errado); border-color: var(--errado); }
.pip.b { background: var(--linha-forte); }
.pip.atual { border: 2px solid var(--tinta); }
.vidas { display: inline-flex; gap: 3px; font-size: 22px; color: var(--laranja); }
.vidas .perdida { color: var(--linha); }
.combo { font-family: var(--f-titulo); font-weight: 700; font-size: 20px; padding: 1px 10px; border-radius: 999px; border: 1.5px solid var(--linha-forte); color: var(--tinta-2); display: inline-flex; align-items: center; gap: 4px; }
.combo.quente { background: var(--ouro); color: var(--sobre-ouro); border-color: var(--ouro-esc); }
.hud .pontos { margin-left: auto; font-family: var(--f-titulo); font-weight: 700; font-size: 24px; line-height: 1; }
.hud .pontos small { font-size: 12px; letter-spacing: .08em; color: var(--tinta-2); margin-left: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .pulso { animation: pulso .45s ease-out; }
  @keyframes pulso { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  .treme { animation: treme .4s; }
  @keyframes treme { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
}

.escala { display: grid; gap: 2px; }
.escala-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.escala-topo .rot { min-width: 0; }
.escala-topo .seg { white-space: nowrap; font-family: var(--f-dado); font-size: 26px; line-height: 1; font-weight: 500; }
.escala-topo .seg.alerta { color: var(--laranja); }
.escala svg { width: 100%; height: 34px; display: block; overflow: visible; }
.escala .cheio { fill: var(--tinta); }
.escala .cheio.alerta { fill: var(--laranja); }
.escala .vazio { fill: var(--folha); stroke: var(--tinta); stroke-width: 1; }
.escala text { fill: var(--tinta-2); font-family: var(--f-dado); font-size: 10px; }
@media (prefers-reduced-motion: no-preference) { .escala rect.cheio { transition: width .25s linear; } }

.folha { background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio); padding: 16px clamp(14px, 3vw, 24px) 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.folha .fonte { font-family: var(--f-dado); font-size: 12.5px; color: var(--tinta-2); }
.contexto { background: var(--neutro-suave); padding: 10px 14px; font-size: 15.5px; border-left: 3px solid var(--linha-forte); }
.enunciado { font-size: 19px; line-height: 1.5; max-width: 68ch; }
.figura { overflow-x: auto; }
.figura svg { max-width: 100%; height: auto; display: block; margin: 0 auto; color: var(--tinta); }
.figura svg text { fill: currentColor; font-family: var(--f-dado); }

.respostas-ce { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn-resp {
  background: var(--folha); border: 2px solid var(--tinta); border-radius: var(--raio); padding: 16px 10px; box-shadow: 0 5px 0 var(--tinta);
  font-family: var(--f-titulo); font-size: 24px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .06s, box-shadow .06s;
}
.btn-resp:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
.btn-resp kbd { font-family: var(--f-dado); font-size: 12px; border: 1px solid var(--linha-forte); padding: 0 5px; border-radius: 3px; color: var(--tinta-2); font-weight: 400; letter-spacing: 0; }
.btn-resp:hover:not(:disabled) { background: var(--azul-suave); }
.btn-resp:disabled { cursor: default; opacity: .5; box-shadow: 0 2px 0 var(--linha-forte); border-color: var(--linha-forte); }
.btn-resp.escolhida { opacity: 1; outline: 3px solid var(--azul); outline-offset: 2px; }
.btn-resp.gab { opacity: 1; background: var(--certo-suave); border-color: var(--certo); color: var(--certo); box-shadow: 0 2px 0 var(--certo); }
.btn-branco { justify-self: start; align-self: flex-start; background: none; border: none; color: var(--tinta-2); font-size: 14.5px; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
@media (hover: none) { .btn-resp kbd { display: none; } }

.respostas-me { display: flex; flex-direction: column; gap: 8px; }
.opcao {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left;
  background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio); padding: 10px 12px; font-size: 16.5px;
}
.opcao .letra { font-family: var(--f-dado); font-weight: 500; border: 1.5px solid var(--tinta); border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: 14px; }
.opcao:hover:not(:disabled) { background: var(--azul-suave); border-color: var(--azul); }
.opcao:disabled { cursor: default; }
.opcao.escolhida { outline: 3px solid var(--azul); outline-offset: 1px; }
.opcao.gab { background: var(--certo-suave); border-color: var(--certo); }
.opcao.gab .letra { border-color: var(--certo); color: var(--certo); }
.opcao.marcada-errada { background: var(--errado-suave); border-color: var(--errado); }

/* ---------- correção ---------- */
.correcao { border: 2px solid var(--tinta); border-radius: var(--raio); background: var(--folha); display: flex; flex-direction: column; overflow: hidden; }
.correcao .veredito { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; padding: 10px 16px; border-bottom: 1.5px solid var(--tinta); }
.correcao .veredito h2 { font-size: 28px; font-weight: 700; }
.correcao.ok .veredito { background: var(--certo-suave); } .correcao.ok h2 { color: var(--certo); }
.correcao.erro .veredito { background: var(--errado-suave); } .correcao.erro h2 { color: var(--errado); }
.correcao.branco .veredito { background: var(--neutro-suave); }
.ganho { font-family: var(--f-titulo); font-weight: 700; font-size: 24px; color: var(--sobre-ouro); background: var(--ouro); border: 1.5px solid var(--ouro-esc); border-radius: 999px; padding: 0 12px; white-space: nowrap; }
.ganho small { font-size: 13px; letter-spacing: .06em; }
.correcao .gabarito { font-family: var(--f-dado); font-size: 13.5px; padding: 8px 16px 0; color: var(--tinta-2); }
.correcao .just { padding: 8px 16px 14px; font-size: 16.5px; max-width: 72ch; }
.correcao .acoes { padding: 0 16px 18px; }

/* ---------- resultado ---------- */
.resultado { background: var(--folha); border: 2px solid var(--tinta); border-radius: var(--raio); padding: 20px clamp(14px, 4vw, 28px) 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.resultado h2 { font-size: clamp(32px, 7vw, 46px); font-weight: 700; }
.resultado .sub { color: var(--tinta-2); font-size: 16px; max-width: 46ch; }
.estrelonas { display: flex; gap: 10px; align-items: flex-end; }
.estrelonas svg { width: clamp(56px, 16vw, 84px); height: auto; color: var(--neutro-suave); stroke: var(--linha-forte); stroke-width: 1; }
.estrelonas svg:nth-child(2) { width: clamp(68px, 20vw, 104px); }
.estrelonas svg.on { color: var(--ouro); stroke: var(--ouro-esc); }
@media (prefers-reduced-motion: no-preference) {
  .estrelonas svg.on { animation: carimba .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .estrelonas svg.on:nth-child(2) { animation-delay: .35s; }
  .estrelonas svg.on:nth-child(3) { animation-delay: .7s; }
  @keyframes carimba { from { transform: scale(2.4) rotate(-25deg); } to { transform: none; } }
}
.placarzao { font-family: var(--f-titulo); font-weight: 700; font-size: clamp(44px, 12vw, 72px); line-height: 1; }
.placarzao small { font-size: 18px; letter-spacing: .08em; color: var(--tinta-2); margin-left: 6px; }
.recorde { font-family: var(--f-dado); font-size: 13.5px; color: var(--tinta-2); }
.recorde.novo { color: var(--sobre-ouro); background: var(--ouro); border-radius: 999px; padding: 2px 12px; font-weight: 500; }
.ganhos { width: 100%; max-width: 420px; display: flex; flex-direction: column; font-size: 15.5px; text-align: left; }
.ganhos div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--linha); }
.ganhos div:last-child { border-bottom: none; font-weight: 600; }
.ganhos span:last-child { font-family: var(--f-dado); white-space: nowrap; }
.promo { font-family: var(--f-titulo); font-size: 22px; font-weight: 700; background: var(--ouro); color: var(--sobre-ouro); border: 2px solid var(--ouro-esc); border-radius: var(--raio); padding: 6px 16px; }
.nivel-box { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.resultado .acoes { justify-content: center; margin-top: 6px; }
.feitos { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.feito { font-family: var(--f-titulo); font-size: 16px; font-weight: 600; padding: 2px 12px; border-radius: 999px; border: 1.5px solid var(--ouro-esc); background: var(--folha); display: inline-flex; gap: 6px; align-items: center; }
.feito .ic { color: var(--ouro-esc); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1.5px solid var(--tinta); border-radius: var(--raio); background: var(--folha); overflow: hidden; }
.kpi { padding: 10px 12px; border-right: 1px solid var(--linha-forte); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi:last-child { border-right: none; }
.kpi strong { font-family: var(--f-titulo); font-size: clamp(26px, 6vw, 36px); font-weight: 700; line-height: 1.05; }
.kpi.c strong { color: var(--certo); } .kpi.e strong { color: var(--errado); }
.kpi small { font-size: 12.5px; color: var(--tinta-2); line-height: 1.3; }
.tabela-wrap { overflow-x: auto; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--folha); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: middle; }
th { font-family: var(--f-titulo); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 12.5px; color: var(--tinta-2); }
td.num, th.num { font-family: var(--f-dado); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
.barra { height: 8px; background: var(--neutro-suave); position: relative; min-width: 80px; border-radius: 999px; overflow: hidden; }
.barra i { position: absolute; inset: 0 auto 0 0; background: var(--certo); }
.barra i.baixo { background: var(--errado); } .barra i.medio { background: var(--laranja); }
.revisao { display: flex; flex-direction: column; gap: 8px; }
details.item { background: var(--folha); border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: 8px 14px; }
details.item summary { cursor: pointer; font-size: 15.5px; }
details.item summary .dado { font-size: 12.5px; color: var(--tinta-2); }
details.item p { margin-top: 8px; font-size: 15.5px; max-width: 72ch; }
.vazio-msg { color: var(--tinta-2); font-size: 15px; }

/* ---------- discursiva ---------- */
.quesitos { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
.quesitos .pts { font-family: var(--f-dado); font-size: 13px; color: var(--tinta-2); white-space: nowrap; }
textarea {
  width: 100%; min-height: 320px; resize: vertical; font-family: var(--f-texto); font-size: 17px; line-height: 28px;
  padding: 4px 12px; color: var(--tinta); border: 1px solid var(--linha-forte); border-radius: 0;
  background-color: var(--folha);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--linha) 27px, var(--linha) 28px);
  background-attachment: local; background-position: 0 4px;
}
.info-texto { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-family: var(--f-dado); font-size: 13px; color: var(--tinta-2); }
.info-texto .excesso { color: var(--errado); }
.avaliacao { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px; }
.quesito-av { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--linha); }
.quesito-av:last-child { border-bottom: none; padding-bottom: 0; }
.quesito-av header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.quesito-av h3 { font-size: 19px; }
.quesito-av p { font-size: 16px; max-width: 72ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-dado); font-size: 12px; padding: 2px 8px; border: 1px solid var(--linha-forte); border-radius: 999px; color: var(--tinta-2); }
.chip.achou { border-color: var(--certo); color: var(--certo); background: var(--certo-suave); }
.nota-q { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.nota-q select { font: inherit; font-family: var(--f-dado); padding: 3px 6px; background: var(--folha); color: var(--tinta); border: 1px solid var(--linha-forte); }
.total-disc { font-family: var(--f-dado); font-size: 15px; }

/* ---------- conquistas ---------- */
.conquistas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.conq { background: var(--folha); border: 1.5px dashed var(--linha-forte); border-radius: var(--raio); padding: 10px 12px; display: grid; grid-template-columns: 38px 1fr; gap: 2px 10px; align-items: center; color: var(--tinta-2); }
.conq .selo { grid-row: 1 / 3; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--linha-forte); display: grid; place-items: center; font-size: 20px; }
.conq b { font-family: var(--f-titulo); font-size: 18px; font-weight: 700; line-height: 1.1; }
.conq span { font-size: 13.5px; line-height: 1.3; }
.conq.tem { border: 2px solid var(--ouro-esc); color: var(--tinta); }
.conq.tem .selo { background: var(--ouro); border-color: var(--ouro-esc); color: var(--sobre-ouro); }

/* ---------- painel de preparação (indicadores, domínio, chute, ritmo) ---------- */
.intro { font-size: 15.5px; color: var(--tinta-2); max-width: 68ch; }
h2.secao { font-size: 26px; font-weight: 700; }
.kpi.l strong { color: var(--laranja); }
.medidor { height: 6px; background: var(--neutro-suave); margin-top: 4px; position: relative; border-radius: 999px; overflow: hidden; }
.medidor i { position: absolute; inset: 0 auto 0 0; background: var(--azul); }
.medidor i.cheio { background: var(--certo); }
.recomendado {
  text-align: left; border: 2px solid var(--tinta); background: var(--folha); border-radius: var(--raio); box-shadow: 0 4px 0 var(--tinta);
  display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; align-items: center; padding: 14px 16px; transition: transform .06s, box-shadow .06s;
}
.recomendado:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.recomendado:hover { background: var(--azul-suave); }
.recomendado .nome { font-family: var(--f-titulo); font-size: 26px; font-weight: 700; line-height: 1.1; }
.recomendado .desc { font-size: 15px; color: var(--tinta-2); grid-column: 1; line-height: 1.4; }
.recomendado .ir { grid-row: 1 / span 2; grid-column: 2; font-family: var(--f-titulo); font-size: 18px; font-weight: 700; background: var(--tinta); color: var(--folha); padding: 9px 16px; border-radius: 999px; white-space: nowrap; }
.modos.tres { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.modo.baixo { min-height: 0; }
.modo.alerta { border-color: var(--errado); box-shadow: 0 4px 0 var(--errado); }
.modo.alerta .extra b { color: var(--errado); }
.modo.discursiva { border-style: dashed; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cartao { background: var(--folha); border: 1.5px solid var(--linha-forte); border-radius: var(--raio); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cartao p { font-size: 15.5px; max-width: 62ch; }
.cartao .grande { font-family: var(--f-titulo); font-weight: 700; font-size: 30px; line-height: 1.1; }
.cartao .veredito-chute { font-size: 15.5px; padding: 8px 10px; border-left: 3px solid var(--linha-forte); background: var(--neutro-suave); }
.cartao .veredito-chute.bom { border-color: var(--certo); background: var(--certo-suave); }
.cartao .veredito-chute.ruim { border-color: var(--errado); background: var(--errado-suave); }
.spark { width: 100%; height: auto; display: block; }
.spark text { fill: var(--tinta-2); font-family: var(--f-dado); font-size: 10px; }
.spark .base { stroke: var(--linha-forte); stroke-width: 1; }
.spark .b-ok { fill: var(--certo); } .spark .b-med { fill: var(--laranja); } .spark .b-ruim { fill: var(--errado); } .spark .b-zero { fill: var(--linha); }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--tinta-2); font-family: var(--f-dado); }
.legenda i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.st { display: inline-block; font-family: var(--f-dado); font-size: 11.5px; padding: 0 7px; border: 1px solid var(--linha-forte); border-radius: 999px; white-space: nowrap; color: var(--tinta-2); }
.st.critico { color: var(--errado); border-color: var(--errado); background: var(--errado-suave); }
.st.atencao { color: var(--laranja); border-color: var(--laranja); background: var(--laranja-suave); }
.st.bom { color: var(--azul); border-color: var(--azul); background: var(--azul-suave); }
.st.dominado { color: var(--certo); border-color: var(--certo); background: var(--certo-suave); }
.btn-mini { border: 1.5px solid var(--linha-forte); background: var(--folha); border-radius: 999px; padding: 2px 12px; font-family: var(--f-titulo); font-size: 15px; font-weight: 600; white-space: nowrap; }
.btn-mini:hover { border-color: var(--azul); background: var(--azul-suave); }
td small { display: block; font-size: 12px; color: var(--tinta-2); font-family: var(--f-dado); }
th { white-space: nowrap; }
th.num { font-family: var(--f-titulo); }
.barra i.azul { background: var(--azul); }

.ajustes-box { background: var(--folha); border: 1px solid var(--linha-forte); border-radius: var(--raio); padding: 0; }
.ajustes-box > summary { padding: 10px 14px; font-family: var(--f-titulo); font-size: 18px; font-weight: 600; cursor: pointer; }
.ajustes { display: flex; flex-wrap: wrap; gap: 12px 26px; padding: 4px 14px 14px; font-size: 15px; align-items: center; }
.ajustes label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.ajustes input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--azul); }
.ajustes input[type=date], .ajustes input[type=number] { font: inherit; font-family: var(--f-dado); font-size: 14px; padding: 4px 6px; background: var(--folha); color: var(--tinta); border: 1px solid var(--linha-forte); }
.ajustes input[type=number] { width: 80px; }
.sync { font-family: var(--f-dado); font-size: 12.5px; color: var(--tinta-2); }
.sync.conta { color: var(--certo); }
.perigo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px 14px; border-top: 1px solid var(--linha); font-size: 14.5px; }
.btn-perigo { border: 1px solid var(--errado); color: var(--errado); background: var(--folha); border-radius: var(--raio); padding: 5px 12px; font-size: 14.5px; }
.btn-perigo.forte { background: var(--errado); color: var(--folha); }

/* ---------- grau de certeza e agenda de revisão ---------- */
.folha .fonte { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; }
.certeza { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14.5px; }
.seg-ctl { display: inline-flex; border: 1.5px solid var(--linha-forte); border-radius: 999px; overflow: hidden; }
.seg-ctl button { border: none; background: var(--folha); padding: 5px 14px; font-size: 14.5px; }
.seg-ctl button + button { border-left: 1.5px solid var(--linha-forte); }
.seg-ctl button[aria-pressed="true"] { background: var(--tinta); color: var(--folha); }
.seg-ctl button.duvida[aria-pressed="true"] { background: var(--laranja); color: var(--folha); }
.certeza kbd, .atalhos kbd { font-family: var(--f-dado); font-size: 12px; border: 1px solid var(--linha-forte); padding: 0 5px; border-radius: 3px; color: var(--tinta-2); }
.atalhos { font-size: 13px; color: var(--tinta-2); }
@media (hover: none) { .atalhos { display: none; } }
.agenda { margin: 0 16px 14px; font-family: var(--f-dado); font-size: 13px; color: var(--tinta-2); border-top: 1px dashed var(--linha-forte); padding-top: 8px; }
.agenda b { color: var(--tinta); font-weight: 500; }
.correcao .just { padding-bottom: 8px; }
.revisao .figura { margin-top: 8px; }

/* ---------- avisos e confete ---------- */
#toasts { position: fixed; z-index: 30; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { background: var(--tinta); color: var(--folha); border-radius: 999px; padding: 6px 16px 6px 12px; font-family: var(--f-titulo); font-size: 18px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 6px 18px var(--sombra); max-width: 100%; }
.toast .ic { color: var(--ouro); }
.toast small { font-family: var(--f-dado); font-size: 13px; font-weight: 400; color: var(--ouro); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: desce .35s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes desce { from { transform: translateY(-60px); } to { transform: none; } }
}
#confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .modos { grid-template-columns: 1fr 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi:nth-child(2) { border-right: none; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--linha-forte); }
  .marca { min-width: 58px; padding: 8px 10px; }
  .enunciado { font-size: 18px; }
  .andar { grid-template-columns: 44px 1fr auto; gap: 10px; padding: 9px 10px; }
  .btn-resp { font-size: 22px; padding: 16px 6px; }
  .duas { grid-template-columns: 1fr; }
  .recomendado { grid-template-columns: 1fr; }
  .recomendado .ir { grid-row: auto; grid-column: 1; justify-self: start; }
  .col-opc { display: none; }
  .modos.tres .modo .nome { font-size: 17px; }
  .hud { gap: 8px; }
  .hud-sair { padding: 6px 8px; }
  .hud-sair span { display: none; }
  .vidas { font-size: 20px; gap: 1px; }
  .combo { font-size: 18px; padding: 1px 8px; }
  .hud .pontos { font-size: 22px; }
  .temas { grid-template-columns: 1fr 1fr; }
  .tema .nome { font-size: 17px; }
}

/* ---------- desempenho diário ---------- */
.periodos { display: flex; flex-wrap: wrap; gap: 6px; }
.periodos .per { font-family: var(--f-titulo); font-weight: 600; font-size: 15px; letter-spacing: .03em; padding: 6px 12px; min-height: 36px;
  border: 1.5px solid var(--linha-forte); border-radius: 999px; background: var(--folha); color: var(--tinta); cursor: pointer; }
.periodos .per.ativo { background: var(--tinta); border-color: var(--tinta); color: var(--folha); }
.periodos .per:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
.grafico-box { position: relative; width: 100%; min-width: 0; }
.grafico-box svg { display: block; touch-action: pan-y; }
.grafico-box svg:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; border-radius: 4px; }
.grafico-box .eixo { fill: var(--tinta-2); font-family: var(--f-dado); font-size: 11px; }
.grafico-box .meta-t { fill: var(--azul); }
.grafico-box .grade-l { stroke: var(--linha); stroke-width: 1; opacity: .7; }
.grafico-box .base-l { stroke: var(--linha-forte); stroke-width: 1; }
.grafico-box .meta-l { stroke: var(--azul); stroke-width: 1.2; stroke-dasharray: 4 3; }
.grafico-box .seg-c { fill: var(--g-certo); } .grafico-box .seg-e { fill: var(--g-errado); } .grafico-box .seg-b { fill: var(--g-branco); }
.grafico-box .seg-0 { fill: var(--linha); }
.grafico-box .foco { fill: var(--azul); opacity: .09; pointer-events: none; }
.grafico-box .linha-acerto { fill: none; stroke: var(--azul); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }

  me('TJ29', F_TJ + '29', 'fundacoes', 'Em relação à geotecnia e suas diversas aplicações na área da construção civil, assinale a opção correta.', {
    A: 'Vane Test é o ensaio realizado em laboratório para a verificação da resistência ao cisalhamento de solos não coesivos.',
    B: 'O fenômeno da capilaridade, prejudicial na construção de pavimentos rodoviários, pode ser contornado com a substituição dos materiais arenosos pelos siltosos.',
    C: 'A geomembrana é utilizada, entre outras finalidades, para evitar a colmatação dos vazios do material constituinte de drenos.',
    D: 'O uso de camadas delgadas de areia dispostas entre camadas de argila facilita a drenagem e incrementa a velocidade de adensamento de camadas compressíveis de solo.',
    E: 'No controle de compactação, verifica-se que quanto maior é a umidade do solo menor é o seu peso específico.'
  }, 'D', 'D. Lentes de areia reduzem a distância de drenagem (Hd) e aceleram o adensamento (t ∝ Hd²). A: o Vane Test é ensaio de campo para argilas moles. B: siltes têm maior ascensão capilar. C: quem filtra e evita colmatação é o geotêxtil; a geomembrana é impermeável. E: o peso específico seco cresce com a umidade até a umidade ótima.');
  me('TJ30', F_TJ + '30', 'hidro', 'No que se refere à hidráulica e hidrologia aplicadas à engenharia civil, assinale a opção correta.', {
    A: 'A equação de Bernoulli para o escoamento dos fluidos pode ser aplicada ao escoamento de fluidos através de orifícios.',
    B: 'No escoamento dos fluidos, o movimento variado é aquele em que força, velocidade e pressão mudam de ponto para ponto, mas se mantêm constantes em cada ponto ao longo do tempo.',
    C: 'No escoamento laminar, a velocidade da água em uma seção transversal qualquer tem um perfil linear.',
    D: 'A perda de carga que ocorre no escoamento de fluidos ao longo das canalizações depende da pressão interna sob a qual o fluido escoa.',
    E: 'De acordo com o teorema de Bernoulli para o escoamento dos fluidos, a soma das cargas de velocidade, pressão e posição varia ao longo do movimento de um fluido.'
  }, 'A', 'A. A fórmula de Torricelli (v = √2gh) para orifícios sai de Bernoulli. B: a definição dada é de escoamento permanente. C: o perfil laminar é parabólico. D: a perda de carga não depende da pressão interna. E: no fluido ideal, a soma das cargas é constante.');
  me('TJ32', F_TJ + '32', 'hidro', 'Em um sistema de abastecimento, a fim de se eliminar as impurezas e melhorar as características físicas, químicas e biológicas da água, a desinfecção pode ser feita com o uso de', {
    A: 'filtração rápida.', B: 'reagentes floculadores.', C: 'aeração.', D: 'carvão ativado.', E: 'ozônio.'
  }, 'E', 'E. O ozônio é agente desinfetante, oxidante forte, assim como cloro e radiação UV. Filtração, floculação, aeração e carvão ativado são etapas de clarificação ou remoção de gosto e odor, e não de desinfecção.');
  me('TJ46', F_TJ + '46', 'manutencao', 'A atividade relativa à apuração das causas de determinado evento denomina-se', {
    A: 'parecer.', B: 'perícia.', C: 'laudo de avaliação.', D: 'vistoria.', E: 'arbitramento.'
  }, 'B', 'B. Perícia é a atividade técnica que apura as causas de um fato, evento ou dano. Vistoria é a constatação de um fato sem investigar causas. Parecer é opinião técnica. Arbitramento é a determinação de valores.');
  me('TJ47', F_TJ + '47', 'manutencao', 'De acordo com as normas vigentes, falhas construtivas que causem prejuízo material ou financeiro ao consumidor denominam-se', {
    A: 'vícios construtivos.', B: 'depreciações.', C: 'avarias.', D: 'distorções.', E: 'defeitos.'
  }, 'A', 'A. Vícios construtivos são anomalias que afetam o desempenho ou o valor do bem e causam prejuízo material ou financeiro. Na terminologia de perícias, defeito é a anomalia que pode afetar a saúde ou a segurança do usuário.');
  me('TJ49', F_TJ + '49', 'orcamento', 'Tratando-se da orçamentação de obras, a composição de custos unitários é um dos processos do método do(a)', {
    A: 'custo baseado em atividades.', B: 'quantificação.', C: 'correlação simples.', D: 'correlação múltipla.', E: 'depreciação.'
  }, 'B', 'B. No orçamento detalhado (método da quantificação), levantam-se os quantitativos e aplica-se a cada serviço uma composição de custo unitário. Os métodos por correlação estimam o custo por parâmetros globais, como o CUB por m².');
  me('TJ50', F_TJ + '50', 'orcamento', 'O custo que compõe as bonificações e despesas indiretas (BDI) e corresponde ao rateio dos custos da sede da empresa construtora denomina-se', {
    A: 'mobilização.', B: 'instalação e manutenção do canteiro.', C: 'despesas financeiras.', D: 'encargos sociais.', E: 'administração central.'
  }, 'E', 'E. Administração central é o rateio das despesas da sede. Mobilização, canteiro e administração local são custos diretos, e encargos sociais incidem sobre a mão de obra.');
  me('TJ53', F_TJ + '53', 'complementares', 'No programa AutoCAD, ao selecionar o comando rectangle e clicar um ponto da tela, deve-se digitar, para obter um retângulo de 20 unidades de largura e 10 unidades de altura,', {
    A: 'draw20x10.', B: 'write20,10.', C: '@20,10.', D: 'go20,10.', E: '#20,10.'
  }, 'C', 'C. O prefixo @ indica coordenadas relativas ao último ponto. @20,10 define o canto oposto a 20 unidades em x e 10 em y.');
  me('TJ54', F_TJ + '54', 'complementares', 'No programa AutoCAD, ao se aplicar o comando scale em um quadrado de duas unidades de medida de lado, com um fator de escala dois, ele se altera para um', {
    A: 'quadrado de oito unidades de lado.', B: 'quadrado de quatro unidades de lado.', C: 'quadrado de uma unidade de lado.', D: 'retângulo de quatro unidades de base e duas unidades de altura.', E: 'retângulo de duas unidades de base e quatro unidades de altura.'
  }, 'B', 'B. O SCALE altera o objeto uniformemente nas duas direções: 2 × 2 = 4 unidades de lado. A forma continua quadrada.');
  me('TJ55', F_TJ + '55', 'orcamento', 'Em orçamentação de obras, para o cálculo da depreciação de um equipamento, utiliza-se, entre outros, método baseado na hipótese de que a depreciação do bem varia de modo uniforme ao longo de sua vida útil. Esse método corresponde ao', {
    A: 'do serviço executado.', B: 'do índice de aproveitamento.', C: 'da correlação.', D: 'linear de depreciação.', E: 'do fundo de reserva.'
  }, 'D', 'D. No método linear, D = (Vi − Vr)/n: a depreciação é constante em cada período da vida útil. É o usado no custo horário de equipamentos (SINAPI e SICRO).');
  me('TJ57', F_TJ + '57', 'fiscalizacao', 'Considerando o que dispõe a legislação vigente sobre o exercício das profissões de engenheiro, arquiteto e agrônomo, assinale a opção correta.', {
    A: 'Caso não seja contratado para executar a obra, o autor do projeto só poderá acompanhar a sua execução mediante autorização expressa do dono do empreendimento.',
    B: 'Entidades públicas que executam atividades de engenharia estão dispensadas da fiscalização dos conselhos regionais de Engenharia, Arquitetura e Agronomia (CREA).',
    C: 'A atribuição da denominação de engenheiro a profissionais de nível médio que detenham notório saber na área de engenharia condiciona-se à aprovação do CONFEA.',
    D: 'Em órgãos públicos que realizam atividades de engenharia, para os cargos e funções de chefia, que exijam conhecimentos de engenharia, a obrigatoriedade de habilitação é dispensável.',
    E: 'Empresas construtoras somente poderão executar obras de engenharia se houver a participação efetiva e autoria declarada de profissional legalmente habilitado e registrado pelo CREA.'
  }, 'E', 'E. A Lei 5.194/1966 exige que empresas só executem obras de engenharia com participação efetiva e autoria declarada de profissional habilitado e registrado. A: o autor do projeto tem direito de acompanhar a execução. B e D: órgãos públicos também se sujeitam à fiscalização e à exigência de habilitação. C: a denominação de engenheiro é privativa dos diplomados.');
  me('TJ60', F_TJ + '60', 'fiscalizacao', 'De acordo com a NR-18, a área de vivência de um canteiro de obras inclui', {
    A: 'área de lazer.', B: 'central de concreto.', C: 'carpintaria.', D: 'almoxarifado.', E: 'guarita.'
  }, 'A', 'A. Áreas de vivência atendem às necessidades dos trabalhadores: instalações sanitárias, vestiário, local para refeições, alojamento e área de lazer (esta quando há alojamento). Central de concreto, carpintaria, almoxarifado e guarita são áreas operacionais ou de apoio.');

  /* ===================== STJ, Analista Judiciário, Engenharia Civil (edital de 2024) ===================== */
  var F_STJ = 'STJ 2024 · Cebraspe · item ';
  var cStjInst = 'A respeito de instalações prediais e seus respectivos projetos, julgue o item.';
  var cStjProc = 'Em relação aos processos empregados na construção civil, julgue o item.';
  var cStjPlan = 'Acerca de planejamento e programação de obras, julgue o item.';
  var cStjMed = 'Acerca da fiscalização e das medições de obras públicas, julgue o item.';
  var cStjCtrl = 'A respeito do controle na execução de obras e serviços de engenharia, bem como da documentação técnica constante de contratos de obras de edificações, julgue o item.';
  var cStjSond = 'Em relação às sondagens de terrenos e à locação de obras, julgue o item.';
  var cStjRcc = 'Acerca do tratamento de resíduos da construção civil, julgue o item.';
  var cStjFund = 'No que concerne a fundações e escavações, bem como a estruturas de concreto, julgue o item.';
  var cStjTrel = 'A figura representa uma treliça plana em estrutura metálica, triangular e simétrica, apoiada nos nós A e B, de vão 2a. As barras inclinadas ① (de A ao nó superior) e ⑤ (do nó superior a B) formam ângulo α com o banzo inferior, composto pelas barras ② (de A ao nó central) e ④ (do nó central a B). A barra vertical ③ liga o nó superior ao nó central inferior, no meio do vão, onde atua a carga vertical P, dirigida para baixo. Com base nesse esquema, julgue o item.';
  var cStjTec = 'No que se refere à tecnologia do concreto e aos seus materiais constituintes, julgue o item.';
  var cStjMat = 'Em relação aos materiais empregados em obras de construção civil, julgue o item.';
  var cStjMan = 'Julgue o item, a respeito da manutenção predial em edifícios públicos.';
  var cStjSst = 'Em relação à segurança do trabalho na construção civil, julgue o item, de acordo com as normas técnicas vigentes.';
  var cStjPat = 'Acerca das causas de patologias em fundações, bem como da prevenção e da recuperação de tais patologias, julgue o item.';
  var cStjLei = 'Com base na Lei n.º 14.133/2021, julgue o item, a respeito de contratação de obras e serviços de engenharia.';
  var cStjCad = 'Em relação ao uso do AutoCAD, julgue o item.';
  var cStjBim = 'Julgue o item, a respeito do sistema BIM.';
  var cStjRef = 'No que diz respeito a reforma e manutenção de edificações, julgue o item, de acordo com as normas ABNT NBR 16280, NBR 5674 e NBR 14037.';
  ce('STJ51', F_STJ + '51', 'hidro', cStjInst, 'O sistema de combate a incêndio por chuveiros automáticos (sprinklers) com tubulação molhada pode ser alimentado por reservatório elevado, desde que este seja de uso exclusivo do referido sistema.', 'E',
    'Errado. O reservatório elevado é fonte de abastecimento admitida para chuveiros automáticos, mas não precisa ser exclusivo. Pode ser compartilhado com o consumo do edifício, desde que o volume da reserva de incêndio fique permanentemente garantido, por exemplo com a tomada de consumo acima do nível da reserva. O erro está na condição de exclusividade.');
  ce('STJ52', F_STJ + '52', 'hidro', cStjInst, 'A ventilação de um sistema de esgotamento sanitário tem como funções preservar o fecho hídrico, conduzir gases para a atmosfera e aliviar sobrepressões nos elementos constituintes do sistema.', 'C',
    'Certo. Pela NBR 8160, o subsistema de ventilação protege os fechos hídricos contra a sifonagem, encaminha os gases do esgoto para a atmosfera e alivia as variações de pressão nas tubulações.');
  ce('STJ55', F_STJ + '55', 'fundacoes', cStjProc, 'Em uma obra, pode ser utilizado um concreto de resistência característica à compressão de 15 MPa para uso em estacas do tipo Strauss, pois a capacidade de carga do solo é muito inferior a esse valor.', 'E',
    'Errado. A classe do concreto da estaca decorre de requisitos estruturais e de durabilidade, não da capacidade de carga do solo. A NBR 6122 exige, para a estaca Strauss, concreto com fck mínimo de 20 MPa e consumo de cimento de pelo menos 300 kg/m³.');
  ce('STJ56', F_STJ + '56', 'execucao', cStjProc, 'Durante a execução de uma estrutura, o concreto, imediatamente após lançado, deve ser adensado por meio de vibração ou apiloamento, com equipamento próprio à sua consistência, para que ocupe todos os recantos das fôrmas e tenha o ar expulso do interior da massa, garantindo-se, assim, a obtenção da resistência definida em projeto.', 'C',
    'Certo. É o que prescreve a NBR 14931: o concreto deve ser adensado durante e imediatamente após o lançamento, por vibração ou apiloamento compatível com sua consistência, para preencher todos os recantos da fôrma e expulsar o ar aprisionado. Vazios reduzem a resistência e a durabilidade.');
  ce('STJ57', F_STJ + '57', 'orcamento', cStjPlan, 'Os encargos sociais são parte integrante do orçamento de uma obra, sendo calculados a partir da consideração de despesas com obrigações trabalhistas, como INSS e FGTS, e despesas referentes à remuneração de tempo não trabalhado, como férias, 13.º salário, licenças e abonos.', 'C',
    'Certo. Os encargos sociais incidem sobre a mão de obra e integram o custo direto. Reúnem as obrigações legais (INSS, FGTS, Sistema S, seguro contra acidentes), a remuneração de tempo não trabalhado (férias, 13.º salário, feriados, licenças) e as verbas rescisórias.');
  ce('STJ58', F_STJ + '58', 'orcamento', cStjPlan, 'No método PERT-CPM, o caminho crítico é aquele que contempla as atividades que demandarão o maior desembolso financeiro, não podendo haver folgas nos recursos monetários previstos para as respectivas etapas.', 'E',
    'Errado. O caminho crítico é a sequência de atividades de maior duração total, que define o prazo da obra e tem folga total nula. O critério é tempo, não desembolso financeiro.');
  ce('STJ59', F_STJ + '59', 'fiscalizacao', cStjMed, 'Para evitar danos ao erário, quando houver controvérsia a respeito das quantidades e(ou) da qualidade da execução de algum serviço ou parte da obra objeto do contrato, o pagamento pela execução dos serviços, inclusive da parcela incontroversa, só poderá ser liberado após o recebimento definitivo da obra.', 'E',
    'Errado. Pelo art. 143 da Lei 14.133/2021, havendo controvérsia sobre dimensão, qualidade ou quantidade, a parcela incontroversa deve ser liberada no prazo previsto para pagamento. Só a parcela controvertida fica retida.');
  ce('STJ60', F_STJ + '60', 'fiscalizacao', cStjMed, 'A remuneração de obras contratadas pelo regime de contratação semi-integrada é orientada por preços unitários, cuja medição decorre da execução de quantidades de itens unitários.', 'E',
    'Errado. Na contratação semi-integrada, assim como na empreitada por preço global, na integral e na integrada, a remuneração é associada à execução de etapas do cronograma físico-financeiro, vinculadas a metas de resultado. A lei veda a remuneração orientada por preços unitários ou por quantidades de itens unitários (art. 46, § 9.º, da Lei 14.133/2021).');
  ce('STJ61', F_STJ + '61', 'fiscalizacao', cStjCtrl, 'O caderno de encargos é um documento, elaborado pelo projetista, que descreve todos os materiais, equipamentos e serviços necessários para a execução da obra.', 'E',
    'Errado. A descrição corresponde à especificação técnica (ou memorial descritivo), que caracteriza materiais, equipamentos e serviços. O caderno de encargos é a parte do edital que define o objeto e fixa requisitos, condições e diretrizes técnicas e administrativas para a execução do contrato. É documento do contratante, não do projetista.');
  ce('STJ62', F_STJ + '62', 'materiais', cStjCtrl, 'O cálculo da dosagem do concreto a ser utilizado na obra deve ser refeito cada vez que for prevista mudança de marca, tipo ou classe do cimento, bem como mudança na procedência e na qualidade dos agregados e demais materiais.', 'C',
    'Certo. A NBR 12655 manda refazer o estudo de dosagem sempre que houver mudança de marca, tipo ou classe do cimento, ou da procedência e da qualidade dos agregados e demais materiais, pois o traço foi validado para aqueles insumos.');
  ce('STJ63', F_STJ + '63', 'execucao', cStjCtrl, 'Em se tratando de concreto autoadensável, o controle do lançamento nos elementos estruturais é feito por meio de mapeamento, a cada betonada.', 'C',
    'Certo. No concreto autoadensável não há adensamento mecânico a controlar. O controle do lançamento é feito pela rastreabilidade: registra-se (mapeia-se) em quais elementos estruturais foi aplicada cada betonada, o que permite localizar o concreto em caso de não conformidade.');
  ce('STJ64', F_STJ + '64', 'execucao', cStjSond, 'O uso da trena é dispensável quando se utiliza, na locação de uma edificação, uma estação total, instrumento eletrônico que fornece medidas lineares e angulares com grande exatidão.', 'C',
    'Certo. A estação total reúne teodolito eletrônico e distanciômetro: mede ângulos e distâncias e calcula coordenadas, o que permite locar os pontos da obra sem medição direta com trena.');
  ce('STJ65', F_STJ + '65', 'fundacoes', cStjSond, 'Sondagem mista é o método de investigação que conjuga a sondagem à percussão para o trecho em solo e a sondagem rotativa para o trecho em rocha.', 'C',
    'Certo. A sondagem mista combina a percussão (SPT) no trecho de solo com a sondagem rotativa, com coroa diamantada e retirada de testemunhos, no trecho de rocha ou de material impenetrável à percussão.');
  ce('STJ66', F_STJ + '66', 'execucao', cStjRcc, 'Resíduos da construção civil poderão ser dispostos, provisoriamente, em aterros de resíduos sólidos urbanos ou em áreas de bota-fora, desde que haja autorização por parte do órgão municipal competente.', 'E',
    'Errado. A Resolução Conama 307/2002 proíbe dispor resíduos da construção civil em aterros de resíduos sólidos urbanos, em áreas de bota-fora, em encostas, corpos d\'água, lotes vagos e áreas protegidas por lei, sem exceção para disposição provisória. Os resíduos classe A vão para reutilização, reciclagem ou aterro de resíduos classe A.');
  ce('STJ67', F_STJ + '67', 'estruturas', cStjFund, 'A laje nervurada é mais econômica em relação à laje maciça de mesma inércia, devido à redução de armação e por eliminar o concreto desnecessário na região tracionada.', 'C',
    'Certo. A laje nervurada concentra o concreto na mesa comprimida e nas nervuras e elimina o concreto da zona tracionada, que não colabora na flexão. Para a mesma inércia, o peso próprio cai, e com ele o consumo de concreto e de aço.');
  ce('STJ68', F_STJ + '68', 'fundacoes', cStjFund, 'Pelas características do processo executivo, as estacas do tipo Franki são comumente utilizadas em obras urbanas, principalmente em centros históricos onde as construções vizinhas não possam ser danificadas.', 'E',
    'Errado. A estaca Franki é cravada com pilão de queda livre e tem base alargada apiloada, o que gera vibrações e ruído intensos. É contraindicada perto de construções sensíveis, como em centros históricos, onde se preferem estacas escavadas, hélice contínua, raiz ou prensadas.');
  ce('STJ69', F_STJ + '69', 'fundacoes', cStjFund, 'A escavação manual de tubulão, acima do nível d’água ou abaixo dele, somente pode ser executada nos casos em que o solo se mantenha estável, sem risco de desmoronamento, e seja possível controlar a água no seu interior.', 'C',
    'Certo. A NBR 6122 só admite a escavação manual de tubulão, acima ou abaixo do nível d\'água, quando o solo se mantém estável, sem risco de desmoronamento, e é possível controlar a água no interior. Fora disso, usa-se revestimento, ar comprimido ou outro tipo de fundação.');
  ce('STJ70', F_STJ + '70', 'estruturas', cStjTrel, 'As barras indicadas por ②, ③ e ④ estão comprimidas.', 'E',
    'Errado. As reações verticais valem P/2. No nó A, a barra inclinada ① equilibra a reação e fica comprimida; sua componente horizontal é equilibrada pela barra ②, tracionada. O mesmo vale para ⑤ e ④. Com a carga aplicada no nó inferior, a barra ③ também é tracionada. As barras ② e ④ nunca ficam comprimidas.');
  ce('STJ71', F_STJ + '71', 'estruturas', cStjTrel, 'As reações de apoio em A e em B são iguais a P/3.', 'E',
    'Errado. A estrutura e o carregamento são simétricos, de modo que cada apoio recebe metade da carga. Do equilíbrio vertical, RA = RB = P/2.');
  ce('STJ72', F_STJ + '72', 'materiais', cStjTec, 'Durante o processo de preparação do concreto a ser colocado em uma estrutura, para se assegurar a consistência e a trabalhabilidade da massa, podem ser adicionados aditivos que contenham cloretos, desde que sejam realizados, para o recebimento e a aceitação do concreto, ensaios de consistência e de resistência à compressão.', 'E',
    'Errado. As normas (NBR 6118 e NBR 12655) não permitem aditivos com cloretos na composição em estruturas de concreto armado ou protendido, porque os íons cloreto despassivam as armaduras e desencadeiam a corrosão. Ensaios de consistência e de resistência não afastam esse risco.');
  ce('STJ73', F_STJ + '73', 'manutencao', cStjTec, 'Fissuras em elementos estruturais de concreto armado, decorrentes de reações químicas internas do concreto nas primeiras idades, podem ser evitadas ou mitigadas por meio de cuidados tecnológicos, especialmente na definição do traço e na cura do concreto.', 'C',
    'Certo. É o que dispõe a NBR 6118 sobre o controle da fissuração: fissuras por retração plástica, retração térmica ou reações químicas internas nas primeiras idades devem ser evitadas ou limitadas por cuidados tecnológicos, especialmente na definição do traço e na cura.');
  ce('STJ77', F_STJ + '77', 'execucao', cStjMat, 'Os compostos orgânicos voláteis presentes nas tintas látex são os responsáveis por tornar a suspensão fluida, viabilizando sua aplicação.', 'E',
    'Errado. Nas tintas látex, de base aquosa, o veículo volátil que dá fluidez é a água. Os compostos orgânicos voláteis aparecem em pequena proporção, como coalescentes e aditivos. Eles são o veículo típico das tintas à base de solvente, como esmaltes sintéticos e vernizes.');
  ce('STJ78', F_STJ + '78', 'materiais', cStjMat, 'O cimento Portland de alta resistência inicial, designado como CP V, confere ao concreto um módulo de deformação a baixas idades inferior ao que seria obtido com o emprego de cimento Portland composto CP II E, nas mesmas condições.', 'E',
    'Errado. O CP V-ARI tem clínquer mais fino e em maior teor, hidrata mais rápido e ganha resistência e rigidez nas primeiras idades. O CP II-E, com escória, evolui mais devagar. A baixas idades, o módulo de deformação com CP V é maior, não menor.');
  ce('STJ79', F_STJ + '79', 'manutencao', cStjMat, 'A pulverulência em argamassas de revestimento pode ser causada por excesso de finos no aglomerado ou traço pobre em aglomerante.', 'C',
    'Certo. A pulverulência, em que o revestimento esfarela ao toque, decorre de excesso de finos, de traço pobre em aglomerante ou de carbonatação deficiente da cal, fatores que deixam a argamassa sem coesão.');
  ce('STJ80', F_STJ + '80', 'materiais', cStjMat, 'O concreto estrutural deve ser dosado de modo a se obter uma resistência média igual ou superior à resistência característica especificada em projeto, pois o cálculo desta leva em consideração o desvio padrão decorrente das condições de preparo.', 'E',
    'Errado. A resistência característica (fck) é fixada pelo projetista e não depende do desvio padrão. Quem considera o desvio padrão das condições de preparo é a resistência de dosagem: fcmj = fckj + 1,65·Sd. A média visada deve, portanto, superar o fck com essa margem, e não apenas igualá-lo.');
  ce('STJ81', F_STJ + '81', 'materiais', cStjMat, 'O aditivo redutor de água tipo 2, conhecido comercialmente como superplastificante, tem a função principal de promover a incorporação de ar na produção de concreto leve de maior fluidez, com densidade inferior a 2.000 kg/m³.', 'E',
    'Errado. O superplastificante dispersa as partículas de cimento: permite grande redução da água de amassamento com a mesma consistência, ou grande aumento da fluidez com a mesma água. Incorporar ar é função do aditivo incorporador de ar, e concreto leve se obtém com agregados leves ou espumas.');
  ce('STJ82', F_STJ + '82', 'materiais', cStjMat, 'O aço patinável, próprio para estruturas metálicas aparentes, possui maior resistência à corrosão devido a uma camada de óxido protetora que se forma durante sua exposição à atmosfera.', 'C',
    'Certo. Os aços patináveis contêm pequenos teores de cobre, cromo e níquel, entre outros elementos. Expostos a ciclos de molhagem e secagem, formam a pátina, camada de óxido densa e aderente que reduz a velocidade da corrosão.');
  ce('STJ83', F_STJ + '83', 'materiais', cStjMat, 'A resistência à compressão de peças estruturais de madeira é maior quando a força é aplicada na direção perpendicular às fibras do que quando aplicada na direção paralela.', 'E',
    'Errado. A madeira é anisotrópica e resiste muito mais à compressão paralela às fibras. Na direção normal às fibras, a resistência é apenas uma fração daquela, da ordem de um quarto pela NBR 7190.');
  ce('STJ84', F_STJ + '84', 'materiais', cStjMat, 'Salvo polimento leve, o vidro temperado não pode sofrer recortes, perfurações ou lapidações.', 'C',
    'Certo. A têmpera cria tensões de compressão na superfície e de tração no núcleo. Qualquer corte, furo ou lapidação posterior rompe esse equilíbrio e estilhaça a peça. Todo o beneficiamento é feito antes da têmpera; depois, admite-se apenas polimento leve.');
  ce('STJ85', F_STJ + '85', 'materiais', cStjMat, 'O porcelanato é uma placa fina totalmente vitrificada, conformada por extrusão ou prensagem, com coeficiente de absorção de água igual ou inferior a uma fração de massa de 0,5%.', 'C',
    'Certo. É a definição normativa de porcelanato: placa cerâmica totalmente vitrificada, conformada por prensagem ou extrusão, com absorção de água de até 0,5%.');
  ce('STJ86', F_STJ + '86', 'manutencao', cStjMan, 'A manutenção preditiva busca reduzir ao mínimo a manutenção preventiva e diminuir a manutenção corretiva.', 'C',
    'Certo. A manutenção preditiva monitora o estado real dos sistemas (vibração, temperatura, termografia, análise de óleo) e intervém só quando os parâmetros indicam necessidade. Com isso reduz as paradas preventivas programadas e evita as corretivas por falha.');
  ce('STJ87', F_STJ + '87', 'manutencao', cStjMan, 'A gestão do sistema de manutenção deve incluir meios para preservar as características originais da edificação.', 'C',
    'Certo. Pela NBR 5674, a gestão do sistema de manutenção deve considerar meios para preservar as características originais da edificação e para prevenir a perda de desempenho decorrente da degradação de seus sistemas, elementos e componentes.');
  ce('STJ88', F_STJ + '88', 'fiscalizacao', cStjMan, 'Quando as quantidades, os itens ou os serviços demandados para a manutenção predial forem incertos ou difíceis de serem estabelecidos, o gestor pode adotar o critério de julgamento pelo maior desconto no processo licitatório para a aquisição dos insumos.', 'C',
    'Certo. A Lei 14.133/2021 admite o julgamento por maior desconto, tendo como referência o preço fixado no edital (art. 34, § 2.º). O critério é usual em manutenção predial com demanda incerta: licita-se o desconto linear sobre uma tabela de referência, como o SINAPI.');
  ce('STJ89', F_STJ + '89', 'fiscalizacao', cStjSst, 'Caso seja necessária a instalação, no canteiro de obras ou fora dele, de alojamento, este deverá contemplar área de lazer para recreação dos trabalhadores alojados, podendo ser utilizado o local de refeição para esse fim.', 'C',
    'Certo. A NR-18 exige que o alojamento, no canteiro ou fora dele, disponha de área de lazer para recreação dos trabalhadores alojados e admite o uso do local de refeições para esse fim.');
  ce('STJ90', F_STJ + '90', 'fiscalizacao', cStjSst, 'Cabe ao fabricante e ao importador de EPI promover, quando solicitado e se tecnicamente possível, a adaptação de EPI para pessoas com deficiência, sendo, nesse caso, necessária a emissão de novo certificado de aprovação (CA), visto que a referida adaptação invalida o CA já emitido.', 'E',
    'Errado. A NR-6 atribui ao fabricante e ao importador o dever de promover, quando solicitado e tecnicamente possível, a adaptação do EPI para pessoas com deficiência. Essa adaptação, feita pelo detentor do certificado, não invalida o CA já emitido, e novo certificado é desnecessário.');
  ce('STJ91', F_STJ + '91', 'fiscalizacao', cStjSst, 'O fornecimento de protetor solar, listado nas normas técnicas vigentes como EPI para proteção facial, é de responsabilidade da organização.', 'E',
    'Errado. O protetor solar não consta do Anexo I da NR-6, que lista os EPI, e não possui certificado de aprovação. Seu fornecimento pode decorrer do programa de gerenciamento de riscos ou de norma coletiva, mas não da condição de EPI para proteção facial.');
  ce('STJ92', F_STJ + '92', 'fiscalizacao', cStjSst, 'A inspeção periódica do sistema de ancoragem para trabalho em altura deve ser efetuada com periodicidade não superior a 12 meses.', 'C',
    'Certo. O Anexo II da NR-35, sobre sistemas de ancoragem, exige inspeção inicial e inspeções periódicas, estas com intervalo não superior a 12 meses.');
  ce('STJ93', F_STJ + '93', 'fiscalizacao', cStjSst, 'É obrigatória a utilização de sistema de proteção individual contra quedas (SPIQ) em escadas do tipo fixa vertical com altura superior a 2 metros.', 'C',
    'Certo. A NR-18, ao tratar de escadas, exige sistema de proteção individual contra quedas (SPIQ) no uso de escada fixa vertical com altura superior a 2 m.');
  ce('STJ94', F_STJ + '94', 'fiscalizacao', cStjSst, 'Os pontos de ancoragem estrutural devem apresentar marcação, realizada pelo fabricante ou responsável técnico, que contenha: a identificação do fabricante; o número de lote, de série ou outro meio que permita a rastreabilidade; e o número máximo de trabalhadores que podem estar conectados simultaneamente àquele ponto ou a força máxima aplicável a ele.', 'C',
    'Certo. É o conteúdo mínimo de marcação que o Anexo II da NR-35 exige para os pontos de ancoragem: identificação do fabricante, lote ou série para rastreabilidade e número máximo de trabalhadores conectados simultaneamente ou força máxima aplicável.');
  ce('STJ95', F_STJ + '95', 'fundacoes', cStjPat, 'Entre as técnicas disponíveis no mercado para a recuperação de fundações de grandes obras está o jet grouting, caracterizado pela execução de colunas de solo-cimento através da perfuração, do jateamento e da desagregação do solo com calda de cimento a altas velocidades.', 'C',
    'Certo. No jet grouting, uma haste perfura o terreno e, na subida, injeta calda de cimento em jatos de alta velocidade, que desagregam o solo e o misturam à calda, formando colunas de solo-cimento. A técnica serve a reforço de fundações, contenções e tratamento de solos.');
  ce('STJ96', F_STJ + '96', 'fundacoes', cStjPat, 'A execução de fundações superficiais em solos e(ou) aterros heterogêneos poderá provocar o surgimento de recalques diferenciais na estrutura; para a prevenção dessas patologias, recomenda-se aumentar a resistência à compressão do concreto, garantindo-se, assim, a ausência de recalques diferenciais na fundação.', 'E',
    'Errado. O recalque diferencial depende da deformabilidade e da heterogeneidade do solo e da distribuição das cargas, não da resistência do concreto da fundação. Previne-se com investigação geotécnica adequada, troca ou melhoria do solo, fundações profundas, radier ou juntas.');
  ce('STJ97', F_STJ + '97', 'fiscalizacao', cStjLei, 'Nas contratações de obras com ordem de paralisação superior a um mês, o contratado deverá divulgar aviso público de obra paralisada.', 'E',
    'Errado. A obrigação é da Administração, não do contratado. Paralisada a obra por mais de um mês, ela deve divulgar, em sítio eletrônico oficial e em placa no local, aviso público de obra paralisada, com o motivo, o responsável pela inexecução e a data prevista de reinício (art. 115, § 6.º).');
  ce('STJ98', F_STJ + '98', 'fiscalizacao', cStjLei, 'Trabalhos relativos ao gerenciamento de obras e serviços são classificados como serviços técnicos especializados de natureza predominantemente intelectual.', 'C',
    'Certo. O art. 6.º, XVIII, da lei inclui a fiscalização, a supervisão e o gerenciamento de obras e serviços entre os serviços técnicos especializados de natureza predominantemente intelectual.');
  ce('STJ99', F_STJ + '99', 'fiscalizacao', cStjLei, 'Nas contratações de obras de grande vulto, o edital deverá prever a obrigatoriedade de implantação de programa de integridade pelo licitante vencedor, no prazo de 6 meses.', 'C',
    'Certo. É o art. 25, § 4.º: nas contratações de grande vulto, o edital deve prever a implantação de programa de integridade pelo licitante vencedor em até 6 meses da celebração do contrato.');
  ce('STJ100', F_STJ + '100', 'fiscalizacao', cStjLei, 'A matriz de riscos é uma cláusula contratual definidora de riscos e de responsabilidades entre as partes, sendo obrigatória na contratação de todas as obras públicas.', 'E',
    'Errado. O conceito está correto (art. 6.º, XXVII), mas a matriz de riscos só é obrigatória nas obras e serviços de grande vulto e nos regimes de contratação integrada e semi-integrada (art. 22, § 3.º). Nos demais casos é facultativa.');
  ce('STJ103', F_STJ + '103', 'complementares', cStjCad, 'O comando EXTEND permite que um bloco seja quebrado em partes individuais editáveis.', 'E',
    'Errado. Quem decompõe um bloco em objetos individuais editáveis é o comando EXPLODE. O EXTEND prolonga um objeto até encontrar outro, usado como limite.');
  ce('STJ104', F_STJ + '104', 'complementares', cStjCad, 'Com o comando MIRROR, pode-se criar a metade de um desenho e, em seguida, selecioná-lo e espelhá-lo através de uma linha, a fim de criar a outra metade.', 'C',
    'Certo. O MIRROR cria uma cópia espelhada dos objetos selecionados em relação a uma linha definida por dois pontos, com a opção de manter ou apagar o original. É o recurso típico para desenhos simétricos.');
  ce('STJ105', F_STJ + '105', 'complementares', cStjCad, 'O comando ARRAY permite que se criem múltiplas cópias de um objeto, obedecendo-se a um padrão.', 'C',
    'Certo. O ARRAY gera cópias múltiplas de um objeto dispostas segundo um padrão: retangular (linhas e colunas), polar (em torno de um centro) ou ao longo de um caminho.');
  ce('STJ106', F_STJ + '106', 'complementares', cStjCad, 'Por meio do comando PLINE, é possível criar um retângulo e dimensioná-lo no tamanho desejado.', 'C',
    'Certo. A PLINE desenha uma polilinha, sequência de segmentos tratada como objeto único. Informando os comprimentos dos lados e fechando a figura, obtém-se um retângulo com as dimensões desejadas, embora exista o comando específico RECTANG.');
  ce('STJ107', F_STJ + '107', 'complementares', cStjBim, 'Desde a primeira fase de implementação do sistema BIM, a sua utilização passou a ser obrigatória na execução direta ou indireta de projetos de arquitetura e engenharia, abrangendo a orçamentação, o planejamento e o controle da execução de obras.', 'E',
    'Errado. Pelo Decreto 10.306/2020, a primeira fase (2021) alcança só o desenvolvimento de projetos de arquitetura e engenharia: modelos das disciplinas, detecção de interferências, extração de quantitativos e documentação gráfica. Orçamentação, planejamento e controle da execução entram na segunda fase (2024).');
  ce('STJ108', F_STJ + '108', 'complementares', cStjBim, 'A atualização do modelo e de suas informações como construído (as built) deverá ser realizada na segunda fase de implementação do sistema BIM, para obras cujos projetos de arquitetura e engenharia tenham sido realizados ou executados com a aplicação do BIM.', 'C',
    'Certo. Pelo Decreto 10.306/2020, a segunda fase (a partir de 2024) acrescenta aos usos da primeira a orçamentação, o planejamento e o controle da execução de obras e a atualização do modelo como construído (as built), para obras cujos projetos tenham sido feitos em BIM.');
  ce('STJ110', F_STJ + '110', 'complementares', cStjBim, 'Na sua segunda fase de implementação, o sistema BIM deve ser utilizado no desenvolvimento de projetos de arquitetura e engenharia, devendo abranger, inclusive, o gerenciamento e a manutenção do empreendimento após a sua construção.', 'E',
    'Errado. Pelo Decreto 10.306/2020, o gerenciamento e a manutenção do empreendimento após a construção só passam a ser exigidos na terceira fase, a partir de 2028. A segunda fase vai até a execução da obra e o as built.');
  ce('STJ115', F_STJ + '115', 'manutencao', cStjRef, 'O construtor deve fornecer ao proprietário o manual de uso, operação e manutenção da edificação, contendo o programa de manutenção a ser obedecido pelo usuário e as condições de garantia.', 'E',
    'Errado. O manual, elaborado e entregue pelo construtor ou incorporador conforme a NBR 14037, traz as garantias e as informações e o modelo para o programa de manutenção. O programa em si é elaborado e implantado pelo proprietário ou síndico, responsável pela gestão da manutenção segundo a NBR 5674.');
  ce('STJ116', F_STJ + '116', 'manutencao', cStjRef, 'A norma que define os requisitos mínimos para elaboração dos manuais de uso, operação e manutenção das edificações aplica-se a edificações em geral, independentemente da altura, da tipologia ou do padrão construtivo.', 'C',
    'Certo. A NBR 14037 fixa os requisitos mínimos de conteúdo e de apresentação do manual de uso, operação e manutenção e vale para edificações em geral, sem distinção de altura, tipologia ou padrão construtivo.');
  ce('STJ117', F_STJ + '117', 'manutencao', cStjRef, 'Durante a realização das obras de reforma, todos os sistemas de segurança da edificação devem permanecer em funcionamento, ou, se necessário, devem ser previstos sistemas alternativos.', 'C',
    'Certo. A NBR 16280 exige que, durante a obra de reforma, os sistemas de segurança da edificação permaneçam em funcionamento ou sejam substituídos por sistemas alternativos, para não expor usuários e vizinhos a risco.');
  ce('STJ118', F_STJ + '118', 'manutencao', cStjRef, 'As periodicidades mínimas indicadas em norma para a inspeção de sistemas prediais usuais podem ser reduzidas em função das características específicas da edificação, mas não ampliadas.', 'E',
    'Errado. As periodicidades do modelo de programa de manutenção da NBR 5674 são referenciais. Devem ser ajustadas às características da edificação, ao uso, ao ambiente e às recomendações de projetistas e fabricantes, podendo ser reduzidas ou ampliadas com fundamento técnico.');
  ce('STJ119', F_STJ + '119', 'manutencao', cStjRef, 'A obrigatoriedade dos programas de manutenção não se aplica às edificações cujos projetos de construção tenham sido protocolados para aprovação, no órgão competente pelo licenciamento, antes da vigência da norma que estabelece a referida obrigatoriedade.', 'E',
    'Errado. A NBR 5674 alcança também as edificações existentes antes de sua vigência, que devem adequar ou criar seus programas de manutenção.');

  /* ===================== TRF da 6.ª Região, Analista Judiciário, Engenharia Civil (edital de 2024) ===================== */
  var F_TRF6 = 'TRF6 2024 · Cebraspe · item ';
  var cTrf6Rod = 'No que se refere a planejamento e execução de rodovias, julgue o item.';
  var cTrf6Edif = 'Em relação a projeto e execução de edificações, julgue o item.';
  var cTrf6Inst = 'A respeito de instalações prediais, julgue o item.';
  var cTrf6Conc = 'Acerca do concreto de cimento Portland, material amplamente utilizado na construção civil, julgue o item.';
  var cTrf6Solos = 'Em relação à mecânica dos solos, julgue o item.';
  var cTrf6Res = 'Acerca da resistência dos materiais e análise estrutural, julgue o item.';
  var cTrf6Dim = 'Com base no dimensionamento de elementos estruturais, julgue o item.';
  var cTrf6Custos = 'Julgue o item, com base na engenharia de custos.';
